<!doctype html>
<html lang="fr" class="dark h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#A8FF00" />
    <meta
      name="description"
      content="Kinetic — ton système d'exploitation quotidien pour la performance"
    />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kinetic" />

    <title>Kinetic — Performance OS</title>
  </head>

  <body
    class="h-full bg-kinetic-ink text-gray-100 antialiased"
    x-data="navShell"
    @kinetic:route-changed.window="setPath($event.detail.path)"
  >
    <!-- Skip to main content (accessibility) -->
    <a
      href="#app-outlet"
      class="sr-only focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-[100] focus:px-4 focus:py-2 focus:bg-kinetic-neon focus:text-gray-950 focus:rounded-lg focus:font-semibold focus:shadow-xl"
    >
      Aller au contenu principal
    </a>

    <!-- Toasts (announced to screen readers via aria-live) -->
    <div
      class="fixed top-4 right-4 z-50 flex flex-col gap-2 pointer-events-none max-w-xs w-full"
      role="region"
      aria-label="Notifications"
      aria-live="polite"
      aria-atomic="false"
    >
      <template x-for="toast in $store.notifications.toasts" :key="toast.id">
        <div
          class="pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-xl text-white shadow-xl text-sm transition-all duration-300"
          :class="[
             $store.notifications.kindClass(toast.kind),
             toast.visible ? 'opacity-100 translate-y-0' : 'opacity-0 -translate-y-2'
           ]"
          :role="toast.kind === 'error' ? 'alert' : 'status'"
        >
          <span x-text="toast.message" class="flex-1"></span>
          <button
            @click="$store.notifications.dismiss(toast.id)"
            type="button"
            aria-label="Fermer la notification"
            class="text-white/60 hover:text-white text-xs ml-1"
          >
            ✕
          </button>
        </div>
      </template>
    </div>

    <!-- Offline banner (announced as status to assistive tech) -->
    <div
      x-show="$store.offline.isOffline || $store.offline.wasOffline"
      x-transition
      role="status"
      aria-live="polite"
      class="fixed bottom-20 inset-x-0 mx-auto max-w-sm px-4 z-50"
    >
      <div
        :class="$store.offline.isOffline
                 ? 'bg-kinetic-surface text-white ring-1 ring-white/10'
                 : 'bg-gradient-to-r from-kinetic-neon to-lime-400 text-gray-950 shadow-[0_0_20px_rgba(168,255,0,0.4)]'"
        class="rounded-2xl px-4 py-3 flex items-center gap-3 shadow-xl text-sm"
      >
        <span
          class="text-lg flex-shrink-0"
          aria-hidden="true"
          x-text="$store.offline.isOffline ? '📡' : '✅'"
        ></span>
        <div class="flex-1">
          <p
            class="font-semibold"
            x-text="$store.offline.isOffline ? 'Mode hors ligne' : 'De retour en ligne'"
          ></p>
          <p
            class="text-xs opacity-75"
            x-show="$store.offline.isOffline"
            x-text="'Données sauvegardées localement'"
          ></p>
        </div>
      </div>
    </div>

    <!-- Navigation principale -->
    <nav
      x-show="$store.auth.isAuthenticated"
      aria-label="Navigation principale"
      class="fixed bottom-0 inset-x-0 bg-[rgba(7,7,11,0.88)] backdrop-blur-[28px] border-t border-white/[0.07] z-40 pt-2 pb-[calc(env(safe-area-inset-bottom)+0.75rem)]"
    >
      <div class="max-w-md mx-auto flex items-center justify-around px-1">
        <a
          href="/"
          :aria-current="currentPath === '/' ? 'page' : null"
          class="relative flex flex-col items-center gap-1 px-2.5 py-1.5 rounded-2xl transition-all min-w-0"
          :class="currentPath === '/' ? 'text-kinetic-neon -translate-y-px' : 'text-white/25 hover:text-white/60'"
        >
          <svg
            aria-hidden="true"
            focusable="false"
            class="w-[22px] h-[22px] flex-shrink-0 transition-[filter]"
            :class="currentPath === '/' ? 'drop-shadow-[0_0_8px_rgb(var(--kinetic-neon)/0.6)]' : ''"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
            <polyline points="9 22 9 12 15 12 15 22" />
          </svg>
          <span
            class="text-[10px]"
            :class="currentPath === '/' ? 'font-bold' : 'font-medium'"
            x-text="$t('nav.dashboard')"
          ></span>
          <span
            x-show="currentPath === '/'"
            class="absolute bottom-0.5 w-1 h-1 rounded-full bg-kinetic-neon shadow-[0_0_6px_rgb(var(--kinetic-neon)/0.8)]"
          ></span>
        </a>

        <a
          href="/seances"
          :aria-current="currentPath === '/seances' ? 'page' : null"
          class="relative flex flex-col items-center gap-1 px-2.5 py-1.5 rounded-2xl transition-all min-w-0"
          :class="currentPath === '/seances' ? 'text-kinetic-neon -translate-y-px' : 'text-white/25 hover:text-white/60'"
        >
          <svg
            aria-hidden="true"
            focusable="false"
            class="w-[22px] h-[22px] flex-shrink-0 transition-[filter]"
            :class="currentPath === '/seances' ? 'drop-shadow-[0_0_8px_rgb(var(--kinetic-neon)/0.6)]' : ''"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M6 7h2m8 0h2M5 9v6a2 2 0 002 2h1v2h2v-2h4v2h2v-2h1a2 2 0 002-2V9M8 7V5a1 1 0 011-1h6a1 1 0 011 1v2"
            />
          </svg>
          <span
            class="text-[10px]"
            :class="currentPath === '/seances' ? 'font-bold' : 'font-medium'"
            x-text="$t('nav.sessions')"
          ></span>
          <span
            x-show="currentPath === '/seances'"
            class="absolute bottom-0.5 w-1 h-1 rounded-full bg-kinetic-neon shadow-[0_0_6px_rgb(var(--kinetic-neon)/0.8)]"
          ></span>
        </a>

        <a
          href="/bodyweight"
          :aria-current="isBodyPage() ? 'page' : null"
          class="relative flex flex-col items-center gap-1 px-2.5 py-1.5 rounded-2xl transition-all min-w-0"
          :class="isBodyPage() ? 'text-kinetic-neon -translate-y-px' : 'text-white/25 hover:text-white/60'"
        >
          <svg
            aria-hidden="true"
            focusable="false"
            class="w-[22px] h-[22px] flex-shrink-0 transition-[filter]"
            :class="isBodyPage() ? 'drop-shadow-[0_0_8px_rgb(var(--kinetic-neon)/0.6)]' : ''"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="2" y="7" width="20" height="14" rx="3" />
            <path d="M16 7V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v2" />
            <line x1="12" y1="12" x2="12" y2="16" />
            <line x1="10" y1="14" x2="14" y2="14" />
          </svg>
          <span class="text-[10px]" :class="isBodyPage() ? 'font-bold' : 'font-medium'">Corps</span>
          <span
            x-show="isBodyPage()"
            class="absolute bottom-0.5 w-1 h-1 rounded-full bg-kinetic-neon shadow-[0_0_6px_rgb(var(--kinetic-neon)/0.8)]"
          ></span>
        </a>

        <a
          href="/vitalite"
          :aria-current="currentPath === '/vitalite' ? 'page' : null"
          class="relative flex flex-col items-center gap-1 px-2.5 py-1.5 rounded-2xl transition-all min-w-0"
          :class="currentPath === '/vitalite' ? 'text-kinetic-neon -translate-y-px' : 'text-white/25 hover:text-white/60'"
        >
          <svg
            aria-hidden="true"
            focusable="false"
            class="w-[22px] h-[22px] flex-shrink-0 transition-[filter]"
            :class="currentPath === '/vitalite' ? 'drop-shadow-[0_0_8px_rgb(var(--kinetic-neon)/0.6)]' : ''"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"
            />
          </svg>
          <span
            class="text-[10px]"
            :class="currentPath === '/vitalite' ? 'font-bold' : 'font-medium'"
            >Vitalité</span
          >
          <span
            x-show="currentPath === '/vitalite'"
            class="absolute bottom-0.5 w-1 h-1 rounded-full bg-kinetic-neon shadow-[0_0_6px_rgb(var(--kinetic-neon)/0.8)]"
          ></span>
        </a>

        <a
          href="/profile"
          :aria-current="currentPath === '/profile' ? 'page' : null"
          class="relative flex flex-col items-center gap-1 px-2.5 py-1.5 rounded-2xl transition-all min-w-0"
          :class="currentPath === '/profile' ? 'text-kinetic-neon -translate-y-px' : 'text-white/25 hover:text-white/60'"
        >
          <svg
            aria-hidden="true"
            focusable="false"
            class="w-[22px] h-[22px] flex-shrink-0 transition-[filter]"
            :class="currentPath === '/profile' ? 'drop-shadow-[0_0_8px_rgb(var(--kinetic-neon)/0.6)]' : ''"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" />
            <circle cx="12" cy="7" r="4" />
          </svg>
          <span
            class="text-[10px]"
            :class="currentPath === '/profile' ? 'font-bold' : 'font-medium'"
            x-text="$t('nav.profile')"
          ></span>
          <span
            x-show="currentPath === '/profile'"
            class="absolute bottom-0.5 w-1 h-1 rounded-full bg-kinetic-neon shadow-[0_0_6px_rgb(var(--kinetic-neon)/0.8)]"
          ></span>
        </a>
      </div>
    </nav>

    <!-- Outlet principal -->
    <main
      id="app-outlet"
      tabindex="-1"
      aria-busy="false"
      class="min-h-screen pb-28 focus:outline-none"
    >
      <!-- Skeleton de chargement initial -->
      <div class="max-w-md mx-auto px-4 pt-8 animate-pulse space-y-4">
        <div class="flex justify-between items-center">
          <div class="space-y-2">
            <div class="h-6 bg-kinetic-elevated rounded w-40"></div>
            <div class="h-4 bg-kinetic-elevated rounded w-32"></div>
          </div>
          <div class="w-10 h-10 bg-kinetic-elevated rounded-full"></div>
        </div>
        <div class="h-20 bg-kinetic-surface rounded-k"></div>
        <div class="h-32 bg-kinetic-surface rounded-k"></div>
        <div class="h-16 bg-kinetic-surface rounded-k"></div>
      </div>
    </main>

    <!-- ── PWA install banner ──────────────────────────────────────────── -->
    <div
      x-data="pwaInstallPrompt"
      x-init="init()"
      x-show="visible"
      x-transition:enter="transition ease-out duration-300"
      x-transition:enter-start="opacity-0 translate-y-4"
      x-transition:enter-end="opacity-100 translate-y-0"
      x-transition:leave="transition ease-in duration-200"
      x-transition:leave-start="opacity-100 translate-y-0"
      x-transition:leave-end="opacity-0 translate-y-4"
      class="fixed bottom-20 left-4 right-4 max-w-md mx-auto z-40 bg-kinetic-surface border border-kinetic-neon/30 rounded-2xl p-4 shadow-2xl"
      style="display: none"
    >
      <div class="flex items-start gap-3">
        <div
          class="flex-shrink-0 w-10 h-10 bg-kinetic-neon/20 rounded-xl flex items-center justify-center text-xl"
        >
          ⬇️
        </div>
        <div class="flex-1 min-w-0">
          <p class="text-white font-bold text-sm mb-0.5">Installer Kinetic</p>
          <p class="text-xs text-gray-400 leading-relaxed" x-show="!isIos">
            Accède plus vite à tes séances depuis ton écran d'accueil.
          </p>
          <p class="text-xs text-gray-400 leading-relaxed" x-show="isIos">
            Appuie sur Partager (□↑) puis « Sur l'écran d'accueil ».
          </p>
        </div>
      </div>
      <div class="flex gap-2 mt-3">
        <button
          @click="dismiss()"
          class="flex-1 text-xs text-gray-400 px-3 py-2 rounded-lg ring-1 ring-white/10 hover:ring-white/30"
        >
          Plus tard
        </button>
        <button
          x-show="!isIos"
          @click="install()"
          class="flex-1 text-xs font-bold text-gray-950 bg-kinetic-neon px-3 py-2 rounded-lg hover:brightness-110"
        >
          Installer
        </button>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
