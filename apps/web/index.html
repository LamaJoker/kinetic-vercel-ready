<!DOCTYPE html>
<html lang="fr" class="dark h-full">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#A8FF00"/>
  <meta name="description" content="Kinetic — ton système d'exploitation quotidien pour la performance"/>

  <link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
  <link rel="manifest" href="/manifest.json"/>
  <link rel="apple-touch-icon" href="/icons/icon-192.png"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Kinetic"/>

  <title>Kinetic — Performance OS</title>
</head>

<body class="h-full bg-kinetic-ink text-gray-100 antialiased"
      x-data>

  <!-- Toasts -->
  <div class="fixed top-4 right-4 z-50 flex flex-col gap-2 pointer-events-none max-w-xs w-full">
    <template x-for="toast in $store.notifications.toasts" :key="toast.id">
      <div class="pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-xl text-white
                  shadow-xl text-sm transition-all duration-300"
           :class="[
             $store.notifications.kindClass(toast.kind),
             toast.visible ? 'opacity-100 translate-y-0' : 'opacity-0 -translate-y-2'
           ]">
        <span x-text="toast.message" class="flex-1"></span>
        <button @click="$store.notifications.dismiss(toast.id)"
                class="text-white/60 hover:text-white text-xs ml-1">✕</button>
      </div>
    </template>
  </div>

  <!-- Offline banner -->
  <div x-show="$store.offline.isOffline || $store.offline.wasOffline"
       x-transition
       class="fixed bottom-20 inset-x-0 mx-auto max-w-sm px-4 z-50">
    <div :class="$store.offline.isOffline
                 ? 'bg-kinetic-surface text-white ring-1 ring-white/10'
                 : 'bg-gradient-to-r from-kinetic-neon to-lime-400 text-gray-950 shadow-[0_0_20px_rgba(168,255,0,0.4)]'"
         class="rounded-2xl px-4 py-3 flex items-center gap-3 shadow-xl text-sm">
      <span class="text-lg flex-shrink-0"
            x-text="$store.offline.isOffline ? '📡' : '✅'"></span>
      <div class="flex-1">
        <p class="font-semibold"
           x-text="$store.offline.isOffline ? 'Mode hors ligne' : 'De retour en ligne'"></p>
        <p class="text-xs opacity-75"
           x-show="$store.offline.isOffline"
           x-text="'Données sauvegardées localement'"></p>
      </div>
    </div>
  </div>

  <!-- Navigation principale -->
  <nav x-show="$store.auth.isAuthenticated"
       class="fixed bottom-0 inset-x-0 bg-[rgba(7,7,11,0.88)] backdrop-blur-[28px]
              border-t border-white/[0.07] z-40
              pt-2 pb-[calc(env(safe-area-inset-bottom)+0.75rem)]">
    <div class="max-w-md mx-auto flex items-center justify-around px-1">

      <a href="/"
         class="relative flex flex-col items-center gap-1 px-2.5 py-1.5 rounded-2xl transition-all min-w-0"
         :class="location.pathname === '/' ? 'text-kinetic-neon -translate-y-px' : 'text-white/25 hover:text-white/60'">
        <svg class="w-[22px] h-[22px] flex-shrink-0 transition-[filter]"
             :class="location.pathname === '/' ? 'drop-shadow-[0_0_8px_rgb(var(--kinetic-neon)/0.6)]' : ''"
             fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span class="text-[10px]" :class="location.pathname === '/' ? 'font-bold' : 'font-medium'">Accueil</span>
        <span x-show="location.pathname === '/'" class="absolute bottom-0.5 w-1 h-1 rounded-full bg-kinetic-neon shadow-[0_0_6px_rgb(var(--kinetic-neon)/0.8)]"></span>
      </a>

      <a href="/seances"
         class="relative flex flex-col items-center gap-1 px-2.5 py-1.5 rounded-2xl transition-all min-w-0"
         :class="location.pathname === '/seances' ? 'text-kinetic-neon -translate-y-px' : 'text-white/25 hover:text-white/60'">
        <svg class="w-[22px] h-[22px] flex-shrink-0 transition-[filter]"
             :class="location.pathname === '/seances' ? 'drop-shadow-[0_0_8px_rgb(var(--kinetic-neon)/0.6)]' : ''"
             fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 7h2m8 0h2M5 9v6a2 2 0 002 2h1v2h2v-2h4v2h2v-2h1a2 2 0 002-2V9M8 7V5a1 1 0 011-1h6a1 1 0 011 1v2"/>
        </svg>
        <span class="text-[10px]" :class="location.pathname === '/seances' ? 'font-bold' : 'font-medium'">Séances</span>
        <span x-show="location.pathname === '/seances'" class="absolute bottom-0.5 w-1 h-1 rounded-full bg-kinetic-neon shadow-[0_0_6px_rgb(var(--kinetic-neon)/0.8)]"></span>
      </a>

      <a href="/bodyweight"
         class="relative flex flex-col items-center gap-1 px-2.5 py-1.5 rounded-2xl transition-all min-w-0"
         :class="['/bodyweight','/mensurations'].includes(location.pathname) ? 'text-kinetic-neon -translate-y-px' : 'text-white/25 hover:text-white/60'">
        <svg class="w-[22px] h-[22px] flex-shrink-0 transition-[filter]"
             :class="['/bodyweight','/mensurations'].includes(location.pathname) ? 'drop-shadow-[0_0_8px_rgb(var(--kinetic-neon)/0.6)]' : ''"
             fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="7" width="20" height="14" rx="3"/>
          <path d="M16 7V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v2"/>
          <line x1="12" y1="12" x2="12" y2="16"/>
          <line x1="10" y1="14" x2="14" y2="14"/>
        </svg>
        <span class="text-[10px]" :class="['/bodyweight','/mensurations'].includes(location.pathname) ? 'font-bold' : 'font-medium'">Corps</span>
        <span x-show="['/bodyweight','/mensurations'].includes(location.pathname)" class="absolute bottom-0.5 w-1 h-1 rounded-full bg-kinetic-neon shadow-[0_0_6px_rgb(var(--kinetic-neon)/0.8)]"></span>
      </a>

      <a href="/vitalite"
         class="relative flex flex-col items-center gap-1 px-2.5 py-1.5 rounded-2xl transition-all min-w-0"
         :class="location.pathname === '/vitalite' ? 'text-kinetic-neon -translate-y-px' : 'text-white/25 hover:text-white/60'">
        <svg class="w-[22px] h-[22px] flex-shrink-0 transition-[filter]"
             :class="location.pathname === '/vitalite' ? 'drop-shadow-[0_0_8px_rgb(var(--kinetic-neon)/0.6)]' : ''"
             fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/>
        </svg>
        <span class="text-[10px]" :class="location.pathname === '/vitalite' ? 'font-bold' : 'font-medium'">Vitalité</span>
        <span x-show="location.pathname === '/vitalite'" class="absolute bottom-0.5 w-1 h-1 rounded-full bg-kinetic-neon shadow-[0_0_6px_rgb(var(--kinetic-neon)/0.8)]"></span>
      </a>

      <a href="/profile"
         class="relative flex flex-col items-center gap-1 px-2.5 py-1.5 rounded-2xl transition-all min-w-0"
         :class="location.pathname === '/profile' ? 'text-kinetic-neon -translate-y-px' : 'text-white/25 hover:text-white/60'">
        <svg class="w-[22px] h-[22px] flex-shrink-0 transition-[filter]"
             :class="location.pathname === '/profile' ? 'drop-shadow-[0_0_8px_rgb(var(--kinetic-neon)/0.6)]' : ''"
             fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span class="text-[10px]" :class="location.pathname === '/profile' ? 'font-bold' : 'font-medium'">Profil</span>
        <span x-show="location.pathname === '/profile'" class="absolute bottom-0.5 w-1 h-1 rounded-full bg-kinetic-neon shadow-[0_0_6px_rgb(var(--kinetic-neon)/0.8)]"></span>
      </a>

    </div>
  </nav>

  <!-- Outlet principal -->
  <main id="app-outlet" class="min-h-screen pb-28">
    <!-- Skeleton de chargement initial -->
    <div class="max-w-md mx-auto px-4 pt-8 animate-pulse space-y-4">
      <div class="flex justify-between items-center">
        <div class="space-y-2">
          <div class="h-6 bg-kinetic-elevated rounded w-40"></div>
          <div class="h-4 bg-kinetic-elevated rounded w-32"></div>
        </div>
        <div class="w-10 h-10 bg-kinetic-elevated rounded-full"></div>
      </div>
      <div class="h-20 bg-kinetic-surface rounded-k"></div>
      <div class="h-32 bg-kinetic-surface rounded-k"></div>
      <div class="h-16 bg-kinetic-surface rounded-k"></div>
    </div>
  </main>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
