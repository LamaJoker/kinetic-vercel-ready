<!DOCTYPE html>
<html lang="fr" class="dark h-full">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#7F77DD"/>
  <meta name="description" content="Kinetic — ton système d'exploitation quotidien pour la performance"/>

  <link rel="manifest" href="/manifest.json"/>
  <link rel="apple-touch-icon" href="/icons/icon-192.png"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Kinetic"/>

  <title>Kinetic — Performance OS</title>
</head>

<body class="h-full bg-gray-950 text-gray-100 antialiased"
      x-data>

  <!-- Toasts -->
  <div class="fixed top-4 right-4 z-50 flex flex-col gap-2 pointer-events-none max-w-xs w-full">
    <template x-for="toast in $store.notifications.toasts" :key="toast.id">
      <div class="pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-xl text-white
                  shadow-xl text-sm transition-all duration-300"
           :class="[
             $store.notifications.kindClass(toast.kind),
             toast.visible ? 'opacity-100 translate-y-0' : 'opacity-0 -translate-y-2'
           ]">
        <span x-text="toast.message" class="flex-1"></span>
        <button @click="$store.notifications.dismiss(toast.id)"
                class="text-white/60 hover:text-white text-xs ml-1">✕</button>
      </div>
    </template>
  </div>

  <!-- Offline banner -->
  <div x-show="$store.offline.isOffline || $store.offline.wasOffline"
       x-transition
       class="fixed bottom-20 inset-x-0 mx-auto max-w-sm px-4 z-50">
    <div :class="$store.offline.isOffline
                 ? 'bg-gray-800 text-white border border-gray-700'
                 : 'bg-emerald-600 text-white'"
         class="rounded-2xl px-4 py-3 flex items-center gap-3 shadow-xl text-sm">
      <span class="text-lg flex-shrink-0"
            x-text="$store.offline.isOffline ? '📡' : '✅'"></span>
      <div class="flex-1">
        <p class="font-semibold"
           x-text="$store.offline.isOffline ? 'Mode hors ligne' : 'De retour en ligne'"></p>
        <p class="text-xs opacity-75"
           x-show="$store.offline.isOffline"
           x-text="'Données sauvegardées localement'"></p>
      </div>
    </div>
  </div>

  <!-- Navigation principale -->
  <nav x-show="$store.auth.isAuthenticated"
       class="fixed bottom-0 inset-x-0 bg-gray-900/95 backdrop-blur-md
              border-t border-gray-800 z-40
              pb-[env(safe-area-inset-bottom)]">
    <div class="max-w-md mx-auto flex items-center justify-around px-1 py-1.5">

      <a href="/"
         class="flex flex-col items-center gap-0.5 px-2 py-2 rounded-xl transition-colors min-w-0"
         :class="location.pathname === '/' ? 'text-kinetic-purple' : 'text-gray-500 hover:text-gray-300'">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
        </svg>
        <span class="text-xs font-medium">Accueil</span>
      </a>

      <a href="/seances"
         class="flex flex-col items-center gap-0.5 px-2 py-2 rounded-xl transition-colors min-w-0"
         :class="location.pathname === '/seances' ? 'text-kinetic-gold' : 'text-gray-500 hover:text-gray-300'">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M6 7h2m8 0h2M5 9v6a2 2 0 002 2h1v2h2v-2h4v2h2v-2h1a2 2 0 002-2V9M8 7V5a1 1 0 011-1h6a1 1 0 011 1v2"/>
        </svg>
        <span class="text-xs font-medium">Séances</span>
      </a>

      <a href="/bodyweight"
         class="flex flex-col items-center gap-0.5 px-2 py-2 rounded-xl transition-colors min-w-0"
         :class="location.pathname === '/bodyweight' ? 'text-kinetic-teal' : 'text-gray-500 hover:text-gray-300'">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
        </svg>
        <span class="text-xs font-medium">Poids</span>
      </a>

      <a href="/vitalite"
         class="flex flex-col items-center gap-0.5 px-2 py-2 rounded-xl transition-colors min-w-0"
         :class="location.pathname === '/vitalite' ? 'text-kinetic-coral' : 'text-gray-500 hover:text-gray-300'">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
        </svg>
        <span class="text-xs font-medium">Vitalité</span>
      </a>

      <a href="/profile"
         class="flex flex-col items-center gap-0.5 px-2 py-2 rounded-xl transition-colors min-w-0"
         :class="location.pathname === '/profile' ? 'text-kinetic-purple' : 'text-gray-500 hover:text-gray-300'">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
        </svg>
        <span class="text-xs font-medium">Profil</span>
      </a>

    </div>
  </nav>

  <!-- Outlet principal -->
  <main id="app-outlet" class="min-h-screen pb-24">
    <!-- Skeleton de chargement initial -->
    <div class="max-w-md mx-auto px-4 pt-8 animate-pulse space-y-4">
      <div class="flex justify-between items-center">
        <div class="space-y-2">
          <div class="h-6 bg-gray-800 rounded w-40"></div>
          <div class="h-4 bg-gray-800 rounded w-32"></div>
        </div>
        <div class="w-10 h-10 bg-gray-800 rounded-full"></div>
      </div>
      <div class="h-20 bg-gray-800 rounded-2xl"></div>
      <div class="h-32 bg-gray-800 rounded-2xl"></div>
      <div class="h-16 bg-gray-800 rounded-2xl"></div>
    </div>
  </main>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
