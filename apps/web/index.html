<!doctype html>
<html lang="fr" class="dark h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Kinetic — ton système d'exploitation quotidien pour la performance"
    />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kinetic" />

    <title>Kinetic — Performance OS</title>
  </head>

  <body
    class="h-full bg-kinetic-ink text-gray-100 antialiased"
    x-data="navShell"
    @kinetic:route-changed.window="setPath($event.detail.path)"
  >
    <!-- Skip to main content (accessibility) -->
    <a
      href="#app-outlet"
      class="sr-only focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-[100] focus:px-4 focus:py-2 focus:bg-kinetic-neon focus:text-gray-950 focus:rounded-lg focus:font-semibold focus:shadow-xl"
    >
      Aller au contenu principal
    </a>

    <!-- Toasts (announced to screen readers via aria-live) -->
    <div
      class="fixed top-4 right-4 z-50 flex flex-col gap-2 pointer-events-none max-w-xs w-full"
      role="region"
      aria-label="Notifications"
      aria-live="polite"
      aria-atomic="false"
    >
      <template x-for="toast in $store.notifications.toasts" :key="toast.id">
        <div
          class="pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-xl text-white shadow-xl text-sm transition-all duration-300"
          :class="[
             $store.notifications.kindClass(toast.kind),
             toast.visible ? 'opacity-100 translate-y-0' : 'opacity-0 -translate-y-2'
           ]"
          :role="toast.kind === 'error' ? 'alert' : 'status'"
        >
          <span x-text="toast.message" class="flex-1"></span>
          <button
            @click="$store.notifications.dismiss(toast.id)"
            type="button"
            aria-label="Fermer la notification"
            class="text-white/60 hover:text-white text-xs ml-1"
          >
            ✕
          </button>
        </div>
      </template>
    </div>

    <!-- Offline banner (announced as status to assistive tech) -->
    <div
      x-show="$store.offline.isOffline || $store.offline.wasOffline"
      x-transition
      role="status"
      aria-live="polite"
      class="fixed bottom-20 inset-x-0 mx-auto max-w-sm px-4 z-50"
    >
      <div
        :class="$store.offline.isOffline
                 ? 'bg-kinetic-surface text-white ring-1 ring-white/10'
                 : 'bg-kinetic-neon text-gray-950'"
        class="rounded-2xl px-4 py-3 flex items-center gap-3 shadow-xl text-sm"
      >
        <span
          class="text-lg flex-shrink-0"
          aria-hidden="true"
          x-text="$store.offline.isOffline ? '' : ''"
        ></span>
        <div class="flex-1">
          <p
            class="font-semibold"
            x-text="$store.offline.isOffline ? 'Mode hors ligne' : 'De retour en ligne'"
          ></p>
          <p
            class="text-xs opacity-75"
            x-show="$store.offline.isOffline"
            x-text="'Données sauvegardées localement'"
          ></p>
        </div>
      </div>
    </div>

    <!-- Navigation principale -->
    <nav
      x-show="$store.auth.isAuthenticated && !isChromeless()"
      aria-label="Navigation principale"
      class="k-tabbar fixed bottom-0 inset-x-0 z-40 pt-1.5 pb-[calc(env(safe-area-inset-bottom)+0.375rem)]"
    >
      <div class="max-w-md mx-auto flex items-stretch justify-around px-2">
        <a
          href="/"
          :aria-current="currentPath === '/' ? 'page' : null"
          class="flex-1 min-w-0 flex flex-col items-center gap-0.5 py-1 rounded-xl"
        >
          <svg
            aria-hidden="true"
            focusable="false"
            class="w-[26px] h-[26px] flex-shrink-0"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M4 10.5 12 4l8 6.5V19a1.5 1.5 0 0 1-1.5 1.5H15V15a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v5.5H5.5A1.5 1.5 0 0 1 4 19v-8.5Z"
            />
          </svg>
          <span
            class="text-[10px] font-medium truncate max-w-full"
            x-text="$t('nav.dashboard')"
          ></span>
        </a>
        <a
          href="/seances"
          :aria-current="currentPath === '/seances' ? 'page' : null"
          class="flex-1 min-w-0 flex flex-col items-center gap-0.5 py-1 rounded-xl"
        >
          <svg
            aria-hidden="true"
            focusable="false"
            class="w-[26px] h-[26px] flex-shrink-0"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11" />
          </svg>
          <span
            class="text-[10px] font-medium truncate max-w-full"
            x-text="$t('nav.sessions')"
          ></span>
        </a>
        <a
          href="/bodyweight"
          :aria-current="isBodyPage() ? 'page' : null"
          class="flex-1 min-w-0 flex flex-col items-center gap-0.5 py-1 rounded-xl"
        >
          <svg
            aria-hidden="true"
            focusable="false"
            class="w-[26px] h-[26px] flex-shrink-0"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="3.5" y="3.5" width="17" height="17" rx="5" />
            <path d="M8.3 10a5.2 5.2 0 0 1 7.4 0" />
            <path d="m12 8.8 1.4 2.9" />
          </svg>
          <span class="text-[10px] font-medium truncate max-w-full">Corps</span>
        </a>
        <a
          href="/vitalite"
          :aria-current="currentPath === '/vitalite' ? 'page' : null"
          class="flex-1 min-w-0 flex flex-col items-center gap-0.5 py-1 rounded-xl"
        >
          <svg
            aria-hidden="true"
            focusable="false"
            class="w-[26px] h-[26px] flex-shrink-0"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M12 20.5s-7.5-4.3-7.5-10A4.3 4.3 0 0 1 12 8a4.3 4.3 0 0 1 7.5 2.5c0 5.700-7.5 10-7.5 10Z"
            />
          </svg>
          <span class="text-[10px] font-medium truncate max-w-full">Récup</span>
        </a>
        <a
          href="/profile"
          :aria-current="currentPath === '/profile' ? 'page' : null"
          class="flex-1 min-w-0 flex flex-col items-center gap-0.5 py-1 rounded-xl"
        >
          <svg
            aria-hidden="true"
            focusable="false"
            class="w-[26px] h-[26px] flex-shrink-0"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="8.5" />
            <circle cx="12" cy="10" r="2.8" />
            <path d="M6.6 18.5a6.3 6.3 0 0 1 10.8 0" />
          </svg>
          <span
            class="text-[10px] font-medium truncate max-w-full"
            x-text="$t('nav.profile')"
          ></span>
        </a>
      </div>
    </nav>

    <!-- Outlet principal -->
    <main
      id="app-outlet"
      tabindex="-1"
      aria-busy="false"
      class="min-h-screen pb-28 focus:outline-none"
    >
      <!-- Skeleton de chargement initial -->
      <div class="max-w-md mx-auto px-4 pt-8 animate-pulse space-y-4">
        <div class="flex justify-between items-center">
          <div class="space-y-2">
            <div class="h-6 bg-kinetic-elevated rounded w-40"></div>
            <div class="h-4 bg-kinetic-elevated rounded w-32"></div>
          </div>
          <div class="w-10 h-10 bg-kinetic-elevated rounded-full"></div>
        </div>
        <div class="h-20 bg-kinetic-surface rounded-k"></div>
        <div class="h-32 bg-kinetic-surface rounded-k"></div>
        <div class="h-16 bg-kinetic-surface rounded-k"></div>
      </div>
    </main>

    <!-- ── PWA install banner ──────────────────────────────────────────── -->
    <div
      x-data="pwaInstallPrompt"
      x-init="init()"
      x-show="visible"
      x-transition:enter="transition ease-out duration-300"
      x-transition:enter-start="opacity-0 translate-y-4"
      x-transition:enter-end="opacity-100 translate-y-0"
      x-transition:leave="transition ease-in duration-200"
      x-transition:leave-start="opacity-100 translate-y-0"
      x-transition:leave-end="opacity-0 translate-y-4"
      class="fixed bottom-20 left-4 right-4 max-w-md mx-auto z-40 bg-kinetic-surface border border-kinetic-neon/30 rounded-2xl p-4 shadow-2xl"
      style="display: none"
    >
      <div class="flex items-start gap-3">
        <div
          class="flex-shrink-0 w-10 h-10 bg-kinetic-neon/20 rounded-xl flex items-center justify-center text-xl"
        ></div>
        <div class="flex-1 min-w-0">
          <p class="text-white font-bold text-sm mb-0.5">Installer Kinetic</p>
          <p class="text-xs text-gray-400 leading-relaxed" x-show="!isIos">
            Accède plus vite à tes séances depuis ton écran d'accueil.
          </p>
          <p class="text-xs text-gray-400 leading-relaxed" x-show="isIos">
            Appuie sur Partager (□↑) puis « Sur l'écran d'accueil ».
          </p>
        </div>
      </div>
      <div class="flex gap-2 mt-3">
        <button
          @click="dismiss()"
          class="flex-1 text-xs text-gray-400 px-3 py-2 rounded-lg ring-1 ring-white/10 hover:ring-white/30"
        >
          Plus tard
        </button>
        <button
          x-show="!isIos"
          @click="install()"
          class="flex-1 text-xs font-bold text-gray-950 bg-kinetic-neon px-3 py-2 rounded-lg hover:brightness-110"
        >
          Installer
        </button>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
