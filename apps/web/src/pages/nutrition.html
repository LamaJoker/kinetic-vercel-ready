<div x-data="nutrition" x-init="init()" class="max-w-md mx-auto px-4 pt-8 pb-8">

  <!-- Header -->
  <div class="flex items-center gap-3 mb-6">
    <a href="/"
       class="flex items-center justify-center w-9 h-9 rounded-xl transition-colors flex-shrink-0"
       style="background: var(--k-surface); color: var(--k-tx3);"
       onmouseover="this.style.color='var(--k-tx)'"
       onmouseout="this.style.color='var(--k-tx3)'">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/>
      </svg>
    </a>
    <div class="flex-1">
      <h1 class="font-display-v2 font-bold text-k-tx" style="font-size: 20px; letter-spacing: -0.02em;">Nutrition</h1>
    </div>
  </div>

  <!-- Aucun plan -->
  <div x-show="!$store.nutrition.plan" class="k-card text-center mb-4" style="padding: 24px;">
    <p style="font-size: 36px; margin-bottom: 10px;">🥗</p>
    <p class="font-display-v2 font-bold mb-1" style="font-size: 16px; color: var(--k-tx);">Aucun plan nutritionnel</p>
    <p style="font-size: 13px; color: var(--k-tx3); margin-bottom: 16px;">Complète ton profil pour obtenir tes objectifs macro.</p>
    <a href="/onboarding" class="btn-p" style="display: inline-block; padding: 10px 22px; font-size: 14px; text-decoration: none;">
      Configurer mon profil
    </a>
  </div>

  <!-- Plan cible -->
  <div x-show="$store.nutrition.plan" class="space-y-4">

    <!-- Anneau kcal + barres macros -->
    <div class="k-card" style="padding: 16px;">
      <div class="flex items-center gap-4 mb-4">
        <!-- Anneau SVG kcal -->
        <div class="relative flex-shrink-0" style="width: 80px; height: 80px;">
          <svg viewBox="0 0 80 80" class="w-full h-full" style="transform: rotate(-90deg);">
            <circle cx="40" cy="40" r="30" fill="none" stroke="var(--k-elevated)" stroke-width="8"/>
            <circle cx="40" cy="40" r="30" fill="none" stroke="var(--k-p)" stroke-width="8"
                    :stroke-dasharray="`${Math.min(188, ($store.nutrition.progress?.kcalPct ?? 0) * 1.88)} 188`"
                    stroke-linecap="round"
                    style="transition: stroke-dasharray .5s ease; filter: drop-shadow(0 0 5px var(--k-p-glow));"/>
          </svg>
          <div class="absolute inset-0 flex flex-col items-center justify-center">
            <span class="font-display-v2 font-bold" style="font-size: 15px; color: var(--k-tx); line-height: 1;"
                  x-text="$store.nutrition.consumed.kcal"></span>
            <span style="font-size: 10px; color: var(--k-tx3);">kcal</span>
          </div>
        </div>

        <div class="flex-1 min-w-0 space-y-1.5">
          <div class="flex justify-between" style="font-size: 12px;">
            <span style="color: var(--k-tx3);">Objectif</span>
            <span class="font-display-v2 font-semibold" style="color: var(--k-tx2);" x-text="($store.nutrition.plan?.macros.kcal ?? 0) + ' kcal'"></span>
          </div>
          <div class="flex justify-between" style="font-size: 12px;">
            <span style="color: var(--k-tx3);">Consommé</span>
            <span class="font-display-v2 font-bold" style="color: var(--k-tx);" x-text="$store.nutrition.consumed.kcal + ' kcal'"></span>
          </div>
          <div class="flex justify-between" style="font-size: 12px;">
            <span style="color: var(--k-tx3);">Restant</span>
            <span class="font-display-v2 font-bold" style="color: var(--k-p);" x-text="($store.nutrition.remaining?.kcal ?? 0) + ' kcal'"></span>
          </div>
        </div>
      </div>

      <!-- Barres macros -->
      <div class="space-y-2.5">
        <template x-for="macro in [
          { label: 'Protéines', key: 'proteinG', pctKey: 'proteinPct', color: 'var(--k-p)', unit: 'g' },
          { label: 'Glucides',  key: 'carbsG',   pctKey: 'carbsPct',   color: 'var(--k-e)', unit: 'g' },
          { label: 'Lipides',   key: 'fatG',     pctKey: 'fatPct',     color: 'var(--k-tx2)', unit: 'g' }
        ]">
          <div>
            <div class="flex justify-between mb-1" style="font-size: 12px;">
              <span style="color: var(--k-tx2);" x-text="macro.label"></span>
              <span style="color: var(--k-tx);">
                <span x-text="$store.nutrition.consumed[macro.key]"></span>
                <span style="color: var(--k-tx3);"> / </span>
                <span x-text="$store.nutrition.plan?.macros[macro.key]"></span>
                <span style="color: var(--k-tx3);" x-text="' ' + macro.unit"></span>
              </span>
            </div>
            <div class="bar-track">
              <div class="bar-fill" :style="`width: ${Math.min(100, ($store.nutrition.progress?.[macro.pctKey] ?? 0))}%; background: ${macro.color}; box-shadow: 0 0 6px ${macro.color}40;`"></div>
            </div>
          </div>
        </template>
      </div>
    </div>

    <!-- Journal des repas -->
    <div class="k-card" style="padding: 16px;">
      <div class="flex items-center justify-between mb-3">
        <p class="font-display-v2 font-bold" style="font-size: 15px; color: var(--k-tx);">Journal du jour</p>
        <button @click="showAddForm = !showAddForm"
                class="btn-p" style="font-size: 12px; padding: 6px 14px;">
          + Ajouter
        </button>
      </div>

      <!-- Formulaire ajout -->
      <div x-show="showAddForm" x-transition
           style="background: var(--k-elevated); border: 1px solid var(--k-line); border-radius: 14px; padding: 14px; margin-bottom: 14px;">

        <select x-model="newMeal.mealName"
                class="k-input w-full mb-3" style="padding: 10px 12px; font-size: 14px;">
          <option value="Matin">🌅 Matin</option>
          <option value="Déjeuner">☀️ Déjeuner</option>
          <option value="Collation">🍎 Collation</option>
          <option value="Dîner">🌙 Dîner</option>
        </select>

        <!-- Recherche aliment -->
        <div class="relative mb-3">
          <div class="flex gap-2 items-center">
            <div class="relative flex-1">
              <input x-model="foodQuery"
                     @input.debounce.200ms="searchFood()"
                     @focus="searchFood()"
                     placeholder="🔍 Rechercher un aliment…"
                     class="k-input w-full" style="padding: 10px 12px; font-size: 14px; padding-right: 32px;"/>
              <button x-show="foodQuery" @click="clearFoodSelection()"
                      style="position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font-size: 12px; color: var(--k-tx3); background: none; border: none; cursor: pointer;">✕</button>
            </div>
          </div>

          <template x-if="selectedFood">
            <div class="mt-1.5 flex items-center gap-2"
                 style="background: oklch(82% 0.28 145 / 0.1); border: 1px solid oklch(82% 0.28 145 / 0.3); border-radius: 10px; padding: 8px 12px;">
              <span style="color: var(--k-p); font-size: 12px;">✓</span>
              <span class="font-display-v2 font-semibold" style="font-size: 12px; color: var(--k-tx);" x-text="selectedFood.name"></span>
              <span class="ml-auto" style="font-size: 10px; color: var(--k-tx3);"
                    x-text="`${selectedFood.kcal} kcal · P${selectedFood.protein}g · G${selectedFood.carbs}g · L${selectedFood.fat}g /100g`"></span>
            </div>
          </template>

          <div x-show="foodResults.length > 0"
               class="absolute z-20 left-0 right-0 top-full mt-1 overflow-hidden"
               style="background: var(--k-surface); border: 1px solid var(--k-line); border-radius: 14px; box-shadow: 0 8px 30px rgba(0,0,0,.4);">
            <template x-for="food in foodResults" :key="food.id">
              <button @click="selectFood(food)"
                      class="w-full text-left transition-colors"
                      style="padding: 10px 14px; border-bottom: 1px solid var(--k-line);"
                      onmouseover="this.style.background='var(--k-elevated)'"
                      onmouseout="this.style.background='transparent'">
                <div class="flex items-center justify-between gap-2">
                  <span style="font-size: 13px; color: var(--k-tx);" x-text="food.name"></span>
                  <span style="font-size: 10px; color: var(--k-tx3); flex-shrink: 0;"
                        x-text="`${food.kcal}kcal · P${food.protein}g`"></span>
                </div>
              </button>
            </template>
            <button @click="foodResults = []"
                    class="w-full text-center" style="padding: 8px; font-size: 12px; color: var(--k-tx3); background: none; border: none; cursor: pointer; border-top: 1px solid var(--k-line);">
              Saisie manuelle →
            </button>
          </div>
        </div>

        <!-- Saisie manuelle -->
        <template x-if="!selectedFood">
          <div class="mb-3">
            <input x-model="newMeal.name" placeholder="Nom de l'aliment (saisie manuelle)"
                   class="k-input w-full mb-2" style="padding: 10px 12px; font-size: 14px;"/>
            <div class="grid grid-cols-2 gap-2 mb-2">
              <div>
                <label class="font-display-v2 font-semibold block mb-1" style="font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--k-tx3);">Kcal/100g</label>
                <input x-model.number="newMeal.kcal" type="number" min="0"
                       class="k-input w-full" style="padding: 9px 11px; font-size: 13px;"/>
              </div>
              <div>
                <label class="font-display-v2 font-semibold block mb-1" style="font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--k-tx3);">Protéines/100g</label>
                <input x-model.number="newMeal.protein" type="number" min="0" step="0.1"
                       class="k-input w-full" style="padding: 9px 11px; font-size: 13px;"/>
              </div>
              <div>
                <label class="font-display-v2 font-semibold block mb-1" style="font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--k-tx3);">Glucides/100g</label>
                <input x-model.number="newMeal.carbs" type="number" min="0" step="0.1"
                       class="k-input w-full" style="padding: 9px 11px; font-size: 13px;"/>
              </div>
              <div>
                <label class="font-display-v2 font-semibold block mb-1" style="font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--k-tx3);">Lipides/100g</label>
                <input x-model.number="newMeal.fat" type="number" min="0" step="0.1"
                       class="k-input w-full" style="padding: 9px 11px; font-size: 13px;"/>
              </div>
            </div>
          </div>
        </template>

        <!-- Quantité + aperçu -->
        <div class="flex items-center gap-3 mb-3">
          <div class="flex-1">
            <label class="font-display-v2 font-semibold block mb-1" style="font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--k-tx3);">Quantité (g)</label>
            <input x-model.number="newMeal.grams" type="number" min="1" step="5"
                   class="k-input w-full font-mono font-bold text-center" style="padding: 10px 12px; font-size: 18px;"/>
          </div>
          <div class="flex-1 text-center" style="background: var(--k-void); border-radius: 12px; padding: 10px;">
            <p class="font-display-v2 font-bold" style="font-size: 22px; color: var(--k-p); line-height: 1;"
               x-text="Math.round(newMeal.kcal * newMeal.grams / 100)"></p>
            <p style="font-size: 10px; color: var(--k-tx3); margin-top: 2px;">kcal</p>
            <p style="font-size: 11px; color: var(--k-tx3); margin-top: 4px;"
               x-text="`P${(newMeal.protein*newMeal.grams/100).toFixed(0)} G${(newMeal.carbs*newMeal.grams/100).toFixed(0)} L${(newMeal.fat*newMeal.grams/100).toFixed(0)}`"></p>
          </div>
        </div>

        <button @click="logFood()"
                :disabled="!newMeal.name || newMeal.grams <= 0"
                class="btn-p w-full disabled:opacity-40"
                style="padding: 12px; font-size: 14px;">
          ✓ Ajouter au journal
        </button>
      </div>

      <!-- Liste repas -->
      <template x-if="$store.nutrition.todayLog.length === 0">
        <p class="text-center py-4" style="font-size: 13px; color: var(--k-tx3);">Aucun repas enregistré aujourd'hui.</p>
      </template>

      <template x-for="meal in $store.nutrition.todayLog" :key="meal.id">
        <div class="mb-3">
          <p class="font-display-v2 font-bold mb-1.5" style="font-size: 10px; text-transform: uppercase; letter-spacing: .1em; color: var(--k-tx3);"
             x-text="meal.mealName"></p>
          <template x-for="(item, idx) in meal.items" :key="idx">
            <div class="flex items-center justify-between py-2" style="border-bottom: 1px solid var(--k-line);">
              <div>
                <p style="font-size: 13px; color: var(--k-tx);" x-text="item.food.name"></p>
                <p style="font-size: 11px; color: var(--k-tx3);"
                   x-text="`${item.grams}g · P${(item.food.proteinPer100*item.grams/100).toFixed(0)}g · G${(item.food.carbsPer100*item.grams/100).toFixed(0)}g · L${(item.food.fatPer100*item.grams/100).toFixed(0)}g`">
                </p>
              </div>
              <div class="flex items-center gap-2">
                <span class="font-display-v2 font-bold" style="font-size: 12px; color: var(--k-tx);"
                      x-text="Math.round(item.food.kcalPer100 * item.grams / 100) + ' kcal'"></span>
                <button @click="$store.nutrition.removeMealItem(meal.mealName, idx)"
                        style="font-size: 12px; color: var(--k-tx3); background: none; border: none; cursor: pointer;">✕</button>
              </div>
            </div>
          </template>
        </div>
      </template>
    </div>

    <!-- Plan calorique détail -->
    <div class="k-card" style="padding: 16px;">
      <p class="font-display-v2 font-bold mb-3" style="font-size: 15px; color: var(--k-tx);">Objectifs scientifiques</p>
      <div class="grid grid-cols-2 gap-2 mb-3">
        <div style="background: var(--k-elevated); border-radius: 14px; padding: 12px;">
          <p style="font-size: 11px; color: var(--k-tx3);">BMR</p>
          <p class="font-display-v2 font-bold" style="font-size: 20px; color: var(--k-tx);" x-text="$store.nutrition.plan?.bmrKcal + ' kcal'"></p>
        </div>
        <div style="background: var(--k-elevated); border-radius: 14px; padding: 12px;">
          <p style="font-size: 11px; color: var(--k-tx3);">TDEE</p>
          <p class="font-display-v2 font-bold" style="font-size: 20px; color: var(--k-p);" x-text="$store.nutrition.plan?.tdeeKcal + ' kcal'"></p>
        </div>
        <div style="background: var(--k-elevated); border-radius: 14px; padding: 12px;">
          <p style="font-size: 11px; color: var(--k-tx3);">Eau / jour</p>
          <p class="font-display-v2 font-bold" style="font-size: 20px; color: #60A5FA;"
             x-text="((($store.nutrition.plan?.macros.waterMl ?? 0) / 1000).toFixed(1)) + ' L'"></p>
        </div>
        <div style="background: var(--k-elevated); border-radius: 14px; padding: 12px;">
          <p style="font-size: 11px; color: var(--k-tx3);">Fibres cible</p>
          <p class="font-display-v2 font-bold" style="font-size: 20px; color: #4ADE80;"
             x-text="($store.nutrition.plan?.macros.fiberG ?? 0) + ' g'"></p>
        </div>
      </div>
      <template x-if="$store.nutrition.plan?.weeklyFatLossG">
        <div class="mb-3" style="background: oklch(82% 0.28 145 / 0.08); border: 1px solid oklch(82% 0.28 145 / 0.2); border-radius: 12px; padding: 12px;">
          <p class="font-display-v2 font-bold" style="font-size: 12px; color: var(--k-p);">Perte de masse grasse théorique</p>
          <p style="font-size: 13px; color: var(--k-tx); margin-top: 2px;"
             x-text="`~${($store.nutrition.plan?.weeklyFatLossG / 1000).toFixed(2)} kg / semaine`"></p>
        </div>
      </template>
      <template x-for="note in ($store.nutrition.plan?.notes ?? [])">
        <p style="font-size: 12px; color: var(--k-tx3); margin-bottom: 4px;" class="before:content-['→_']" x-text="note"></p>
      </template>
    </div>

    <!-- Répartition repas -->
    <div class="k-card" style="padding: 16px;">
      <div class="flex items-center justify-between mb-3">
        <p class="font-display-v2 font-bold" style="font-size: 15px; color: var(--k-tx);">Répartition recommandée</p>
        <label class="flex items-center gap-1.5" style="font-size: 12px; color: var(--k-tx3);">
          <input type="checkbox" x-model="trainingToday" class="rounded"/>
          Jour d'entraînement
        </label>
      </div>
      <template x-for="meal in mealTimings">
        <div class="mb-2" style="background: var(--k-elevated); border-radius: 12px; padding: 12px;">
          <div class="flex items-center justify-between mb-1">
            <p class="font-display-v2 font-semibold" style="font-size: 13px; color: var(--k-tx);" x-text="meal.mealName"></p>
            <span style="font-size: 12px; color: var(--k-tx3);" x-text="meal.kcal + ' kcal'"></span>
          </div>
          <div class="flex gap-3 mb-1" style="font-size: 12px;">
            <span style="color: var(--k-p);" x-text="`P: ${meal.proteinG}g`"></span>
            <span style="color: var(--k-p);" x-text="`G: ${meal.carbsG}g`"></span>
            <span style="color: var(--k-e);" x-text="`L: ${meal.fatG}g`"></span>
          </div>
          <p style="font-size: 12px; color: var(--k-tx3);" x-text="meal.notes"></p>
        </div>
      </template>
    </div>

  </div>
</div>
