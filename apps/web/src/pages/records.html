<div x-data="records" x-init="init()" class="max-w-md mx-auto px-4 pt-8 pb-8">
  <!-- En-tête -->
  <div class="k-nav">
    <a href="/" class="k-back" aria-label="Retour">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2.4"
          d="M15 19l-7-7 7-7"
        />
      </svg>
    </a>
    <div class="flex-1 min-w-0">
      <h1 class="font-display font-bold text-white">Records</h1>
    </div>
  </div>

  <!-- Chargement -->
  <div x-show="loading" class="space-y-3" aria-busy="true">
    <span class="sr-only">Chargement…</span>
    <div class="k-skeleton h-[5.5rem] rounded-2xl" aria-hidden="true"></div>
    <div class="k-skeleton h-9 rounded-[10px]" aria-hidden="true"></div>
    <div class="k-skeleton h-56 rounded-2xl" aria-hidden="true"></div>
  </div>

  <!-- État vide -->
  <template x-if="!loading && records.length === 0">
    <div class="k-empty">
      <p>Aucun record pour l'instant</p>
      <p class="text-sm text-gray-500 mt-1.5 max-w-[16rem] mx-auto">
        Termine ta première séance pour débloquer tes records personnels.
      </p>
      <a href="/seances" class="k-btn mt-6">Démarrer une séance</a>
    </div>
  </template>

  <!-- Chiffres clés : carte héros -->
  <template x-if="!loading && records.length > 0">
    <section class="k-hero mb-8">
      <div class="flex items-start justify-between gap-4">
        <div class="min-w-0">
          <p class="text-sm font-medium text-gray-400">Meilleur e1RM</p>
          <p class="k-stat text-[3.25rem] mt-1">
            <span x-text="$num.loc(topE1rm)"></span><span class="k-unit">kg</span>
          </p>
        </div>
        <span
          class="flex h-14 w-14 flex-shrink-0 items-center justify-center rounded-full bg-gradient-to-br from-kinetic-gold to-amber-500 text-gray-950"
          aria-hidden="true"
        >
          <svg
            class="h-7 w-7"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M7 4h10v5a5 5 0 0 1-10 0V4ZM7 6H4.5v1.5A3.5 3.5 0 0 0 8 11M17 6h2.5v1.5A3.5 3.5 0 0 1 16 11M12 14v4M8.5 20h7"
            />
          </svg>
        </span>
      </div>
      <div class="grid grid-cols-2 gap-3 mt-5 pt-4 border-t border-white/10">
        <div>
          <p class="k-stat text-[1.75rem]" x-text="records.length"></p>
          <p class="text-xs text-gray-400 mt-1">Records</p>
        </div>
        <div>
          <p class="k-stat text-[1.75rem]" x-text="recentCount"></p>
          <p class="text-xs text-gray-400 mt-1">Sur 7 jours</p>
        </div>
      </div>
    </section>
  </template>

  <!-- Liste des records : cartes trophées -->
  <section class="mb-8" x-show="!loading && records.length > 0">
    <h2 class="k-section mb-2.5">Tous les records · e1RM</h2>
    <div class="k-scroll-x mb-3" role="group" aria-label="Trier les records">
      <button
        type="button"
        @click="sort = 'recent'"
        class="k-chip"
        :class="sort === 'recent' ? 'on' : ''"
        :aria-pressed="sort === 'recent' ? 'true' : 'false'"
      >
        Récents
      </button>
      <button
        type="button"
        @click="sort = 'e1rm'"
        class="k-chip"
        :class="sort === 'e1rm' ? 'on' : ''"
        :aria-pressed="sort === 'e1rm' ? 'true' : 'false'"
      >
        Top e1RM
      </button>
      <button
        type="button"
        @click="sort = 'name'"
        class="k-chip"
        :class="sort === 'name' ? 'on' : ''"
        :aria-pressed="sort === 'name' ? 'true' : 'false'"
      >
        A–Z
      </button>
    </div>

    <div class="space-y-2.5 k-stagger">
      <template x-for="r in sortedRecords" :key="r.exerciseId">
        <div class="k-card py-3.5">
          <div class="flex items-center gap-3.5">
            <span
              class="flex h-11 w-11 flex-shrink-0 items-center justify-center rounded-full"
              :class="medalClass(r)"
              aria-hidden="true"
            >
              <svg
                class="h-5 w-5"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M7 4h10v5a5 5 0 0 1-10 0V4ZM7 6H4.5v1.5A3.5 3.5 0 0 0 8 11M17 6h2.5v1.5A3.5 3.5 0 0 1 16 11M12 14v4M8.5 20h7"
                />
              </svg>
            </span>
            <div class="flex-1 min-w-0">
              <p class="text-base font-semibold text-white truncate" x-text="r.exerciseName"></p>
              <p class="text-xs text-gray-500 mt-0.5 truncate tabular-nums">
                <span x-text="$num.loc(r.weightLabel + ' × ' + r.reps)"></span>
                <span class="mx-1" aria-hidden="true">·</span>
                <span x-text="$num.loc(r.dateLabel)"></span>
              </p>
            </div>
            <p class="k-stat flex-shrink-0 text-[1.625rem]">
              <span x-text="$num.loc(r.e1rmKg)"></span><span class="k-unit">kg</span>
            </p>
          </div>
          <div class="mt-3 h-1 rounded-full bg-white/[0.06] overflow-hidden" aria-hidden="true">
            <div
              class="h-full rounded-full bg-kinetic-neon transition-[width] duration-500"
              :style="recordBarStyle(r)"
            ></div>
          </div>
        </div>
      </template>
    </div>
  </section>

  <!-- ── Scores de force (Wilks / IPF GL / DOTS) — mode avancé ─────────── -->
  <template x-if="!loading && records.length > 0">
    <section class="adv-only mb-8">
      <div class="flex items-center justify-between gap-3 mb-2.5">
        <h2 class="k-section inline-flex items-center gap-1.5">
          Scores de force
          <span x-data="helpTip" data-term="wilks" class="relative inline-flex">
            <button
              type="button"
              @click="toggle()"
              @click.outside="close()"
              aria-label="Qu'est-ce que le score de force ?"
              class="relative flex h-6 w-6 items-center justify-center rounded-full text-gray-500 transition active:opacity-60 after:absolute after:-inset-2.5 after:content-['']"
            >
              <svg
                class="h-[18px] w-[18px]"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                aria-hidden="true"
              >
                <circle cx="12" cy="12" r="9" />
                <path d="M12 11v5M12 7.6h.01" />
              </svg>
            </button>
            <span
              x-show="open"
              x-transition
              class="absolute left-0 top-full mt-2 z-50 w-60 rounded-xl bg-kinetic-raised p-3 shadow-2xl text-xs text-gray-300 leading-snug font-normal normal-case tracking-normal"
              style="display: none"
            >
              <span class="mb-0.5 block font-semibold text-white" x-text="$num.loc(label)"></span>
              <span x-text="def"></span>
            </span>
          </span>
        </h2>
        <button
          type="button"
          @click="showScoresEditor = !showScoresEditor"
          class="k-pill"
          :aria-expanded="showScoresEditor ? 'true' : 'false'"
        >
          <span x-show="!showScoresEditor">Modifier</span>
          <span x-show="showScoresEditor">Fermer</span>
        </button>
      </div>
      <p class="text-sm text-gray-500 mb-3">
        Ton total squat, bench et deadlift, rapporté à ton poids.
      </p>

      <!-- Réglages du profil de force -->
      <template x-if="showScoresEditor">
        <div class="k-list mb-3">
          <label for="f-records-1" class="k-row">
            <span class="text-base text-white flex-shrink-0">Poids corporel</span>
            <span class="flex-1 min-w-0 flex items-baseline justify-end gap-1">
              <input
                id="f-records-1"
                type="number"
                step="0.1"
                inputmode="decimal"
                :value="scoreBodyweightKg || ''"
                @input="setScoreBodyweight($event.target.value)"
                placeholder="80"
                class="w-20 min-w-0 bg-transparent text-right text-base text-white tabular-nums placeholder:text-gray-500 focus:outline-none [appearance:textfield] [&::-webkit-inner-spin-button]:appearance-none [&::-webkit-outer-spin-button]:appearance-none"
              />
              <span class="text-base text-gray-500">kg</span>
            </span>
          </label>
          <div class="k-row">
            <span class="text-base text-white flex-shrink-0" id="records-sex-label">Sexe</span>
            <div class="k-seg ml-auto w-44" role="group" aria-labelledby="records-sex-label">
              <button
                type="button"
                @click="setScoreSex('male')"
                class="k-seg-item"
                :class="scoreSex === 'male' ? 'on' : ''"
                :aria-pressed="scoreSex === 'male' ? 'true' : 'false'"
              >
                Homme
              </button>
              <button
                type="button"
                @click="setScoreSex('female')"
                class="k-seg-item"
                :class="scoreSex === 'female' ? 'on' : ''"
                :aria-pressed="scoreSex === 'female' ? 'true' : 'false'"
              >
                Femme
              </button>
            </div>
          </div>
        </div>
      </template>

      <!-- État incomplet -->
      <template x-if="!scoresReady">
        <p class="k-card text-sm text-gray-500 leading-relaxed">
          Indique ton poids corporel (bouton Modifier) et établis au moins un record au squat, au
          bench ou au deadlift pour calculer ton score.
        </p>
      </template>

      <!-- Scores -->
      <template x-if="scoresReady">
        <div class="space-y-3">
          <!-- Total + niveau, détail SBD -->
          <div class="k-card">
            <div class="flex items-end justify-between gap-3">
              <div class="min-w-0">
                <p class="text-sm text-gray-500">Total SBD</p>
                <p class="k-stat text-[2.5rem] mt-1">
                  <span x-text="$num.loc(sbdTotalKg)"></span><span class="k-unit">kg</span>
                </p>
              </div>
              <div class="text-right flex-shrink-0">
                <p class="text-sm text-gray-500">Niveau</p>
                <p
                  class="mt-1.5 inline-flex rounded-full bg-kinetic-neon/15 px-3 py-1 text-sm font-semibold text-kinetic-neon"
                  x-text="$num.loc(strengthTierLabel)"
                ></p>
              </div>
            </div>
            <div class="grid grid-cols-3 gap-2 mt-4">
              <div class="bg-kinetic-ink rounded-2xl px-2 py-3 text-center">
                <p class="text-xs text-gray-500">Squat</p>
                <p class="k-stat text-lg mt-0.5" x-text="$num.loc(sbdBreakdown.squat + ' kg')"></p>
              </div>
              <div class="bg-kinetic-ink rounded-2xl px-2 py-3 text-center">
                <p class="text-xs text-gray-500">Bench</p>
                <p class="k-stat text-lg mt-0.5" x-text="$num.loc(sbdBreakdown.bench + ' kg')"></p>
              </div>
              <div class="bg-kinetic-ink rounded-2xl px-2 py-3 text-center">
                <p class="text-xs text-gray-500">Deadlift</p>
                <p
                  class="k-stat text-lg mt-0.5"
                  x-text="$num.loc(sbdBreakdown.deadlift + ' kg')"
                ></p>
              </div>
            </div>
          </div>

          <!-- Scores normalisés -->
          <div class="k-list">
            <div class="k-row">
              <span class="flex-1 text-base text-white">Wilks</span>
              <span class="k-stat text-xl" x-text="$num.loc(wilksScore.toFixed(1))"></span>
            </div>
            <div class="k-row">
              <span class="flex-1 text-base text-white">IPF GL</span>
              <span class="k-stat text-xl" x-text="$num.loc(ipfGlScore.toFixed(1))"></span>
            </div>
            <div class="k-row">
              <span class="flex-1 text-base text-white">DOTS</span>
              <span class="k-stat text-xl" x-text="$num.loc(dotsScoreValue.toFixed(1))"></span>
            </div>
          </div>
          <p class="k-caption">
            Estimés à partir de tes e1RM. Sources : Wilks (2020), IPF GL (annexe 7), DOTS (Konertz
            2019).
          </p>
        </div>
      </template>
    </section>
  </template>
</div>
