<div x-data="records" x-init="init()" class="max-w-md mx-auto px-4 pt-8 pb-8">
  <!-- En-tête -->
  <div class="k-nav">
    <a href="/" class="k-back" aria-label="Retour">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2.4"
          d="M15 19l-7-7 7-7"
        />
      </svg>
    </a>
    <div class="flex-1 min-w-0">
      <h1 class="font-display font-bold text-white">Records</h1>
      <p class="text-xs text-gray-500 tabular-nums" x-text="subtitleLabel"></p>
    </div>
  </div>

  <!-- Chargement -->
  <div x-show="loading" class="space-y-3" aria-busy="true">
    <span class="sr-only">Chargement…</span>
    <div class="k-skeleton h-[5.5rem] rounded-2xl" aria-hidden="true"></div>
    <div class="k-skeleton h-9 rounded-[10px]" aria-hidden="true"></div>
    <div class="k-skeleton h-56 rounded-2xl" aria-hidden="true"></div>
  </div>

  <!-- État vide -->
  <template x-if="!loading && records.length === 0">
    <div class="k-empty">
      <p>Aucun record pour l'instant</p>
      <p class="text-sm text-gray-500 mt-1.5 max-w-[16rem] mx-auto">
        Termine ta première séance pour débloquer tes records personnels.
      </p>
      <a href="/seances" class="k-btn mt-6">Démarrer une séance</a>
    </div>
  </template>

  <!-- Chiffres clés -->
  <template x-if="!loading && records.length > 0">
    <div class="bg-kinetic-surface rounded-2xl py-4 mb-8 grid grid-cols-3 divide-x divide-white/10">
      <div class="px-3 text-center">
        <p
          class="font-display font-bold text-2xl text-white tabular-nums"
          x-text="records.length"
        ></p>
        <p class="text-xs text-gray-500 mt-0.5">Records</p>
      </div>
      <div class="px-3 text-center">
        <p class="font-display font-bold text-2xl text-white tabular-nums" x-text="recentCount"></p>
        <p class="text-xs text-gray-500 mt-0.5">Sur 7 jours</p>
      </div>
      <div class="px-3 text-center">
        <p class="font-display font-bold text-2xl text-kinetic-neon tabular-nums">
          <span x-text="topE1rm"></span><span class="text-base font-semibold"> kg</span>
        </p>
        <p class="text-xs text-gray-500 mt-0.5">Meilleur e1RM</p>
      </div>
    </div>
  </template>

  <!-- Liste des records -->
  <section class="mb-8" x-show="!loading && records.length > 0">
    <h2 class="k-section mb-2.5">Tous les records</h2>
    <div class="k-seg mb-3" role="group" aria-label="Trier les records">
      <button
        type="button"
        @click="sort = 'recent'"
        class="k-seg-item"
        :class="sort === 'recent' ? 'on' : ''"
        :aria-pressed="sort === 'recent' ? 'true' : 'false'"
      >
        Récents
      </button>
      <button
        type="button"
        @click="sort = 'e1rm'"
        class="k-seg-item"
        :class="sort === 'e1rm' ? 'on' : ''"
        :aria-pressed="sort === 'e1rm' ? 'true' : 'false'"
      >
        Top e1RM
      </button>
      <button
        type="button"
        @click="sort = 'name'"
        class="k-seg-item"
        :class="sort === 'name' ? 'on' : ''"
        :aria-pressed="sort === 'name' ? 'true' : 'false'"
      >
        A–Z
      </button>
    </div>

    <div class="k-list">
      <template x-for="r in sortedRecords" :key="r.exerciseId">
        <div class="k-row py-3">
          <div class="flex-1 min-w-0">
            <p class="text-base text-white truncate" x-text="r.exerciseName"></p>
            <p class="text-xs text-gray-500 mt-0.5 truncate tabular-nums">
              <span x-text="r.weightLabel + ' × ' + r.reps"></span>
              <span class="mx-1" aria-hidden="true">·</span>
              <span
                :class="r.isRecent ? 'text-kinetic-neon font-medium' : ''"
                x-text="r.dateLabel"
              ></span>
            </p>
          </div>
          <div class="flex-shrink-0 text-right">
            <p class="font-display text-xl font-semibold leading-none text-white tabular-nums">
              <span x-text="r.e1rmKg"></span
              ><span class="text-sm font-medium text-gray-500"> kg</span>
            </p>
            <p class="text-[11px] text-gray-500 mt-1">e1RM</p>
          </div>
        </div>
      </template>
    </div>
  </section>

  <!-- ── Scores de force (Wilks / IPF GL / DOTS) — mode avancé ─────────── -->
  <template x-if="!loading && records.length > 0">
    <section class="adv-only mb-8">
      <div class="flex items-center justify-between gap-3 mb-2.5">
        <h2 class="k-section inline-flex items-center gap-1.5">
          Scores de force
          <span x-data="helpTip" data-term="wilks" class="relative inline-flex">
            <button
              type="button"
              @click="toggle()"
              @click.outside="close()"
              aria-label="Qu'est-ce que le score de force ?"
              class="relative flex h-6 w-6 items-center justify-center rounded-full text-gray-500 transition active:opacity-60 after:absolute after:-inset-2.5 after:content-['']"
            >
              <svg
                class="h-[18px] w-[18px]"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                aria-hidden="true"
              >
                <circle cx="12" cy="12" r="9" />
                <path d="M12 11v5M12 7.6h.01" />
              </svg>
            </button>
            <span
              x-show="open"
              x-transition
              class="absolute left-0 top-full mt-2 z-50 w-60 rounded-xl bg-kinetic-raised p-3 shadow-2xl text-xs text-gray-300 leading-snug font-normal normal-case tracking-normal"
              style="display: none"
            >
              <span class="mb-0.5 block font-semibold text-white" x-text="label"></span>
              <span x-text="def"></span>
            </span>
          </span>
        </h2>
        <button
          type="button"
          @click="showScoresEditor = !showScoresEditor"
          class="k-pill"
          :aria-expanded="showScoresEditor ? 'true' : 'false'"
        >
          <span x-show="!showScoresEditor">Modifier</span>
          <span x-show="showScoresEditor">Fermer</span>
        </button>
      </div>
      <p class="text-sm text-gray-500 mb-3">
        Ton total squat, bench et deadlift, rapporté à ton poids.
      </p>

      <!-- Réglages du profil de force -->
      <template x-if="showScoresEditor">
        <div class="k-list mb-3">
          <label for="f-records-1" class="k-row">
            <span class="text-base text-white flex-shrink-0">Poids corporel</span>
            <span class="flex-1 min-w-0 flex items-baseline justify-end gap-1">
              <input
                id="f-records-1"
                type="number"
                step="0.1"
                inputmode="decimal"
                :value="scoreBodyweightKg || ''"
                @input="setScoreBodyweight($event.target.value)"
                placeholder="80"
                class="w-20 min-w-0 bg-transparent text-right text-base text-white tabular-nums placeholder:text-gray-500 focus:outline-none [appearance:textfield] [&::-webkit-inner-spin-button]:appearance-none [&::-webkit-outer-spin-button]:appearance-none"
              />
              <span class="text-base text-gray-500">kg</span>
            </span>
          </label>
          <div class="k-row">
            <span class="text-base text-white flex-shrink-0" id="records-sex-label">Sexe</span>
            <div class="k-seg ml-auto w-44" role="group" aria-labelledby="records-sex-label">
              <button
                type="button"
                @click="setScoreSex('male')"
                class="k-seg-item"
                :class="scoreSex === 'male' ? 'on' : ''"
                :aria-pressed="scoreSex === 'male' ? 'true' : 'false'"
              >
                Homme
              </button>
              <button
                type="button"
                @click="setScoreSex('female')"
                class="k-seg-item"
                :class="scoreSex === 'female' ? 'on' : ''"
                :aria-pressed="scoreSex === 'female' ? 'true' : 'false'"
              >
                Femme
              </button>
            </div>
          </div>
        </div>
      </template>

      <!-- État incomplet -->
      <template x-if="!scoresReady">
        <p class="bg-kinetic-surface rounded-2xl p-4 text-sm text-gray-500 leading-relaxed">
          Indique ton poids corporel (bouton Modifier) et établis au moins un record au squat, au
          bench ou au deadlift pour calculer ton score.
        </p>
      </template>

      <!-- Scores -->
      <template x-if="scoresReady">
        <div class="space-y-3">
          <!-- Total + niveau, détail SBD -->
          <div class="bg-kinetic-surface rounded-2xl p-4">
            <div class="flex items-end justify-between gap-3">
              <div>
                <p class="text-sm text-gray-500">Total SBD</p>
                <p class="k-metric mt-1.5">
                  <span x-text="sbdTotalKg"></span
                  ><span class="text-lg font-semibold text-gray-500"> kg</span>
                </p>
              </div>
              <div class="text-right">
                <p class="text-sm text-gray-500">Niveau</p>
                <p class="text-lg font-semibold text-white mt-1" x-text="strengthTierLabel"></p>
              </div>
            </div>
            <div class="grid grid-cols-3 gap-2 mt-4">
              <div class="bg-kinetic-ink rounded-xl px-2 py-2.5 text-center">
                <p class="text-xs text-gray-500">Squat</p>
                <p
                  class="text-base font-semibold text-white tabular-nums mt-0.5"
                  x-text="sbdBreakdown.squat + ' kg'"
                ></p>
              </div>
              <div class="bg-kinetic-ink rounded-xl px-2 py-2.5 text-center">
                <p class="text-xs text-gray-500">Bench</p>
                <p
                  class="text-base font-semibold text-white tabular-nums mt-0.5"
                  x-text="sbdBreakdown.bench + ' kg'"
                ></p>
              </div>
              <div class="bg-kinetic-ink rounded-xl px-2 py-2.5 text-center">
                <p class="text-xs text-gray-500">Deadlift</p>
                <p
                  class="text-base font-semibold text-white tabular-nums mt-0.5"
                  x-text="sbdBreakdown.deadlift + ' kg'"
                ></p>
              </div>
            </div>
          </div>

          <!-- Scores normalisés -->
          <div class="k-list">
            <div class="k-row">
              <span class="flex-1 text-base text-white">Wilks</span>
              <span
                class="text-base font-semibold text-white tabular-nums"
                x-text="wilksScore.toFixed(1)"
              ></span>
            </div>
            <div class="k-row">
              <span class="flex-1 text-base text-white">IPF GL</span>
              <span
                class="text-base font-semibold text-white tabular-nums"
                x-text="ipfGlScore.toFixed(1)"
              ></span>
            </div>
            <div class="k-row">
              <span class="flex-1 text-base text-white">DOTS</span>
              <span
                class="text-base font-semibold text-white tabular-nums"
                x-text="dotsScoreValue.toFixed(1)"
              ></span>
            </div>
          </div>
          <p class="k-caption">
            Estimés à partir de tes e1RM. Sources : Wilks (2020), IPF GL (annexe 7), DOTS (Konertz
            2019).
          </p>
        </div>
      </template>
    </section>
  </template>
</div>
