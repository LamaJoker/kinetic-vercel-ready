<div x-data="progression" x-init="init()" class="max-w-md mx-auto px-4 pt-8 pb-8">

  <!-- En-tête -->
  <div class="flex items-center gap-3 mb-6">
    <a href="/"
       class="flex items-center justify-center w-9 h-9 rounded-xl transition-colors flex-shrink-0"
       style="background: var(--k-surface); color: var(--k-tx3);"
       onmouseover="this.style.color='var(--k-tx)'"
       onmouseout="this.style.color='var(--k-tx3)'"
       aria-label="Retour">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/>
      </svg>
    </a>
    <h1 class="font-display-v2 font-bold text-k-tx" style="font-size: 20px; letter-spacing: -0.02em;">Progression</h1>
  </div>

  <!-- État vide -->
  <template x-if="!loading && totalSessions === 0">
    <div class="k-card text-center" style="padding: 32px 24px;">
      <div style="font-size: 48px; margin-bottom: 12px;">📈</div>
      <p class="font-display-v2 font-bold mb-1" style="font-size: 16px; color: var(--k-tx);">Pas encore de données</p>
      <p style="font-size: 13px; color: var(--k-tx3); margin-bottom: 20px;">Termine une première séance pour voir ta progression apparaître ici.</p>
      <a href="/seances" class="btn-p" style="display: inline-block; padding: 10px 22px; font-size: 14px; text-decoration: none;">
        Démarrer une séance
      </a>
    </div>
  </template>

  <!-- Stats globales -->
  <div x-show="totalSessions > 0" class="grid grid-cols-3 gap-2 mb-4">
    <div class="k-card text-center" style="padding: 12px;">
      <p class="font-display-v2 font-bold" style="font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--k-tx3);">Séances</p>
      <p class="font-display-v2 font-bold mt-1" style="font-size: 22px; color: var(--k-tx);" x-text="totalSessions"></p>
    </div>
    <div class="k-card text-center" style="padding: 12px;">
      <p class="font-display-v2 font-bold" style="font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--k-tx3);">Tonnage</p>
      <p class="font-display-v2 font-bold mt-1" style="font-size: 22px; color: var(--k-tx);">
        <span x-text="formatNumber(totalTonnage)"></span><span style="font-size: 11px; color: var(--k-tx3); margin-left: 2px;">kg</span>
      </p>
    </div>
    <div class="k-card text-center" style="padding: 12px;">
      <p class="font-display-v2 font-bold" style="font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--k-tx3);">Régularité</p>
      <p class="font-display-v2 font-bold mt-1" style="font-size: 22px; color: var(--k-p);">
        <span x-text="consistency"></span><span style="font-size: 11px; color: var(--k-tx3); margin-left: 2px;">%</span>
      </p>
    </div>
  </div>

  <!-- Stats avancées -->
  <div x-show="totalSessions > 0" class="grid grid-cols-3 gap-2 mb-4">
    <div class="k-card text-center" style="padding: 12px;">
      <p class="font-display-v2 font-bold" style="font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--k-tx3);">Série max</p>
      <p class="font-display-v2 font-bold mt-1" style="font-size: 22px; color: var(--k-e);">
        <span x-text="longestStreak"></span><span style="font-size: 11px; color: var(--k-tx3); margin-left: 2px;">j</span>
      </p>
    </div>
    <div class="k-card text-center" style="padding: 12px;">
      <p class="font-display-v2 font-bold" style="font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--k-tx3);">Moy/sem</p>
      <p class="font-display-v2 font-bold mt-1" style="font-size: 22px; color: var(--k-tx);" x-text="avgSessionsPerWeek"></p>
    </div>
    <div class="k-card text-center" style="padding: 12px;">
      <p class="font-display-v2 font-bold" style="font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--k-tx3);">Durée moy</p>
      <p class="font-display-v2 font-bold mt-1" style="font-size: 22px; color: var(--k-tx);">
        <span x-text="avgDurationMin"></span><span style="font-size: 11px; color: var(--k-tx3); margin-left: 2px;">min</span>
      </p>
    </div>
  </div>

  <!-- Onglets -->
  <div x-show="totalSessions > 0" class="tabs mb-4">
    <button type="button" @click="setTab('force')" class="tab" :class="activeTab === 'force' ? 'active' : ''">Force</button>
    <button type="button" @click="setTab('volume')" class="tab" :class="activeTab === 'volume' ? 'active' : ''">Volume</button>
    <button type="button" @click="setTab('muscles')" class="tab" :class="activeTab === 'muscles' ? 'active' : ''">Muscles</button>
    <button type="button" @click="setTab('records')" class="tab" :class="activeTab === 'records' ? 'active' : ''">Records</button>
    <button type="button" @click="setTab('heatmap')" class="tab" :class="activeTab === 'heatmap' ? 'active' : ''">Activité</button>
  </div>

  <!-- ─── Onglet FORCE ──────────────────────────────────────────────────── -->
  <div x-show="totalSessions > 0 && activeTab === 'force'" x-transition>
    <div class="k-card mb-3" style="padding: 14px;">
      <label class="font-display-v2 font-bold block mb-2" style="font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--k-tx3);">Exercice</label>
      <select x-model="selectedExerciseId" class="k-input w-full" style="padding: 10px 12px; font-size: 14px;">
        <template x-for="ex in exerciseStats" :key="ex.exerciseId">
          <option :value="ex.exerciseId" x-text="exerciseName(ex.exerciseId)"></option>
        </template>
      </select>
    </div>

    <div class="k-card" style="padding: 16px;">
      <div class="flex items-center justify-between mb-3">
        <p class="font-display-v2 font-bold" style="font-size: 14px; color: var(--k-tx);">Courbe e1RM</p>
        <span class="font-display-v2 font-semibold" style="font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--k-tx3);">kg estimés</span>
      </div>
      <template x-if="forceHasData()">
        <div x-html="forceSvg()" class="w-full"></div>
      </template>
      <template x-if="!forceHasData()">
        <p class="text-center py-6" style="font-size: 13px; color: var(--k-tx3);">Pas assez de données — il faut au moins 2 séances avec cet exercice.</p>
      </template>
    </div>
  </div>

  <!-- ─── Onglet VOLUME ─────────────────────────────────────────────────── -->
  <div x-show="totalSessions > 0 && activeTab === 'volume'" x-transition>
    <div class="k-card" style="padding: 16px;">
      <div class="flex items-center justify-between mb-4">
        <p class="font-display-v2 font-bold" style="font-size: 14px; color: var(--k-tx);">Tonnage hebdomadaire</p>
        <span class="font-display-v2 font-semibold" style="font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--k-tx3);">12 dernières S</span>
      </div>

      <template x-if="weeklyBuckets.length === 0">
        <p class="text-center py-6" style="font-size: 13px; color: var(--k-tx3);">Aucune donnée hebdomadaire.</p>
      </template>

      <div x-show="weeklyBuckets.length > 0" class="flex items-end justify-between gap-1.5 mb-2" style="height: 160px;">
        <template x-for="b in weeklyBuckets" :key="b.isoWeek">
          <div class="flex-1 flex flex-col items-center gap-1 group">
            <div class="w-full rounded-t-md transition-all"
                 style="background: linear-gradient(to top, var(--k-e), #FF9560); box-shadow: 0 0 8px rgba(255,122,51,.3); min-height: 2px;"
                 :style="`height: ${barHeightPct(b.tonnageKg)}%`"
                 :title="`${formatWeek(b.isoWeek)} — ${formatNumber(b.tonnageKg)} kg`"></div>
            <span class="font-mono" style="font-size: 9px; color: var(--k-tx3);" x-text="formatWeek(b.isoWeek)"></span>
          </div>
        </template>
      </div>

      <template x-if="weeklyBuckets.length > 0">
        <div class="grid grid-cols-3 gap-2 pt-3 text-center" style="border-top: 1px solid var(--k-line);">
          <div>
            <p class="font-display-v2 font-bold" style="font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--k-tx3);">Semaine</p>
            <p class="font-display-v2 font-semibold" style="font-size: 13px; color: var(--k-tx);" x-text="formatWeek(weeklyBuckets.at(-1).isoWeek)"></p>
          </div>
          <div>
            <p class="font-display-v2 font-bold" style="font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--k-tx3);">Tonnage</p>
            <p class="font-display-v2 font-semibold" style="font-size: 13px; color: var(--k-tx);">
              <span x-text="formatNumber(weeklyBuckets.at(-1).tonnageKg)"></span>
              <span style="font-size: 10px; color: var(--k-tx3);">kg</span>
            </p>
          </div>
          <div>
            <p class="font-display-v2 font-bold" style="font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--k-tx3);">Sets</p>
            <p class="font-display-v2 font-semibold" style="font-size: 13px; color: var(--k-tx);" x-text="weeklyBuckets.at(-1).totalSets"></p>
          </div>
        </div>
      </template>
    </div>
  </div>

  <!-- ─── Onglet MUSCLES ────────────────────────────────────────────────── -->
  <div x-show="totalSessions > 0 && activeTab === 'muscles'" x-transition>
    <div class="k-card" style="padding: 16px;">
      <p class="font-display-v2 font-bold mb-4" style="font-size: 14px; color: var(--k-tx);">Répartition par groupe musculaire</p>

      <template x-if="muscles.length === 0">
        <p class="text-center py-6" style="font-size: 13px; color: var(--k-tx3);">Aucune donnée — vérifie que les exercices ont des muscles renseignés.</p>
      </template>

      <div x-show="muscles.length > 0" class="space-y-3">
        <template x-for="m in muscles" :key="m.muscle">
          <div>
            <div class="flex items-center justify-between mb-1">
              <span class="font-display-v2 font-semibold" style="font-size: 13px; color: var(--k-tx);" x-text="muscleLabel(m.muscle)"></span>
              <span class="font-mono" style="font-size: 12px; color: var(--k-tx3);" x-text="`${Math.round(m.share * 100)}%`"></span>
            </div>
            <div class="bar-track">
              <div class="bar-fill transition-all duration-500" :style="`width: ${Math.round(m.share * 100)}%`"></div>
            </div>
          </div>
        </template>
      </div>
    </div>
  </div>

  <!-- ─── Onglet HEATMAP ───────────────────────────────────────────────── -->
  <div x-show="totalSessions > 0 && activeTab === 'heatmap'" x-transition>
    <div class="k-card" style="padding: 16px;">
      <div class="flex items-center justify-between mb-3">
        <p class="font-display-v2 font-bold" style="font-size: 14px; color: var(--k-tx);">Activité — 20 semaines</p>
        <div class="flex items-center gap-1" style="font-size: 9px; color: var(--k-tx3);">
          <span class="w-3 h-3 rounded-sm inline-block" style="background: var(--k-void); border: 1px solid var(--k-line);"></span>0
          <span class="w-3 h-3 rounded-sm inline-block ml-1" style="background: oklch(82% 0.28 145 / 0.3);"></span>1
          <span class="w-3 h-3 rounded-sm inline-block ml-1" style="background: var(--k-p);"></span>2+
        </div>
      </div>

      <div class="flex gap-1 mb-1">
        <div class="grid grid-rows-7 gap-0.5 mr-1">
          <template x-for="d in ['D','L','M','M','J','V','S']">
            <span class="flex items-center justify-center" style="width: 12px; height: 12px; font-size: 8px; color: var(--k-tx3);" x-text="d"></span>
          </template>
        </div>
        <div class="flex gap-0.5 flex-1 overflow-x-auto">
          <template x-for="(week, wi) in heatmapGrid" :key="wi">
            <div class="flex flex-col gap-0.5">
              <template x-for="(cell, di) in week" :key="di">
                <div class="w-3 h-3 rounded-sm cursor-default transition-transform hover:scale-125"
                     :class="heatmapColor(cell.count)"
                     :title="cell.label + (cell.count > 0 ? ' · ' + cell.count + ' séance(s)' : '')"></div>
              </template>
            </div>
          </template>
        </div>
      </div>

      <p class="text-center mt-2" style="font-size: 9px; color: var(--k-tx3);">← passé · futur →</p>

      <div class="grid grid-cols-3 gap-2 mt-4 pt-3 text-center" style="border-top: 1px solid var(--k-line);">
        <div>
          <p class="font-display-v2 font-bold" style="font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--k-tx3);">20 sem.</p>
          <p class="font-display-v2 font-semibold" style="font-size: 13px; color: var(--k-tx);" x-text="sessions.filter(s => Date.parse(s.startedAt) >= Date.now() - 20*7*86400000).length + ' séances'"></p>
        </div>
        <div>
          <p class="font-display-v2 font-bold" style="font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--k-tx3);">Total</p>
          <p class="font-display-v2 font-semibold" style="font-size: 13px; color: var(--k-tx);" x-text="totalSessions + ' séances'"></p>
        </div>
        <div>
          <p class="font-display-v2 font-bold" style="font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--k-tx3);">Régularité</p>
          <p class="font-display-v2 font-bold" style="font-size: 13px; color: var(--k-p);" x-text="consistency + '%'"></p>
        </div>
      </div>
    </div>
  </div>

  <!-- ─── Onglet RECORDS ───────────────────────────────────────────────── -->
  <div x-show="totalSessions > 0 && activeTab === 'records'" x-transition>
    <div class="k-card" style="padding: 16px;">
      <div class="flex items-center justify-between mb-4">
        <p class="font-display-v2 font-bold" style="font-size: 14px; color: var(--k-tx);">Records personnels</p>
        <span class="font-display-v2 font-semibold" style="font-size: 11px; color: var(--k-tx3);" x-text="`${records.length} PR`"></span>
      </div>

      <template x-if="records.length === 0">
        <p class="text-center py-6" style="font-size: 13px; color: var(--k-tx3);">Pas encore de PR détecté.</p>
      </template>

      <ul x-show="records.length > 0" style="list-style: none; padding: 0; margin: 0;">
        <template x-for="(pr, i) in records" :key="`${pr.exerciseId}-${pr.achievedAt}`">
          <li class="flex items-center gap-3 py-3" style="border-bottom: 1px solid var(--k-line);">
            <div class="flex items-center justify-center flex-shrink-0"
                 style="width: 32px; height: 32px; border-radius: 99px;"
                 :style="i === 0
                   ? 'background: var(--k-p); color: #07070B; box-shadow: 0 0 12px var(--k-p-glow);'
                   : 'background: var(--k-elevated); border: 1px solid var(--k-line); color: var(--k-tx3);'">
              <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M13 2L4 14H10L11 22L20 10H14L13 2Z"/></svg>
            </div>
            <div class="flex-1 min-w-0">
              <p class="font-display-v2 font-semibold truncate" style="font-size: 13px; color: var(--k-tx);" x-text="exerciseName(pr.exerciseId)"></p>
              <p style="font-size: 11px; color: var(--k-tx3);" x-text="`${pr.weightKg} kg × ${pr.reps} • ${formatDate(pr.achievedAt)}`"></p>
            </div>
            <div class="text-right">
              <p class="font-display-v2 font-bold" style="font-size: 15px; color: var(--k-e);" x-text="`${formatNumber(pr.e1rmKg, 1)}`"></p>
              <p class="font-mono" style="font-size: 10px; color: var(--k-tx3);">e1RM kg</p>
            </div>
          </li>
        </template>
      </ul>
    </div>
  </div>

</div>
