<div x-data="progression" x-init="init()" class="max-w-md mx-auto px-4 pt-8 pb-8">
  <!-- En-tête -->
  <div class="flex items-center gap-3 mb-6">
    <a
      href="/"
      class="p-1.5 -ml-1.5 text-gray-500 hover:text-white transition-colors rounded-lg hover:bg-kinetic-surface"
      aria-label="Retour"
    >
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
      </svg>
    </a>
    <h1 class="text-2xl font-display font-black tracking-tight text-white">Progression</h1>
  </div>

  <!-- État vide -->
  <template x-if="!loading && totalSessions === 0">
    <div class="bg-kinetic-surface rounded-2xl p-8 text-center ring-1 ring-white/5">
      <div class="text-5xl mb-3">📈</div>
      <p class="text-white font-semibold mb-1">Pas encore de données</p>
      <p class="text-sm text-gray-500 mb-5">
        Termine une première séance pour voir ta progression apparaître ici.
      </p>
      <a
        href="/seances"
        class="inline-block bg-kinetic-electric hover:bg-orange-600 text-white font-semibold px-5 py-2.5 rounded-xl transition-colors text-sm"
      >
        Démarrer une séance
      </a>
    </div>
  </template>

  <!-- Stats globales -->
  <div x-show="totalSessions > 0" class="grid grid-cols-3 gap-2 mb-4">
    <div class="bg-kinetic-surface rounded-2xl p-3 ring-1 ring-white/5 text-center">
      <p class="text-[10px] uppercase tracking-widest text-gray-500 font-semibold">Séances</p>
      <p class="font-display font-black text-xl text-white mt-1" x-text="totalSessions"></p>
    </div>
    <div class="bg-kinetic-surface rounded-2xl p-3 ring-1 ring-white/5 text-center">
      <p class="text-[10px] uppercase tracking-widest text-gray-500 font-semibold">Tonnage</p>
      <p class="font-display font-black text-xl text-white mt-1">
        <span x-text="formatNumber(totalTonnage)"></span
        ><span class="text-xs text-gray-500 font-medium ml-0.5">kg</span>
      </p>
    </div>
    <div class="bg-kinetic-surface rounded-2xl p-3 ring-1 ring-white/5 text-center">
      <p class="text-[10px] uppercase tracking-widest text-gray-500 font-semibold">Régularité</p>
      <p class="font-display font-black text-xl text-kinetic-neon mt-1">
        <span x-text="consistency"></span
        ><span class="text-xs text-gray-500 font-medium ml-0.5">%</span>
      </p>
    </div>
  </div>

  <!-- Stats avancées -->
  <div x-show="totalSessions > 0" class="grid grid-cols-3 gap-2 mb-4">
    <div class="bg-kinetic-surface rounded-2xl p-3 ring-1 ring-white/5 text-center">
      <p class="text-[10px] uppercase tracking-widest text-gray-500 font-semibold">Série max</p>
      <p class="font-display font-black text-xl text-kinetic-electric mt-1">
        <span x-text="longestStreak"></span
        ><span class="text-xs text-gray-500 font-medium ml-0.5">j</span>
      </p>
    </div>
    <div class="bg-kinetic-surface rounded-2xl p-3 ring-1 ring-white/5 text-center">
      <p class="text-[10px] uppercase tracking-widest text-gray-500 font-semibold">Moy/sem</p>
      <p class="font-display font-black text-xl text-white mt-1" x-text="avgSessionsPerWeek"></p>
    </div>
    <div class="bg-kinetic-surface rounded-2xl p-3 ring-1 ring-white/5 text-center">
      <p class="text-[10px] uppercase tracking-widest text-gray-500 font-semibold">Durée moy</p>
      <p class="font-display font-black text-xl text-white mt-1">
        <span x-text="avgDurationMin"></span
        ><span class="text-xs text-gray-500 font-medium ml-0.5">min</span>
      </p>
    </div>
  </div>

  <!-- Onglets -->
  <div
    x-show="totalSessions > 0"
    class="grid grid-cols-5 gap-1 bg-kinetic-surface p-1 rounded-2xl ring-1 ring-white/5 mb-4"
  >
    <button
      type="button"
      @click="setTab('force')"
      :class="activeTab === 'force' ? 'bg-kinetic-electric text-white shadow-[0_0_14px_rgba(255,106,0,0.45)]' : 'text-gray-400 hover:text-white'"
      class="text-xs font-semibold py-2 rounded-xl transition-all"
    >
      Force
    </button>
    <button
      type="button"
      @click="setTab('volume')"
      :class="activeTab === 'volume' ? 'bg-kinetic-electric text-white shadow-[0_0_14px_rgba(255,106,0,0.45)]' : 'text-gray-400 hover:text-white'"
      class="text-xs font-semibold py-2 rounded-xl transition-all"
    >
      Volume
    </button>
    <button
      type="button"
      @click="setTab('muscles')"
      :class="activeTab === 'muscles' ? 'bg-kinetic-electric text-white shadow-[0_0_14px_rgba(255,106,0,0.45)]' : 'text-gray-400 hover:text-white'"
      class="text-xs font-semibold py-2 rounded-xl transition-all"
    >
      Muscles
    </button>
    <button
      type="button"
      @click="setTab('records')"
      :class="activeTab === 'records' ? 'bg-kinetic-electric text-white shadow-[0_0_14px_rgba(255,106,0,0.45)]' : 'text-gray-400 hover:text-white'"
      class="text-xs font-semibold py-2 rounded-xl transition-all"
    >
      Records
    </button>
    <button
      type="button"
      @click="setTab('heatmap')"
      :class="activeTab === 'heatmap' ? 'bg-kinetic-electric text-white shadow-[0_0_14px_rgba(255,106,0,0.45)]' : 'text-gray-400 hover:text-white'"
      class="text-xs font-semibold py-2 rounded-xl transition-all"
    >
      Activité
    </button>
  </div>

  <!-- ─── Onglet FORCE ──────────────────────────────────────── -->
  <div x-show="totalSessions > 0 && activeTab === 'force'" x-transition>
    <div class="bg-kinetic-surface rounded-2xl p-4 ring-1 ring-white/5 mb-3">
      <label class="block text-xs uppercase tracking-widest text-gray-500 font-semibold mb-2"
        >Exercice</label
      >
      <select
        x-model="selectedExerciseId"
        class="w-full bg-kinetic-ink border border-white/10 rounded-xl px-3 py-2.5 text-white text-sm"
      >
        <template x-for="ex in exerciseStats" :key="ex.exerciseId">
          <option :value="ex.exerciseId" x-text="exerciseName(ex.exerciseId)"></option>
        </template>
      </select>
    </div>

    <div class="bg-kinetic-surface rounded-2xl p-4 ring-1 ring-white/5">
      <div class="flex items-center justify-between mb-3">
        <h2 class="font-display font-bold text-white tracking-tight text-sm">Courbe e1RM</h2>
        <span class="text-[10px] uppercase tracking-widest text-gray-500 font-semibold"
          >kg estimés</span
        >
      </div>
      <template x-if="forceHasData()">
        <div x-html="forceSvg()" class="w-full"></div>
      </template>
      <template x-if="!forceHasData()">
        <p class="text-sm text-gray-500 text-center py-6">
          Pas assez de données pour tracer une courbe — il faut au moins 2 séances avec cet
          exercice.
        </p>
      </template>
    </div>
  </div>

  <!-- ─── Onglet VOLUME ─────────────────────────────────────── -->
  <div x-show="totalSessions > 0 && activeTab === 'volume'" x-transition>
    <div class="bg-kinetic-surface rounded-2xl p-4 ring-1 ring-white/5">
      <div class="flex items-center justify-between mb-4">
        <h2 class="font-display font-bold text-white tracking-tight text-sm">
          Tonnage hebdomadaire
        </h2>
        <span class="text-[10px] uppercase tracking-widest text-gray-500 font-semibold"
          >12 dernières S</span
        >
      </div>

      <template x-if="weeklyBuckets.length === 0">
        <p class="text-sm text-gray-500 text-center py-6">Aucune donnée hebdomadaire.</p>
      </template>

      <div
        x-show="weeklyBuckets.length > 0"
        class="flex items-end justify-between gap-1.5 h-40 mb-2"
      >
        <template x-for="b in weeklyBuckets" :key="b.isoWeek">
          <div class="flex-1 flex flex-col items-center gap-1 group">
            <div
              class="w-full bg-gradient-to-t from-kinetic-electric to-orange-500 rounded-t-md transition-all shadow-[0_0_8px_rgba(255,106,0,0.35)]"
              :style="`height: ${barHeightPct(b.tonnageKg)}%; min-height: 2px`"
              :title="`${formatWeek(b.isoWeek)} — ${formatNumber(b.tonnageKg)} kg`"
            ></div>
            <span class="text-[9px] text-gray-500 font-mono" x-text="formatWeek(b.isoWeek)"></span>
          </div>
        </template>
      </div>

      <template x-if="weeklyBuckets.length > 0">
        <div class="grid grid-cols-3 gap-2 pt-3 border-t border-white/5 text-center">
          <div>
            <p class="text-[10px] uppercase tracking-widest text-gray-500 font-semibold">Semaine</p>
            <p
              class="text-sm font-bold text-white"
              x-text="formatWeek(weeklyBuckets.at(-1).isoWeek)"
            ></p>
          </div>
          <div>
            <p class="text-[10px] uppercase tracking-widest text-gray-500 font-semibold">Tonnage</p>
            <p class="text-sm font-bold text-white">
              <span x-text="formatNumber(weeklyBuckets.at(-1).tonnageKg)"></span>
              <span class="text-[10px] text-gray-500">kg</span>
            </p>
          </div>
          <div>
            <p class="text-[10px] uppercase tracking-widest text-gray-500 font-semibold">Sets</p>
            <p class="text-sm font-bold text-white" x-text="weeklyBuckets.at(-1).totalSets"></p>
          </div>
        </div>
      </template>
    </div>
  </div>

  <!-- ─── Onglet MUSCLES ────────────────────────────────────── -->
  <div x-show="totalSessions > 0 && activeTab === 'muscles'" x-transition>
    <div class="bg-kinetic-surface rounded-2xl p-4 ring-1 ring-white/5">
      <h2 class="font-display font-bold text-white tracking-tight text-sm mb-4">
        Répartition par groupe musculaire
      </h2>

      <template x-if="muscles.length === 0">
        <p class="text-sm text-gray-500 text-center py-6">
          Aucune donnée — vérifie que les exercices ont des muscles renseignés.
        </p>
      </template>

      <div x-show="muscles.length > 0" class="space-y-3">
        <template x-for="m in muscles" :key="m.muscle">
          <div>
            <div class="flex items-center justify-between mb-1">
              <span class="text-sm font-medium text-white" x-text="muscleLabel(m.muscle)"></span>
              <span
                class="text-xs text-gray-500 font-mono"
                x-text="`${Math.round(m.share * 100)}%`"
              ></span>
            </div>
            <div class="h-2 bg-black/40 rounded-full overflow-hidden ring-1 ring-white/5">
              <div
                class="h-full bg-gradient-to-r from-kinetic-neon to-lime-300 rounded-full transition-all duration-500 shadow-[0_0_8px_rgba(168,255,0,0.4)]"
                :style="`width: ${Math.round(m.share * 100)}%`"
              ></div>
            </div>
          </div>
        </template>
      </div>
    </div>
  </div>

  <!-- ─── Onglet HEATMAP ──────────────────────────────────────── -->
  <div x-show="totalSessions > 0 && activeTab === 'heatmap'" x-transition>
    <div class="bg-kinetic-surface rounded-2xl p-4 ring-1 ring-white/5">
      <div class="flex items-center justify-between mb-3">
        <h2 class="font-display font-bold text-white tracking-tight text-sm">
          Activité — 20 semaines
        </h2>
        <div class="flex items-center gap-1 text-[9px] text-gray-500">
          <span class="w-3 h-3 rounded-sm bg-kinetic-ink ring-1 ring-white/10 inline-block"></span>0
          <span class="w-3 h-3 rounded-sm bg-kinetic-neon/30 inline-block ml-1"></span>1
          <span class="w-3 h-3 rounded-sm bg-kinetic-neon inline-block ml-1"></span>2+
        </div>
      </div>

      <!-- Labels jours -->
      <div class="flex gap-1 mb-1 pl-0">
        <div class="grid grid-rows-7 gap-0.5 mr-1">
          <template x-for="d in ['D','L','M','M','J','V','S']">
            <span
              class="text-[8px] text-gray-600 w-3 flex items-center justify-center h-3"
              x-text="d"
            ></span>
          </template>
        </div>
        <!-- Grille -->
        <div class="flex gap-0.5 flex-1 overflow-x-auto">
          <template x-for="(week, wi) in heatmapGrid" :key="wi">
            <div class="flex flex-col gap-0.5">
              <template x-for="(cell, di) in week" :key="di">
                <div
                  class="w-3 h-3 rounded-sm cursor-default transition-transform hover:scale-125"
                  :class="heatmapColor(cell.count)"
                  :title="cell.label + (cell.count > 0 ? ' · ' + cell.count + ' séance(s)' : '')"
                ></div>
              </template>
            </div>
          </template>
        </div>
      </div>

      <!-- Légende mois -->
      <p class="text-[9px] text-gray-600 mt-2 text-center">← passé · futur →</p>

      <!-- Résumé période -->
      <div class="grid grid-cols-3 gap-2 mt-4 pt-3 border-t border-white/5 text-center">
        <div>
          <p class="text-[10px] uppercase tracking-widest text-gray-500 font-semibold">20 sem.</p>
          <p
            class="text-sm font-bold text-white"
            x-text="sessions.filter(s => Date.parse(s.startedAt) >= Date.now() - 20*7*86400000).length + ' séances'"
          ></p>
        </div>
        <div>
          <p class="text-[10px] uppercase tracking-widest text-gray-500 font-semibold">Total</p>
          <p class="text-sm font-bold text-white" x-text="totalSessions + ' séances'"></p>
        </div>
        <div>
          <p class="text-[10px] uppercase tracking-widest text-gray-500 font-semibold">
            Régularité
          </p>
          <p class="text-sm font-bold text-kinetic-neon" x-text="consistency + '%'"></p>
        </div>
      </div>
    </div>
  </div>

  <!-- ─── Onglet RECORDS ────────────────────────────────────── -->
  <div x-show="totalSessions > 0 && activeTab === 'records'" x-transition>
    <div class="bg-kinetic-surface rounded-2xl p-4 ring-1 ring-white/5">
      <div class="flex items-center justify-between mb-4">
        <h2 class="font-display font-bold text-white tracking-tight text-sm">Records personnels</h2>
        <span
          class="text-[10px] uppercase tracking-widest text-gray-500 font-semibold"
          x-text="`${records.length} PR`"
        ></span>
      </div>

      <template x-if="records.length === 0">
        <p class="text-sm text-gray-500 text-center py-6">Pas encore de PR détecté.</p>
      </template>

      <ul x-show="records.length > 0" class="divide-y divide-white/5">
        <template x-for="(pr, i) in records" :key="`${pr.exerciseId}-${pr.achievedAt}`">
          <li class="py-3 flex items-center gap-3">
            <div
              class="w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0"
              :class="i === 0 ? 'bg-kinetic-neon text-gray-950 shadow-[0_0_12px_rgba(168,255,0,0.5)]' : 'bg-kinetic-ink ring-1 ring-white/10 text-gray-400'"
            >
              <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                <path d="M13 2L4 14H10L11 22L20 10H14L13 2Z" />
              </svg>
            </div>
            <div class="flex-1 min-w-0">
              <p
                class="text-sm font-semibold text-white truncate"
                x-text="exerciseName(pr.exerciseId)"
              ></p>
              <p
                class="text-[11px] text-gray-500"
                x-text="`${pr.weightKg} kg × ${pr.reps} • ${formatDate(pr.achievedAt)}`"
              ></p>
            </div>
            <div class="text-right">
              <p
                class="text-sm font-display font-black text-kinetic-electric"
                x-text="`${formatNumber(pr.e1rmKg, 1)}`"
              ></p>
              <p class="text-[10px] text-gray-500 font-mono">e1RM kg</p>
            </div>
          </li>
        </template>
      </ul>
    </div>
  </div>
</div>
