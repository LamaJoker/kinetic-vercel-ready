<div x-data="mensurations" x-init="init()" class="max-w-md mx-auto px-4 pt-8 pb-8">
  <!-- En-tête -->
  <div class="k-nav">
    <a href="/" class="k-back" aria-label="Retour">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2.4"
          d="M15 19l-7-7 7-7"
        />
      </svg>
    </a>
    <span
      class="k-badge"
      x-show="entries.length > 0"
      x-text="$plural(entries.length, 'entrée')"
    ></span>
    <div>
      <h1 class="text-3xl font-display font-bold tracking-tight text-white">Mensurations</h1>
      <p class="text-gray-500">Tours de corps et évolution, en cm</p>
    </div>
  </div>

  <!-- Mesure active : valeur, évolution, période, courbe -->
  <section class="k-card mb-8" aria-labelledby="mens-active-title">
    <div class="flex items-center gap-2">
      <span
        class="w-2.5 h-2.5 rounded-full flex-shrink-0"
        :style="metricDotStyle(activeMetricDef.color)"
        aria-hidden="true"
      ></span>
      <h2 id="mens-active-title" class="k-card-title" x-text="activeMetricDef.label"></h2>
    </div>

    <p class="mt-3 flex items-baseline gap-1.5">
      <span class="k-metric" x-text="formatCm(currentValue(activeMetric))"></span>
      <span
        x-show="currentValue(activeMetric) !== null"
        class="text-base font-semibold text-gray-500"
        >cm</span
      >
    </p>
    <p
      class="text-xs text-gray-500 mt-1.5 tabular-nums"
      x-show="metricDelta(activeMetric) !== null"
      x-text="formatDelta(activeMetric) + ' cm ' + periodLabel"
    ></p>
    <p
      class="text-xs text-gray-500 mt-1.5"
      x-show="metricDelta(activeMetric) === null"
      x-text="currentValue(activeMetric) !== null ? 'Dernière valeur relevée' : 'Pas encore mesuré'"
    ></p>

    <!-- Période -->
    <div class="k-seg mt-4" role="group" aria-label="Période affichée">
      <template x-for="p in periods" :key="p.v">
        <button
          type="button"
          class="k-seg-item"
          @click="period = p.v"
          :aria-pressed="period === p.v"
          x-text="p.l"
        ></button>
      </template>
    </div>

    <!-- Courbe ou état vide -->
    <template x-if="chartPoints().length >= 2">
      <div x-svg="chartSvg()" class="w-full mt-4 text-gray-500"></div>
    </template>
    <template x-if="chartPoints().length < 2">
      <div class="flex flex-col items-center justify-center pt-8 pb-4 text-center">
        <svg
          class="w-8 h-8 text-gray-500 mb-3"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M3 3v18h18M7 15l4-4 3 3 5-6"
          />
        </svg>
        <p class="text-base font-semibold text-white">Pas encore de courbe</p>
        <p class="text-xs text-gray-500 mt-1 max-w-[16rem]">
          Enregistre au moins 2 mesures de
          <span class="text-white" x-text="activeMetricDef.label"></span> sur la période.
        </p>
      </div>
    </template>

    <!-- Repères de la période -->
    <template x-if="chartPoints().length >= 2">
      <dl class="grid grid-cols-3 gap-2 mt-4">
        <div class="rounded-xl bg-kinetic-elevated px-3 py-2.5">
          <dt class="text-xs text-gray-500">Départ</dt>
          <dd
            class="text-base font-semibold text-white tabular-nums mt-0.5"
            x-text="chartStats.start"
          ></dd>
        </div>
        <div class="rounded-xl bg-kinetic-elevated px-3 py-2.5">
          <dt class="text-xs text-gray-500">Plus bas</dt>
          <dd
            class="text-base font-semibold text-white tabular-nums mt-0.5"
            x-text="chartStats.min"
          ></dd>
        </div>
        <div class="rounded-xl bg-kinetic-elevated px-3 py-2.5">
          <dt class="text-xs text-gray-500">Mesures</dt>
          <dd
            class="text-base font-semibold text-white tabular-nums mt-0.5"
            x-text="chartPoints().length"
          ></dd>
        </div>
      </dl>
    </template>
  </section>

  <!-- Toutes les mesures : choix de la courbe -->
  <h2 class="k-section mb-2.5">Toutes les mesures</h2>
  <div class="grid grid-cols-3 gap-2 mb-8">
    <template x-for="m in metrics" :key="m.key">
      <button
        type="button"
        @click="activeMetric = m.key"
        :aria-pressed="activeMetric === m.key"
        class="rounded-2xl px-3 py-2.5 min-h-[4.75rem] text-left transition active:scale-[0.97]"
        :class="activeMetric === m.key ? 'bg-kinetic-elevated' : 'bg-kinetic-surface'"
      >
        <span class="flex items-center gap-1.5 text-xs">
          <!-- La couleur de la mesure est portée par une pastille, pas par le texte (contraste) -->
          <span
            class="w-2 h-2 rounded-full flex-shrink-0"
            :class="hasData(m.key) ? '' : 'bg-gray-700'"
            :style="hasData(m.key) ? metricDotStyle(m.color) : ''"
            aria-hidden="true"
          ></span>
          <span
            class="truncate"
            :class="activeMetric === m.key ? 'text-white font-semibold' : 'text-gray-400'"
            x-text="m.label"
          ></span>
        </span>
        <span
          class="block mt-1 text-lg font-semibold leading-tight tabular-nums"
          :class="currentValue(m.key) === null ? 'text-gray-500' : 'text-white'"
          x-text="formatCm(currentValue(m.key))"
        ></span>
        <span
          x-show="currentValue(m.key) !== null"
          class="block text-[11px] text-gray-500 tabular-nums"
          x-text="metricDelta(m.key) !== null ? formatDelta(m.key) + ' cm' : 'cm'"
        ></span>
        <span x-show="currentValue(m.key) === null" class="block text-[11px] text-gray-500">
          Non mesuré
        </span>
      </button>
    </template>
  </div>

  <!-- Formulaire d'enregistrement -->
  <h2 class="k-section mb-2.5">Nouvelle mesure</h2>
  <div class="mb-8">
    <!-- Haut du corps -->
    <p class="k-caption mb-1.5">Haut du corps</p>
    <div class="k-list mb-5">
      <label for="f-mensurations-1" class="k-row cursor-text">
        <span class="flex-1 text-base text-white">Cou</span>
        <input
          id="f-mensurations-1"
          type="number"
          inputmode="decimal"
          x-model.number="fNeck"
          min="20"
          max="70"
          step="0.5"
          placeholder="38"
          class="w-20 bg-transparent text-right text-base text-white tabular-nums placeholder:text-gray-500 caret-kinetic-neon focus:outline-none"
        />
        <span class="text-base text-gray-500">cm</span>
      </label>
      <label for="f-mensurations-2" class="k-row cursor-text">
        <span class="flex-1 text-base text-white">Épaules</span>
        <input
          id="f-mensurations-2"
          type="number"
          inputmode="decimal"
          x-model.number="fShoulders"
          min="70"
          max="170"
          step="0.5"
          placeholder="115"
          class="w-20 bg-transparent text-right text-base text-white tabular-nums placeholder:text-gray-500 caret-kinetic-neon focus:outline-none"
        />
        <span class="text-base text-gray-500">cm</span>
      </label>
      <label for="f-mensurations-3" class="k-row cursor-text">
        <span class="flex-1 text-base text-white">Poitrine</span>
        <input
          id="f-mensurations-3"
          type="number"
          inputmode="decimal"
          x-model.number="fChest"
          min="50"
          max="160"
          step="0.5"
          placeholder="92"
          class="w-20 bg-transparent text-right text-base text-white tabular-nums placeholder:text-gray-500 caret-kinetic-neon focus:outline-none"
        />
        <span class="text-base text-gray-500">cm</span>
      </label>
    </div>

    <!-- Bras -->
    <p class="k-caption mb-1.5">Bras</p>
    <div class="k-list mb-5">
      <label for="f-mensurations-4" class="k-row cursor-text">
        <span class="flex-1 text-base text-white">Bras gauche</span>
        <input
          id="f-mensurations-4"
          type="number"
          inputmode="decimal"
          x-model.number="fLeftBicep"
          min="15"
          max="65"
          step="0.5"
          placeholder="36"
          class="w-20 bg-transparent text-right text-base text-white tabular-nums placeholder:text-gray-500 caret-kinetic-neon focus:outline-none"
        />
        <span class="text-base text-gray-500">cm</span>
      </label>
      <label for="f-mensurations-5" class="k-row cursor-text">
        <span class="flex-1 text-base text-white">Bras droit</span>
        <input
          id="f-mensurations-5"
          type="number"
          inputmode="decimal"
          x-model.number="fRightBicep"
          min="15"
          max="65"
          step="0.5"
          placeholder="36"
          class="w-20 bg-transparent text-right text-base text-white tabular-nums placeholder:text-gray-500 caret-kinetic-neon focus:outline-none"
        />
        <span class="text-base text-gray-500">cm</span>
      </label>
    </div>

    <!-- Taille et hanches -->
    <p class="k-caption mb-1.5">Taille et hanches</p>
    <div class="k-list mb-5">
      <label for="f-mensurations-6" class="k-row cursor-text">
        <span class="flex-1 text-base text-white">Taille</span>
        <input
          id="f-mensurations-6"
          type="number"
          inputmode="decimal"
          x-model.number="fWaist"
          min="40"
          max="160"
          step="0.5"
          placeholder="80"
          class="w-20 bg-transparent text-right text-base text-white tabular-nums placeholder:text-gray-500 caret-kinetic-neon focus:outline-none"
        />
        <span class="text-base text-gray-500">cm</span>
      </label>
      <label for="f-mensurations-7" class="k-row cursor-text">
        <span class="flex-1 text-base text-white">Hanches</span>
        <input
          id="f-mensurations-7"
          type="number"
          inputmode="decimal"
          x-model.number="fHips"
          min="50"
          max="170"
          step="0.5"
          placeholder="96"
          class="w-20 bg-transparent text-right text-base text-white tabular-nums placeholder:text-gray-500 caret-kinetic-neon focus:outline-none"
        />
        <span class="text-base text-gray-500">cm</span>
      </label>
    </div>

    <!-- Jambes -->
    <p class="k-caption mb-1.5">Jambes</p>
    <div class="k-list mb-5">
      <label for="f-mensurations-8" class="k-row cursor-text">
        <span class="flex-1 text-base text-white">Cuisse gauche</span>
        <input
          id="f-mensurations-8"
          type="number"
          inputmode="decimal"
          x-model.number="fLeftThigh"
          min="25"
          max="100"
          step="0.5"
          placeholder="58"
          class="w-20 bg-transparent text-right text-base text-white tabular-nums placeholder:text-gray-500 caret-kinetic-neon focus:outline-none"
        />
        <span class="text-base text-gray-500">cm</span>
      </label>
      <label for="f-mensurations-9" class="k-row cursor-text">
        <span class="flex-1 text-base text-white">Cuisse droite</span>
        <input
          id="f-mensurations-9"
          type="number"
          inputmode="decimal"
          x-model.number="fRightThigh"
          min="25"
          max="100"
          step="0.5"
          placeholder="58"
          class="w-20 bg-transparent text-right text-base text-white tabular-nums placeholder:text-gray-500 caret-kinetic-neon focus:outline-none"
        />
        <span class="text-base text-gray-500">cm</span>
      </label>
      <label for="f-mensurations-10" class="k-row cursor-text">
        <span class="flex-1 text-base text-white">Mollet gauche</span>
        <input
          id="f-mensurations-10"
          type="number"
          inputmode="decimal"
          x-model.number="fLeftCalf"
          min="15"
          max="65"
          step="0.5"
          placeholder="34"
          class="w-20 bg-transparent text-right text-base text-white tabular-nums placeholder:text-gray-500 caret-kinetic-neon focus:outline-none"
        />
        <span class="text-base text-gray-500">cm</span>
      </label>
      <label for="f-mensurations-11" class="k-row cursor-text">
        <span class="flex-1 text-base text-white">Mollet droit</span>
        <input
          id="f-mensurations-11"
          type="number"
          inputmode="decimal"
          x-model.number="fRightCalf"
          min="15"
          max="65"
          step="0.5"
          placeholder="34"
          class="w-20 bg-transparent text-right text-base text-white tabular-nums placeholder:text-gray-500 caret-kinetic-neon focus:outline-none"
        />
        <span class="text-base text-gray-500">cm</span>
      </label>
    </div>

    <!-- Note -->
    <div class="k-list mb-5">
      <label class="k-row cursor-text">
        <input
          x-model="fNote"
          aria-label="Note"
          maxlength="120"
          placeholder="Note (optionnel, ex. matin à jeun)"
          class="flex-1 min-w-0 bg-transparent text-base text-white placeholder:text-gray-500 caret-kinetic-neon focus:outline-none"
        />
      </label>
    </div>

    <button type="button" @click="addEntry()" :disabled="!hasFormData" class="k-btn">
      Enregistrer les mensurations
    </button>
    <p class="k-caption mt-2 text-center">
      Remplis seulement ce que tu as mesuré. Une saisie le même jour complète celle du jour.
    </p>
  </div>

  <!-- Historique -->
  <div class="flex items-baseline justify-between mb-2.5">
    <h2 class="k-section">Historique</h2>
    <span
      x-show="entries.length > 0"
      class="text-xs text-gray-500 tabular-nums"
      x-text="$plural(entries.length, 'entrée')"
    ></span>
  </div>

  <template x-if="entries.length === 0">
    <div class="k-empty mb-8">
      <p>Aucune mensuration</p>
      <p class="text-xs text-gray-500 mt-1">Commence à te mesurer pour suivre tes progrès.</p>
    </div>
  </template>

  <ul x-show="entries.length > 0" class="k-list mb-8">
    <template x-for="entry in entries.slice().reverse().slice(0, 30)" :key="entry.id">
      <li class="k-row items-start pr-2">
        <div class="flex-1 min-w-0 py-0.5">
          <p class="text-base text-white" x-text="formatDate(entry.date)"></p>
          <p
            class="text-xs text-gray-500 mt-0.5 tabular-nums"
            x-show="entrySummary(entry)"
            x-text="entrySummary(entry)"
          ></p>
          <p
            x-show="entry.note"
            class="text-xs text-gray-500 italic mt-0.5 truncate"
            x-text="entry.note"
          ></p>
        </div>
        <button
          type="button"
          @click="removeEntry(entry.id)"
          class="-my-1.5 flex-shrink-0 w-11 h-11 inline-flex items-center justify-center rounded-full text-gray-500 transition active:scale-90 active:text-kinetic-electric hover:text-kinetic-electric"
          aria-label="Supprimer"
        >
          <svg
            class="w-[1.125rem] h-[1.125rem]"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 7h16M10 11v6M14 11v6M5 7l1 12a2 2 0 002 2h8a2 2 0 002-2l1-12M9 7V4a1 1 0 011-1h4a1 1 0 011 1v3"
            />
          </svg>
        </button>
      </li>
    </template>
  </ul>

  <!-- ── Photos de progression ────────────────────────────────────────────── -->
  <h2 class="k-section mb-2.5">Photos</h2>
  <div class="k-list">
    <button
      type="button"
      @click="showPhotos = !showPhotos"
      :aria-expanded="showPhotos"
      aria-controls="mens-photos-panel"
      class="k-row"
    >
      <span class="k-glyph bg-kinetic-purple" aria-hidden="true">
        <svg
          class="w-[1.125rem] h-[1.125rem]"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M3 9a2 2 0 012-2h1.6a2 2 0 001.7-.9l.8-1.2A2 2 0 0110.8 4h2.4a2 2 0 011.7.9l.8 1.2a2 2 0 001.7.9H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"
          />
          <circle cx="12" cy="13" r="3.5" stroke-width="2" />
        </svg>
      </span>
      <span class="flex-1 min-w-0">
        <span class="block text-base text-white">Photos de progression</span>
        <span
          class="block text-xs text-gray-500"
          x-text="photos.length + ' photo' + (photos.length > 1 ? 's' : '')"
        ></span>
      </span>
      <svg
        class="k-chevron transition-transform duration-200"
        :class="showPhotos ? 'rotate-90' : ''"
        viewBox="0 0 8 14"
        fill="none"
        stroke="currentColor"
        aria-hidden="true"
      >
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M1 1l6 6-6 6" />
      </svg>
    </button>

    <div
      id="mens-photos-panel"
      x-show="showPhotos"
      x-transition:enter="transition ease-out duration-200"
      x-transition:enter-start="opacity-0 -translate-y-1"
      x-transition:enter-end="opacity-100 translate-y-0"
      class="k-row-sep relative p-4"
    >
      <!-- Bouton photo -->
      <button type="button" @click="takePhoto()" :disabled="takingPhoto" class="k-btn-2 mb-4">
        <svg
          x-show="!takingPhoto"
          class="w-5 h-5"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 5v14M5 12h14"
          />
        </svg>
        <span x-show="!takingPhoto">Prendre une photo</span>
        <span x-show="takingPhoto">Chargement…</span>
      </button>

      <!-- Galerie -->
      <template x-if="photos.length === 0">
        <p class="text-xs text-gray-500 text-center px-4 pb-2">
          Prends des photos pour suivre visuellement ta progression dans le temps.
        </p>
      </template>

      <div x-show="photos.length > 0" class="grid grid-cols-3 gap-1.5">
        <template x-for="photo in photosDesc.slice(0, 12)" :key="photo.id">
          <button
            type="button"
            @click="selectedPhotoId = selectedPhotoId === photo.id ? null : photo.id"
            :aria-pressed="selectedPhotoId === photo.id"
            class="relative aspect-square rounded-xl overflow-hidden bg-kinetic-elevated transition active:scale-95 group"
            :class="selectedPhotoId !== null && selectedPhotoId !== photo.id ? 'opacity-50' : ''"
          >
            <img
              :src="photo.base64"
              :alt="formatPhotoDate(photo.takenAt)"
              class="w-full h-full object-cover"
            />
            <span
              class="absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/60 to-transparent px-1.5 pb-1 pt-4 text-left text-[11px] font-medium text-white/90 leading-none opacity-0 group-hover:opacity-100 transition-opacity"
              :class="selectedPhotoId === photo.id ? 'opacity-100' : ''"
              x-text="formatPhotoDate(photo.takenAt)"
              aria-hidden="true"
            ></span>
          </button>
        </template>
      </div>

      <!-- Photo sélectionnée en grand -->
      <div
        x-show="selectedPhotoId !== null"
        x-transition
        class="mt-3 rounded-xl overflow-hidden bg-kinetic-elevated"
      >
        <template x-for="photo in selectedPhotos" :key="photo.id">
          <div>
            <img
              :src="photo.base64"
              :alt="formatPhotoDate(photo.takenAt)"
              class="w-full object-contain max-h-72 bg-black"
            />
            <div class="pl-4 pr-2 py-2 flex items-center justify-between gap-3">
              <p class="text-sm text-gray-400" x-text="formatPhotoDate(photo.takenAt)"></p>
              <button
                type="button"
                @click="deletePhoto(photo.id)"
                class="h-11 px-3 rounded-full text-base font-medium text-kinetic-electric transition active:opacity-60"
              >
                Supprimer
              </button>
            </div>
          </div>
        </template>
      </div>

      <p
        x-show="photos.length > 12"
        class="text-xs text-gray-500 text-center mt-3"
        x-text="'+ ' + $plural(photos.length - 12, 'photo plus ancienne', 'photos plus anciennes')"
      ></p>
    </div>
  </div>
</div>
