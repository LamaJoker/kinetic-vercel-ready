<div x-data="mensurations" x-init="init()" class="max-w-md mx-auto px-4 pt-8 pb-8">

  <!-- En-tête -->
  <div class="flex items-center gap-3 mb-6">
    <a href="/"
       class="flex items-center justify-center w-9 h-9 rounded-xl transition-colors flex-shrink-0"
       style="background: var(--k-surface); color: var(--k-tx3);"
       onmouseover="this.style.color='var(--k-tx)'"
       onmouseout="this.style.color='var(--k-tx3)'"
       aria-label="Retour">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/>
      </svg>
    </a>
    <div class="flex-1">
      <h1 class="font-display-v2 font-bold text-k-tx" style="font-size: 20px; letter-spacing: -0.02em;">Mensurations</h1>
      <p style="font-size: 11px; color: var(--k-tx3); margin-top: 1px;">Tour de corps &amp; évolution (cm)</p>
    </div>
    <div class="text-right">
      <p class="font-display-v2 font-bold" style="font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--k-tx3);">Entrées</p>
      <p class="font-display-v2 font-bold" style="font-size: 20px; color: var(--k-tx); line-height: 1;" x-text="entries.length"></p>
    </div>
  </div>

  <!-- Grille de mensurations actuelles -->
  <div class="grid grid-cols-3 gap-2 mb-4">
    <template x-for="m in metrics" :key="m.key">
      <button type="button" @click="activeMetric = m.key"
              class="text-left transition-all"
              style="border-radius: 14px; padding: 12px;"
              :style="activeMetric === m.key
                ? 'background: var(--k-elevated); border: 1px solid rgba(255,255,255,.15);'
                : 'background: var(--k-surface); border: 1px solid var(--k-line);'">
        <p class="font-display-v2 font-bold mb-1 truncate"
           style="font-size: 9px; text-transform: uppercase; letter-spacing: .08em;"
           :style="`color: ${hasData(m.key) ? m.color : 'var(--k-tx3)'}`"
           x-text="m.label"></p>
        <p class="font-display-v2 font-bold" style="font-size: 16px; color: var(--k-tx); line-height: 1;"
           x-text="currentValue(m.key) !== null ? currentValue(m.key) : '—'"></p>
        <p x-show="currentValue(m.key) !== null" class="font-mono" style="font-size: 9px; margin-top: 2px;"
           :style="metricDelta(m.key) > 0 ? 'color: var(--k-e);' : metricDelta(m.key) < 0 ? 'color: var(--k-p);' : 'color: var(--k-tx3);'"
           x-text="metricDelta(m.key) !== null
             ? (metricDelta(m.key) > 0 ? '+' : '') + metricDelta(m.key).toFixed(1)
             : ''"></p>
        <p x-show="currentValue(m.key) === null" style="font-size: 9px; margin-top: 2px; color: var(--k-tx3);">non mesuré</p>
      </button>
    </template>
  </div>

  <!-- Section graphique -->
  <div class="k-card mb-4" style="padding: 16px;">
    <div class="flex items-start justify-between mb-3">
      <div>
        <p class="font-display-v2 font-bold" style="font-size: 14px; color: var(--k-tx);"
           x-text="activeMetricDef.label"></p>
        <p style="font-size: 12px; margin-top: 2px;"
           :style="metricDelta(activeMetric) > 0 ? 'color: var(--k-e);' : metricDelta(activeMetric) < 0 ? 'color: var(--k-p);' : 'color: var(--k-tx3);'"
           x-show="metricDelta(activeMetric) !== null"
           x-text="metricDelta(activeMetric) !== null
             ? (metricDelta(activeMetric) > 0 ? '↑ +' : '↓ ')
               + Math.abs(metricDelta(activeMetric)).toFixed(1) + ' cm sur la période'
             : ''"></p>
      </div>
      <div class="flex gap-1 flex-shrink-0 ml-2">
        <template x-for="p in [{v:30,l:'30j'},{v:90,l:'90j'},{v:365,l:'1an'},{v:9999,l:'Tout'}]" :key="p.v">
          <button type="button" @click="period = p.v"
                  class="font-display-v2 font-bold transition-all"
                  style="font-size: 10px; padding: 4px 8px; border-radius: 8px; border: none; cursor: pointer;"
                  :style="period === p.v
                    ? 'background: var(--k-e); color: white; box-shadow: 0 0 10px rgba(255,122,51,.3);'
                    : 'background: transparent; color: var(--k-tx3);'">
            <span x-text="p.l"></span>
          </button>
        </template>
      </div>
    </div>

    <template x-if="chartPoints().length >= 2">
      <div x-html="chartSvg()" class="w-full"></div>
    </template>
    <template x-if="chartPoints().length < 2">
      <div class="flex flex-col items-center justify-center py-8 text-center">
        <svg class="w-10 h-10 mb-3" style="color: var(--k-line);" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                d="M3 6h18M3 6l2 14h14L21 6M8 6V4a1 1 0 011-1h6a1 1 0 011 1v2M10 11v5M14 11v5"/>
        </svg>
        <p style="font-size: 13px; color: var(--k-tx3);">
          Pas assez de données pour <span style="color: var(--k-tx); font-weight: 600;" x-text="activeMetricDef.label"></span>
        </p>
        <p style="font-size: 12px; color: var(--k-tx3); margin-top: 4px;">Enregistre au moins 2 mesures</p>
      </div>
    </template>

    <template x-if="chartPoints().length >= 2">
      <div class="grid grid-cols-3 gap-2 mt-3 pt-3" style="border-top: 1px solid var(--k-line);">
        <div class="text-center">
          <p class="font-display-v2 font-bold" style="font-size: 9px; text-transform: uppercase; letter-spacing: .08em; color: var(--k-tx3);">Départ</p>
          <p class="font-display-v2 font-bold mt-0.5" style="font-size: 14px; color: var(--k-tx);"
             x-text="chartPoints()[0] ? chartPoints()[0].y.toFixed(1) + ' cm' : '—'"></p>
        </div>
        <div class="text-center">
          <p class="font-display-v2 font-bold" style="font-size: 9px; text-transform: uppercase; letter-spacing: .08em; color: var(--k-tx3);">Actuel</p>
          <p class="font-display-v2 font-bold mt-0.5" style="font-size: 14px;"
             :style="`color: ${activeMetricDef.color}`"
             x-text="currentValue(activeMetric) !== null ? currentValue(activeMetric).toFixed(1) + ' cm' : '—'"></p>
        </div>
        <div class="text-center">
          <p class="font-display-v2 font-bold" style="font-size: 9px; text-transform: uppercase; letter-spacing: .08em; color: var(--k-tx3);">Mesures</p>
          <p class="font-display-v2 font-bold mt-0.5" style="font-size: 14px; color: var(--k-tx);"
             x-text="chartPoints().length"></p>
        </div>
      </div>
    </template>
  </div>

  <!-- Formulaire d'enregistrement -->
  <div class="k-card mb-4" style="padding: 16px;">
    <p class="font-display-v2 font-bold mb-4" style="font-size: 10px; text-transform: uppercase; letter-spacing: .1em; color: var(--k-tx3);">Enregistrer</p>

    <!-- Haut du corps -->
    <p class="font-display-v2 font-bold mb-2 flex items-center gap-1.5" style="font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--k-tx3);">
      <span class="w-1.5 h-1.5 rounded-full inline-block" style="background: #00C2A0;"></span> Haut du corps
    </p>
    <div class="grid grid-cols-2 gap-3 mb-4">
      <div>
        <label class="font-display-v2 font-semibold block mb-1" style="font-size: 11px; color: var(--k-tx3);">Cou (cm)</label>
        <input type="number" x-model.number="fNeck" min="20" max="70" step="0.5"
               placeholder="38" class="k-input w-full" style="padding: 10px 12px; font-size: 14px;"/>
      </div>
      <div>
        <label class="font-display-v2 font-semibold block mb-1" style="font-size: 11px; color: var(--k-tx3);">Épaules (cm)</label>
        <input type="number" x-model.number="fShoulders" min="70" max="170" step="0.5"
               placeholder="115" class="k-input w-full" style="padding: 10px 12px; font-size: 14px;"/>
      </div>
      <div class="col-span-2">
        <label class="font-display-v2 font-semibold block mb-1" style="font-size: 11px; color: var(--k-tx3);">Poitrine (cm)</label>
        <input type="number" x-model.number="fChest" min="50" max="160" step="0.5"
               placeholder="92" class="k-input w-full" style="padding: 10px 12px; font-size: 14px;"/>
      </div>
    </div>

    <!-- Bras -->
    <p class="font-display-v2 font-bold mb-2 flex items-center gap-1.5" style="font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--k-tx3);">
      <span class="w-1.5 h-1.5 rounded-full inline-block" style="background: #FFD166;"></span> Bras
    </p>
    <div class="grid grid-cols-2 gap-3 mb-4">
      <div>
        <label class="font-display-v2 font-semibold block mb-1" style="font-size: 11px; color: var(--k-tx3);">Bras gauche (cm)</label>
        <input type="number" x-model.number="fLeftBicep" min="15" max="65" step="0.5"
               placeholder="36" class="k-input w-full" style="padding: 10px 12px; font-size: 14px;"/>
      </div>
      <div>
        <label class="font-display-v2 font-semibold block mb-1" style="font-size: 11px; color: var(--k-tx3);">Bras droit (cm)</label>
        <input type="number" x-model.number="fRightBicep" min="15" max="65" step="0.5"
               placeholder="36" class="k-input w-full" style="padding: 10px 12px; font-size: 14px;"/>
      </div>
    </div>

    <!-- Milieu -->
    <p class="font-display-v2 font-bold mb-2 flex items-center gap-1.5" style="font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--k-tx3);">
      <span class="w-1.5 h-1.5 rounded-full inline-block" style="background: var(--k-e);"></span> Milieu
    </p>
    <div class="grid grid-cols-2 gap-3 mb-4">
      <div>
        <label class="font-display-v2 font-semibold block mb-1" style="font-size: 11px; color: var(--k-tx3);">Taille (cm)</label>
        <input type="number" x-model.number="fWaist" min="40" max="160" step="0.5"
               placeholder="80" class="k-input w-full" style="padding: 10px 12px; font-size: 14px;"/>
      </div>
      <div>
        <label class="font-display-v2 font-semibold block mb-1" style="font-size: 11px; color: var(--k-tx3);">Hanches (cm)</label>
        <input type="number" x-model.number="fHips" min="50" max="170" step="0.5"
               placeholder="96" class="k-input w-full" style="padding: 10px 12px; font-size: 14px;"/>
      </div>
    </div>

    <!-- Jambes -->
    <p class="font-display-v2 font-bold mb-2 flex items-center gap-1.5" style="font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--k-tx3);">
      <span class="w-1.5 h-1.5 rounded-full inline-block" style="background: #FF6B6B;"></span> Jambes
    </p>
    <div class="grid grid-cols-2 gap-3 mb-4">
      <div>
        <label class="font-display-v2 font-semibold block mb-1" style="font-size: 11px; color: var(--k-tx3);">Cuisse gauche (cm)</label>
        <input type="number" x-model.number="fLeftThigh" min="25" max="100" step="0.5"
               placeholder="58" class="k-input w-full" style="padding: 10px 12px; font-size: 14px;"/>
      </div>
      <div>
        <label class="font-display-v2 font-semibold block mb-1" style="font-size: 11px; color: var(--k-tx3);">Cuisse droite (cm)</label>
        <input type="number" x-model.number="fRightThigh" min="25" max="100" step="0.5"
               placeholder="58" class="k-input w-full" style="padding: 10px 12px; font-size: 14px;"/>
      </div>
      <div>
        <label class="font-display-v2 font-semibold block mb-1" style="font-size: 11px; color: var(--k-tx3);">Mollet gauche (cm)</label>
        <input type="number" x-model.number="fLeftCalf" min="15" max="65" step="0.5"
               placeholder="34" class="k-input w-full" style="padding: 10px 12px; font-size: 14px;"/>
      </div>
      <div>
        <label class="font-display-v2 font-semibold block mb-1" style="font-size: 11px; color: var(--k-tx3);">Mollet droit (cm)</label>
        <input type="number" x-model.number="fRightCalf" min="15" max="65" step="0.5"
               placeholder="34" class="k-input w-full" style="padding: 10px 12px; font-size: 14px;"/>
      </div>
    </div>

    <input x-model="fNote"
           placeholder="Note (optionnel — ex: matin à jeun)"
           class="k-input w-full mb-4" style="padding: 11px 13px; font-size: 14px;"/>

    <button type="button" @click="addEntry()"
            :disabled="!hasFormData"
            class="btn-p w-full disabled:opacity-40 disabled:cursor-not-allowed"
            style="padding: 14px; font-size: 15px;">
      Enregistrer les mensurations
    </button>
  </div>

  <!-- Historique -->
  <div class="k-card overflow-hidden mb-4" style="padding: 0;">
    <div class="flex items-center justify-between" style="padding: 16px; border-bottom: 1px solid var(--k-line);">
      <p class="font-display-v2 font-bold" style="font-size: 14px; color: var(--k-tx);">Historique</p>
      <span class="font-display-v2 font-semibold" style="font-size: 11px; color: var(--k-tx3);"
            x-text="entries.length + ' entrée' + (entries.length > 1 ? 's' : '')"></span>
    </div>

    <template x-if="entries.length === 0">
      <div style="padding: 40px; text-align: center;">
        <svg class="w-12 h-12 mx-auto mb-3" style="color: var(--k-line);" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                d="M3 6h18M3 6l2 14h14L21 6M8 6V4a1 1 0 011-1h6a1 1 0 011 1v2M10 11v5M14 11v5"/>
        </svg>
        <p class="font-display-v2 font-semibold" style="font-size: 13px; color: var(--k-tx3);">Aucune mensuration</p>
        <p style="font-size: 12px; color: var(--k-tx3); margin-top: 4px;">Commence à te suivre pour voir tes progrès</p>
      </div>
    </template>

    <ul x-show="entries.length > 0" style="list-style: none; padding: 0; margin: 0;">
      <template x-for="entry in entries.slice().reverse().slice(0, 30)" :key="entry.id">
        <li style="padding: 12px 16px; border-bottom: 1px solid var(--k-line);">
          <div class="flex items-center justify-between mb-1">
            <p class="font-display-v2 font-semibold" style="font-size: 13px; color: var(--k-tx);" x-text="formatDate(entry.date)"></p>
            <button type="button" @click="removeEntry(entry.id)"
                    style="padding: 6px; color: var(--k-tx3); background: none; border: none; cursor: pointer; border-radius: 8px;"
                    aria-label="Supprimer">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
              </svg>
            </button>
          </div>
          <p style="font-size: 11px; color: var(--k-tx3); line-height: 1.5;" x-text="entrySummary(entry)"></p>
          <p x-show="entry.note" style="font-size: 11px; color: var(--k-tx3); font-style: italic; margin-top: 2px;" x-text="entry.note"></p>
        </li>
      </template>
    </ul>
  </div>

  <!-- Photos de progression -->
  <div class="k-card overflow-hidden" style="padding: 0;">
    <button type="button" @click="showPhotos = !showPhotos"
            class="w-full flex items-center justify-between transition-colors"
            style="padding: 16px; background: none; border: none; cursor: pointer;"
            onmouseover="this.style.background='rgba(255,255,255,.03)'"
            onmouseout="this.style.background='transparent'">
      <div class="flex items-center gap-3">
        <div class="flex items-center justify-center" style="width: 34px; height: 34px; border-radius: 10px; background: oklch(82% 0.28 145 / 0.1); font-size: 16px;">📸</div>
        <div class="text-left">
          <p class="font-display-v2 font-bold" style="font-size: 14px; color: var(--k-tx);">Photos de progression</p>
          <p style="font-size: 11px; color: var(--k-tx3); margin-top: 1px;" x-text="photos.length + ' photo' + (photos.length > 1 ? 's' : '')"></p>
        </div>
      </div>
      <span style="color: var(--k-tx3); font-size: 13px; transition: transform .2s;"
            :style="showPhotos ? 'transform: rotate(180deg)' : ''">▾</span>
    </button>

    <div x-show="showPhotos"
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0 -translate-y-2"
         x-transition:enter-end="opacity-100 translate-y-0"
         style="border-top: 1px solid var(--k-line); padding: 16px;">

      <button type="button" @click="takePhoto()"
              :disabled="takingPhoto"
              class="w-full flex items-center justify-center gap-2 font-display-v2 font-semibold transition-all disabled:opacity-50 disabled:cursor-not-allowed mb-4"
              style="padding: 12px; border-radius: 14px; font-size: 13px; background: oklch(82% 0.28 145 / 0.1); border: 1px solid oklch(82% 0.28 145 / 0.25); color: var(--k-p); cursor: pointer;">
        <span x-show="!takingPhoto">📷 Prendre une photo</span>
        <span x-show="takingPhoto">⏳ Chargement…</span>
      </button>

      <template x-if="photos.length === 0">
        <p class="text-center py-4" style="font-size: 13px; color: var(--k-tx3);">
          Prends des photos pour suivre visuellement ta progression dans le temps.
        </p>
      </template>

      <div x-show="photos.length > 0" class="grid grid-cols-3 gap-2">
        <template x-for="photo in photosDesc.slice(0, 12)" :key="photo.id">
          <button type="button" @click="selectedPhotoId = selectedPhotoId === photo.id ? null : photo.id"
                  class="relative aspect-square overflow-hidden transition-all group"
                  style="border-radius: 12px; border: 1px solid var(--k-line);">
            <img :src="photo.base64" :alt="formatPhotoDate(photo.takenAt)"
                 class="w-full h-full object-cover"/>
            <div class="absolute inset-0 bg-black/0 group-hover:bg-black/30 transition-colors flex items-end">
              <p class="text-white/70 p-1.5 opacity-0 group-hover:opacity-100 transition-opacity"
                 style="font-size: 9px; line-height: 1;"
                 x-text="formatPhotoDate(photo.takenAt)"></p>
            </div>
          </button>
        </template>
      </div>

      <div x-show="selectedPhotoId !== null" x-transition
           class="mt-3 overflow-hidden" style="border-radius: 16px; border: 1px solid var(--k-line);">
        <template x-for="photo in photos.filter(p => p.id === selectedPhotoId)" :key="photo.id">
          <div>
            <img :src="photo.base64" :alt="formatPhotoDate(photo.takenAt)"
                 class="w-full object-contain max-h-72 bg-black"/>
            <div class="flex items-center justify-between" style="padding: 12px;">
              <p style="font-size: 12px; color: var(--k-tx3);" x-text="formatPhotoDate(photo.takenAt)"></p>
              <button type="button" @click="deletePhoto(photo.id)"
                      class="font-display-v2 font-semibold transition-colors"
                      style="font-size: 12px; padding: 6px 12px; border-radius: 9px; background: rgba(255,122,51,.1); border: 1px solid rgba(255,122,51,.25); color: var(--k-e); cursor: pointer;">
                🗑 Supprimer
              </button>
            </div>
          </div>
        </template>
      </div>

      <p x-show="photos.length > 12" class="text-center mt-2" style="font-size: 11px; color: var(--k-tx3);"
         x-text="`+${photos.length - 12} plus ancien(s)`"></p>
    </div>
  </div>

</div>
