<div x-data="onboarding" x-init="init()" class="max-w-md mx-auto px-4 pt-8 pb-10">
  <div class="flex items-start justify-between mb-6">
    <div>
      <h1 class="text-xl font-bold text-white">Demarrage</h1>
      <p class="text-sm text-gray-500">Objectif, profil, calories</p>
    </div>
    <a href="/" class="text-xs text-gray-400 hover:text-white underline">Plus tard</a>
  </div>

  <div class="bg-gray-800 rounded-2xl p-4 mb-4">
    <p class="text-xs text-gray-500 mb-2">Objectif</p>
    <div class="grid grid-cols-2 gap-2">
      <button @click="goal = 'lose_fat'"
              class="rounded-xl p-3 text-left border transition-colors"
              :class="goal === 'lose_fat' ? 'border-kinetic-coral bg-gray-900/60' : 'border-gray-700 bg-gray-900/30 hover:bg-gray-900/50'">
        <p class="text-white font-semibold text-sm">Perte de poids</p>
        <p class="text-xs text-gray-500 mt-0.5">Deficit controle</p>
      </button>
      <button @click="goal = 'gain_muscle'"
              class="rounded-xl p-3 text-left border transition-colors"
              :class="goal === 'gain_muscle' ? 'border-kinetic-gold bg-gray-900/60' : 'border-gray-700 bg-gray-900/30 hover:bg-gray-900/50'">
        <p class="text-white font-semibold text-sm">Prise de masse</p>
        <p class="text-xs text-gray-500 mt-0.5">Surplus modere</p>
      </button>
      <button @click="goal = 'recomp'"
              class="rounded-xl p-3 text-left border transition-colors"
              :class="goal === 'recomp' ? 'border-kinetic-teal bg-gray-900/60' : 'border-gray-700 bg-gray-900/30 hover:bg-gray-900/50'">
        <p class="text-white font-semibold text-sm">Recomposition</p>
        <p class="text-xs text-gray-500 mt-0.5">Petit deficit</p>
      </button>
      <button @click="goal = 'performance'"
              class="rounded-xl p-3 text-left border transition-colors"
              :class="goal === 'performance' ? 'border-kinetic-purple bg-gray-900/60' : 'border-gray-700 bg-gray-900/30 hover:bg-gray-900/50'">
        <p class="text-white font-semibold text-sm">Performance</p>
        <p class="text-xs text-gray-500 mt-0.5">Stabilite</p>
      </button>
    </div>
  </div>

  <div class="bg-gray-800 rounded-2xl p-4 mb-4">
    <p class="text-xs text-gray-500 mb-2">Profil</p>

    <div class="grid grid-cols-2 gap-2 mb-2">
      <button @click="sex = 'male'"
              class="rounded-xl px-3 py-2 border text-sm font-semibold transition-colors"
              :class="sex === 'male' ? 'border-gray-400 bg-gray-900/60 text-white' : 'border-gray-700 bg-gray-900/30 text-gray-300 hover:bg-gray-900/50'">
        Homme
      </button>
      <button @click="sex = 'female'"
              class="rounded-xl px-3 py-2 border text-sm font-semibold transition-colors"
              :class="sex === 'female' ? 'border-gray-400 bg-gray-900/60 text-white' : 'border-gray-700 bg-gray-900/30 text-gray-300 hover:bg-gray-900/50'">
        Femme
      </button>
    </div>

    <div class="grid grid-cols-3 gap-2">
      <div>
        <label class="text-xs text-gray-500">Age</label>
        <input x-model.number="ageYears" type="number" min="12" max="90"
               class="w-full bg-gray-950 border border-gray-700 rounded-xl px-3 py-2 text-sm"/>
      </div>
      <div>
        <label class="text-xs text-gray-500">Taille</label>
        <input x-model.number="heightCm" type="number" min="120" max="230"
               class="w-full bg-gray-950 border border-gray-700 rounded-xl px-3 py-2 text-sm"/>
      </div>
      <div>
        <label class="text-xs text-gray-500">Poids</label>
        <input x-model.number="weightKg" type="number" min="30" max="250" step="0.1"
               class="w-full bg-gray-950 border border-gray-700 rounded-xl px-3 py-2 text-sm"/>
      </div>
    </div>
  </div>

  <div class="bg-gray-800 rounded-2xl p-4 mb-4">
    <p class="text-xs text-gray-500 mb-2">Activite</p>
    <select x-model="activity"
            class="w-full bg-gray-950 border border-gray-700 rounded-xl px-3 py-2 text-sm">
      <option value="sedentary">Sedentaire</option>
      <option value="light">Leger (1-2x/sem)</option>
      <option value="moderate">Modere (3-4x/sem)</option>
      <option value="active">Actif (5x/sem)</option>
      <option value="very_active">Tres actif (sport + job physique)</option>
    </select>
  </div>

  <div class="bg-gray-800 rounded-2xl p-4 mb-6">
    <div class="flex items-center justify-between">
      <div>
        <p class="text-xs text-gray-500">Calories cible (estimation)</p>
        <p class="text-3xl font-black text-white" x-text="targetCalories ? targetCalories + ' kcal' : '--'"></p>
      </div>
      <div class="text-right">
        <p class="text-xs text-gray-500">TDEE</p>
        <p class="text-lg font-bold text-gray-200" x-text="tdee ? tdee + ' kcal' : '--'"></p>
      </div>
    </div>
    <p class="text-xs text-gray-500 mt-2">
      Ajustable plus tard. L'app utilisera aussi cette info pour estimer les calories des seances.
    </p>
  </div>

  <button @click="save()"
          :disabled="saving"
          class="w-full py-3 rounded-2xl bg-kinetic-purple text-white font-bold
                 disabled:opacity-40 disabled:cursor-not-allowed">
    <span x-show="!saving">Continuer</span>
    <span x-show="saving">Sauvegarde...</span>
  </button>
</div>
