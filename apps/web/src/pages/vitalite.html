<div class="max-w-md mx-auto px-4 pt-8 pb-8">
  <!-- Header -->
  <div class="k-nav">
    <h1 class="font-display font-bold text-white">Récupération</h1>
    <span class="ml-auto text-xs text-gray-500" x-text="$today"> </span>
    <button
      type="button"
      @click="$store.vitalite.editing = !$store.vitalite.editing"
      :aria-pressed="$store.vitalite.editing ? 'true' : 'false'"
      class="k-link ml-3 min-h-[44px]"
      x-text="$store.vitalite.editing ? 'OK' : 'Modifier'"
    ></button>
  </div>

  <!-- Progression globale -->
  <div class="rounded-2xl p-4 mb-4 bg-kinetic-surface">
    <div class="relative flex items-center justify-between mb-2">
      <span class="text-base font-semibold text-white">Aujourd'hui</span>
      <div class="flex items-center gap-2">
        <!-- Indicateur bonus XP (niveau 5+) -->
        <template x-if="$store.rewards.hasXpBonus">
          <span class="text-xs font-semibold text-kinetic-neon"> +20% XP </span>
        </template>
        <span
          class="font-display font-bold text-white text-2xl leading-none"
          x-text="$store.vitalite.progress + '%'"
        ></span>
      </div>
    </div>
    <div class="relative h-1.5 bg-kinetic-ink rounded-full overflow-hidden">
      <div
        class="h-full bg-kinetic-neon rounded-full transition-all duration-500 ease-out"
        :style="'width: ' + $store.vitalite.progress + '%'"
      ></div>
    </div>
    <p
      class="relative text-xs text-gray-500 mt-2"
      x-text="$store.vitalite.doneCount + ' sur ' + $store.vitalite.totalCount + ' tâches complétées'"
    ></p>
  </div>

  <!-- Actions rapides -->
  <div class="flex gap-2 mb-6">
    <button
      @click="$store.vitalite.showAddForm = !$store.vitalite.showAddForm"
      aria-label="Ajouter une tâche personnalisée"
      class="flex-1 flex items-center justify-center gap-1.5 h-11 rounded-xl bg-kinetic-surface text-base font-semibold text-kinetic-neon active:bg-kinetic-elevated transition-colors"
    >
      <svg
        class="w-4 h-4"
        fill="none"
        stroke="currentColor"
        stroke-width="2.4"
        stroke-linecap="round"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <path d="M12 5v14M5 12h14" />
      </svg>
      <span>Ajouter</span>
    </button>
    <button
      x-show="$store.vitalite.hiddenIds.length > 0"
      @click="$store.vitalite.showHidden = !$store.vitalite.showHidden"
      :aria-label="'Voir les ' + $store.vitalite.hiddenIds.length + ' tâches masquées'"
      class="flex items-center gap-1.5 h-11 px-4 rounded-xl bg-kinetic-surface text-base text-white tabular-nums active:bg-kinetic-elevated transition-colors"
    >
      <svg
        class="w-[18px] h-[18px] text-gray-500"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <path
          d="M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8M9.9 5.1A9.8 9.8 0 0 1 12 5c5 0 9 4.5 10 7a13 13 0 0 1-3.2 4.3M6.6 6.6C4.3 8 2.7 10 2 12c1 2.5 5 7 10 7 1.6 0 3.1-.4 4.4-1.1"
        />
      </svg>
      <span x-text="$store.vitalite.hiddenIds.length"></span>
    </button>
    <button
      @click="$store.vitalite.toggleHistory()"
      aria-label="Voir l'historique des 7 derniers jours"
      class="flex items-center gap-2 h-11 px-4 rounded-xl bg-kinetic-surface text-base text-white active:bg-kinetic-elevated transition-colors"
    >
      <span>Historique</span>
    </button>
  </div>

  <!-- ── Tâches masquées ────────────────────────────────────────────────────── -->
  <section
    x-show="$store.vitalite.showHidden && $store.vitalite.hiddenIds.length > 0"
    x-transition.opacity
    class="mb-6"
    aria-labelledby="vit-hidden-title"
  >
    <div class="flex items-center justify-between gap-3 mb-2">
      <h2 id="vit-hidden-title" class="k-section">Tâches masquées</h2>
      <button
        @click="$store.vitalite.showHidden = false"
        class="k-link min-h-[44px]"
        aria-label="Fermer le panel des tâches masquées"
      >
        Fermer
      </button>
    </div>
    <div class="k-list">
      <template x-for="spec in $store.vitalite.hiddenSpecsList" :key="spec.id">
        <div class="k-row">
          <span
            class="w-7 flex-shrink-0 text-center text-xl leading-none"
            aria-hidden="true"
            x-text="spec.icon"
          ></span>
          <div class="flex-1 min-w-0">
            <p class="text-base text-white truncate" x-text="spec.title"></p>
            <p class="text-xs text-gray-500 tabular-nums">+<span x-text="spec.xp"></span> XP</p>
          </div>
          <button @click="$store.vitalite.unhideTask(spec.id)" class="k-pill">Restaurer</button>
        </div>
      </template>
    </div>
    <p class="k-caption mt-2">Une tâche restaurée revient dans ta liste du jour.</p>
  </section>

  <!-- ── Nouvelle tâche personnalisée (feuille) ─────────────────────────────── -->
  <div
    x-show="$store.vitalite.showAddForm"
    class="k-backdrop fixed"
    @click.self="$store.vitalite.showAddForm = false; $store.vitalite.addFormError = ''"
    @keydown.escape.window="$store.vitalite.showAddForm = false; $store.vitalite.addFormError = ''"
    style="display: none"
  >
    <div class="k-sheet" role="dialog" aria-modal="true" aria-labelledby="vit-add-title">
      <div class="flex items-center justify-between gap-3 mb-5">
        <h2 id="vit-add-title" class="text-lg font-semibold text-white">Nouvelle tâche</h2>
        <button
          type="button"
          @click="$store.vitalite.showAddForm = false; $store.vitalite.addFormError = ''"
          class="k-icon-btn"
          aria-label="Fermer"
        >
          <svg
            class="w-4 h-4"
            fill="none"
            stroke="currentColor"
            stroke-width="2.4"
            stroke-linecap="round"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path d="M6 6l12 12M18 6 6 18" />
          </svg>
        </button>
      </div>

      <!-- Aperçu -->
      <div class="flex items-center gap-3.5 mb-6" aria-hidden="true">
        <span
          class="w-14 h-14 flex-shrink-0 rounded-2xl bg-kinetic-ink flex items-center justify-center text-3xl leading-none"
          x-text="$store.vitalite.newTaskIcon || ''"
        ></span>
        <div class="min-w-0">
          <p
            class="text-base font-semibold truncate"
            :class="$store.vitalite.newTaskTitle ? 'text-white' : 'text-gray-500'"
            x-text="$store.vitalite.newTaskTitle || 'Titre de la tâche'"
          ></p>
          <p class="text-xs text-gray-500 tabular-nums">
            +<span x-text="$store.vitalite.newTaskXp"></span> XP
          </p>
        </div>
      </div>

      <!-- Icône -->
      <div class="mb-5">
        <p class="k-label">Icône</p>
        <div class="grid grid-cols-5 gap-2">
          <template x-for="e in $store.vitalite.emojiSuggestions" :key="e">
            <button
              type="button"
              @click="$store.vitalite.newTaskIcon = e"
              class="h-11 rounded-xl text-xl flex items-center justify-center transition active:scale-90"
              :class="$store.vitalite.newTaskIcon === e ? 'k-on' : 'k-off'"
              :aria-pressed="$store.vitalite.newTaskIcon === e ? 'true' : 'false'"
              x-text="e"
            ></button>
          </template>
        </div>
        <div class="flex items-center justify-between gap-3 mt-3">
          <label for="vit-new-icon" class="text-sm text-gray-400">Ou tape un emoji</label>
          <input
            id="vit-new-icon"
            type="text"
            x-model="$store.vitalite.newTaskIcon"
            maxlength="4"
            class="k-field w-16 text-center text-lg"
          />
        </div>
      </div>

      <!-- Titre -->
      <div class="mb-4">
        <label for="vit-new-title" class="k-label"
          >Titre <span class="text-kinetic-electric" aria-hidden="true">*</span></label
        >
        <input
          id="vit-new-title"
          type="text"
          x-model="$store.vitalite.newTaskTitle"
          placeholder="Ex : faire 10 pompes"
          maxlength="60"
          autocomplete="off"
          class="k-field"
        />
        <p
          x-show="$store.vitalite.addFormError"
          class="text-xs text-kinetic-electric mt-1.5"
          role="alert"
          x-text="$store.vitalite.addFormError"
        ></p>
      </div>

      <!-- XP + Priorité -->
      <div class="grid grid-cols-2 gap-3 mb-6">
        <div>
          <label for="f-vitalite-1" class="k-label">XP (10–200)</label>
          <input
            id="f-vitalite-1"
            type="number"
            inputmode="numeric"
            min="10"
            max="200"
            step="10"
            x-model.number="$store.vitalite.newTaskXp"
            class="k-field tabular-nums"
          />
        </div>
        <div>
          <label for="f-vitalite-2" class="k-label">Priorité</label>
          <div class="relative">
            <select
              id="f-vitalite-2"
              x-model="$store.vitalite.newTaskPriority"
              class="k-field appearance-none pr-9"
            >
              <option value="high">Haute</option>
              <option value="med">Moyenne</option>
              <option value="low">Faible</option>
            </select>
            <svg
              class="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-gray-500"
              fill="none"
              stroke="currentColor"
              stroke-width="2.4"
              stroke-linecap="round"
              stroke-linejoin="round"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path d="m6 9 6 6 6-6" />
            </svg>
          </div>
        </div>
      </div>

      <button type="button" @click="$store.vitalite.addCustomTask()" class="k-btn">Ajouter</button>
      <button
        type="button"
        @click="$store.vitalite.showAddForm = false; $store.vitalite.addFormError = ''"
        class="mt-1 w-full h-11 text-base font-medium text-gray-400 active:opacity-60"
      >
        Annuler
      </button>
    </div>
  </div>

  <!-- ── Historique ─────────────────────────────────────────────────────────── -->
  <section
    x-show="$store.vitalite.showHistory"
    x-transition.opacity
    class="mb-6"
    aria-labelledby="vit-history-title"
  >
    <div class="flex items-center justify-between gap-3 mb-2">
      <h2 id="vit-history-title" class="k-section">7 derniers jours</h2>
      <button @click="$store.vitalite.showHistory = false" class="k-link min-h-[44px]">
        Fermer
      </button>
    </div>

    <div x-show="$store.vitalite.historyLoading" class="k-list p-4 space-y-3" aria-busy="true">
      <span class="sr-only">Chargement…</span>
      <div class="k-skeleton h-4 w-2/3" aria-hidden="true"></div>
      <div class="k-skeleton h-4 w-1/2" aria-hidden="true"></div>
      <div class="k-skeleton h-4 w-3/5" aria-hidden="true"></div>
    </div>

    <div x-show="!$store.vitalite.historyLoading" class="k-list">
      <template x-for="day in $store.vitalite.historyDays" :key="day.date">
        <div class="k-item">
          <!-- Ligne résumé (cliquable pour détail) -->
          <button
            @click="$store.vitalite.detailDay = ($store.vitalite.detailDay && $store.vitalite.detailDay.date === day.date ? null : day)"
            class="k-row"
            :aria-expanded="$store.vitalite.detailDay && $store.vitalite.detailDay.date === day.date ? 'true' : 'false'"
          >
            <div class="flex-1 min-w-0">
              <p class="text-base text-white capitalize truncate" x-text="day.label"></p>
              <p class="text-xs text-gray-500">
                <span
                  x-text="$plural(day.doneIds.length, 'tâche complétée', 'tâches complétées')"
                ></span>
              </p>
            </div>
            <!-- Mini barre de progression -->
            <div class="w-14 h-1.5 bg-kinetic-ink rounded-full overflow-hidden" aria-hidden="true">
              <div
                class="h-full bg-kinetic-neon rounded-full transition-all"
                :style="'width: ' + $num.min(100, $num.round(day.doneIds.length / $num.max(1, $store.vitalite.totalCount) * 100)) + '%'"
              ></div>
            </div>
            <span
              class="w-10 text-right text-sm font-semibold tabular-nums text-white"
              x-text="$num.min(100, $num.round(day.doneIds.length / $num.max(1,$store.vitalite.totalCount) * 100)) + '%'"
            ></span>
            <svg
              class="k-chevron transition-transform duration-200"
              :class="$store.vitalite.detailDay && $store.vitalite.detailDay.date === day.date ? 'rotate-90' : ''"
              viewBox="0 0 8 14"
              fill="none"
              aria-hidden="true"
            >
              <path
                d="m1 1 6 6-6 6"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>

          <!-- Détail du jour -->
          <div
            x-show="$store.vitalite.detailDay && $store.vitalite.detailDay.date === day.date"
            x-transition:enter="transition ease-out duration-200"
            x-transition:enter-start="opacity-0 -translate-y-1"
            x-transition:enter-end="opacity-100 translate-y-0"
            class="pb-2"
          >
            <template x-if="day.tasks.length === 0">
              <p class="text-xs text-gray-500 px-4 pb-2">Aucune tâche ce jour-là.</p>
            </template>
            <template x-for="t in day.tasks" :key="t.id">
              <div class="flex items-center gap-3 pl-4 pr-4 py-1.5">
                <span
                  class="w-6 flex-shrink-0 text-center text-base leading-none"
                  aria-hidden="true"
                  x-text="t.icon"
                ></span>
                <span class="flex-1 min-w-0 text-sm text-gray-400 truncate" x-text="t.title"></span>
                <svg
                  class="w-4 h-4 flex-shrink-0 text-kinetic-neon"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.4"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  viewBox="0 0 24 24"
                  aria-label="Complétée"
                  role="img"
                >
                  <path d="m5 12.5 4.5 4.5L19 7.5" />
                </svg>
              </div>
            </template>
          </div>
        </div>
      </template>
    </div>
  </section>

  <!-- ── Liste des tâches ───────────────────────────────────────────────────── -->
  <div class="k-list" x-data>
    <template x-for="task in $store.vitalite.tasks" :key="task.id">
      <div
        class="relative flex items-stretch [&+&]:before:absolute [&+&]:before:top-0 [&+&]:before:right-0 [&+&]:before:left-[3.25rem] [&+&]:before:h-[0.5px] [&+&]:before:bg-[var(--separator)] [&+&]:before:content-['']"
      >
        <!-- Carte principale -->
        <button
          @click="!task.done && $store.vitalite.complete(task.id)"
          :disabled="task.done || $store.vitalite.isLocked(task.id)"
          class="flex-1 min-w-0 flex items-center gap-3 pl-4 pr-1 py-3 text-left transition-colors active:bg-kinetic-elevated disabled:cursor-not-allowed"
        >
          <!-- Icône / Checkmark -->
          <div
            class="w-6 h-6 rounded-full flex items-center justify-center flex-shrink-0 transition-colors duration-300"
            :class="task.done ? 'bg-kinetic-neon' : 'ring-2 ring-inset ring-gray-700'"
          >
            <span
              x-show="task.done"
              x-transition:enter="transition duration-300"
              x-transition:enter-start="scale-0 opacity-0"
              x-transition:enter-end="scale-100 opacity-100"
              class="text-gray-950 font-bold text-xs leading-none"
              >✓</span
            >
          </div>

          <!-- Contenu -->
          <div class="flex-1 min-w-0">
            <p
              class="text-base transition-colors"
              :class="task.done ? 'text-gray-500' : 'text-white'"
            >
              <span
                x-show="task.priority === 'high' && !task.done"
                class="font-semibold text-white"
                aria-hidden="true"
                >! </span
              ><span x-text="task.title"></span>
            </p>
            <p
              class="text-xs mt-0.5 text-gray-500"
              x-text="task.done ? 'Terminé' : '+' + task.xp + ' XP · Priorité ' + { high: 'haute', med: 'moyenne', low: 'faible' }[task.priority]"
            ></p>
          </div>

          <!-- Spinner -->
          <div
            x-show="$store.vitalite.completingId === task.id"
            class="w-5 h-5 border-2 border-kinetic-electric border-t-transparent rounded-full animate-spin flex-shrink-0"
          ></div>
        </button>

        <!-- Actions secondaires : icônes discrètes, cibles tactiles de 44 px -->
        <div class="flex items-center flex-shrink-0 pr-1.5">
          <button
            x-show="task.done && !$store.vitalite.isLocked(task.id)"
            @click.stop="$store.vitalite.undo(task.id)"
            title="Annuler"
            aria-label="Annuler la complétion de cette tâche"
            class="w-11 h-11 rounded-full flex items-center justify-center text-gray-500 transition active:scale-90 active:bg-kinetic-elevated active:text-white"
          >
            <svg
              class="w-[18px] h-[18px]"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path d="M9 14 4 9l5-5M4 9h10.5a5.5 5.5 0 0 1 0 11H11" />
            </svg>
          </button>
          <button
            x-show="$store.vitalite.editing && $store.vitalite.isCustom(task.id)"
            @click.stop="$store.vitalite.deleteCustomTask(task.id)"
            title="Supprimer"
            aria-label="Supprimer cette tâche personnalisée"
            class="w-11 h-11 rounded-full flex items-center justify-center text-gray-500 transition active:scale-90 active:bg-kinetic-elevated active:text-kinetic-electric"
          >
            <svg
              class="w-[18px] h-[18px]"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path d="M4 7h16M10 11v6M14 11v6M9 7V4.5h6V7M6 7l1 13h10l1-13" />
            </svg>
          </button>
          <button
            x-show="$store.vitalite.editing && !$store.vitalite.isCustom(task.id) && !$store.vitalite.isLocked(task.id) && !task.done"
            @click.stop="$store.vitalite.hideTask(task.id)"
            title="Masquer"
            aria-label="Masquer cette tâche (réversible)"
            class="w-11 h-11 rounded-full flex items-center justify-center text-gray-500 transition active:scale-90 active:bg-kinetic-elevated active:text-white"
          >
            <svg
              class="w-[18px] h-[18px]"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path
                d="M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8M9.9 5.1A9.8 9.8 0 0 1 12 5c5 0 9 4.5 10 7a13 13 0 0 1-3.2 4.3M6.6 6.6C4.3 8 2.7 10 2 12c1 2.5 5 7 10 7 1.6 0 3.1-.4 4.4-1.1"
              />
            </svg>
          </button>
        </div>
      </div>
    </template>
  </div>

  <!-- Message victoire -->
  <div
    x-show="$store.vitalite.allDone"
    x-transition:enter="transition ease-out duration-500"
    x-transition:enter-start="opacity-0 translate-y-4"
    x-transition:enter-end="opacity-100 translate-y-0"
    class="mt-6 k-card px-6 py-7 text-center"
  >
    <div
      class="k-pop mx-auto w-14 h-14 rounded-full bg-kinetic-neon text-gray-950 flex items-center justify-center"
      aria-hidden="true"
    >
      <svg
        class="w-7 h-7"
        fill="none"
        stroke="currentColor"
        stroke-width="2.6"
        stroke-linecap="round"
        stroke-linejoin="round"
        viewBox="0 0 24 24"
      >
        <path d="m5 12.5 4.5 4.5L19 7.5" />
      </svg>
    </div>
    <p class="mt-4 font-display font-bold text-xl text-white">Routine complète !</p>
    <p class="text-sm text-gray-500 mt-1">Incroyable. Continue comme ça demain.</p>
    <a href="/" class="k-btn-2 mt-5"> Retour au dashboard </a>
  </div>
</div>
