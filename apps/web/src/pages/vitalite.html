<div class="max-w-md mx-auto px-4 pt-8 pb-8">
  <!-- Header -->
  <div class="k-nav">
    <h1 class="text-2xl font-display font-black tracking-tight text-white">Récupération</h1>
    <span class="ml-auto text-xs text-gray-500" x-text="$today"> </span>
  </div>

  <!-- Progression globale -->
  <div class="rounded-2xl p-4 mb-4 bg-kinetic-surface">
    <div class="relative flex items-center justify-between mb-2">
      <span class="text-base font-semibold text-white">Aujourd'hui</span>
      <div class="flex items-center gap-2">
        <!-- Indicateur bonus XP (niveau 5+) -->
        <template x-if="$store.rewards.hasXpBonus">
          <span class="text-xs font-semibold text-kinetic-neon"> +20% XP </span>
        </template>
        <span
          class="font-display font-bold text-white text-2xl leading-none"
          x-text="$store.vitalite.progress + '%'"
        ></span>
      </div>
    </div>
    <div class="relative h-1.5 bg-kinetic-ink rounded-full overflow-hidden">
      <div
        class="h-full bg-kinetic-neon rounded-full transition-all duration-500 ease-out"
        :style="'width: ' + $store.vitalite.progress + '%'"
      ></div>
    </div>
    <p
      class="relative text-xs text-gray-500 mt-2"
      x-text="$store.vitalite.doneCount + ' sur ' + $store.vitalite.totalCount + ' tâches complétées'"
    ></p>
  </div>

  <!-- Actions rapides -->
  <div class="flex gap-2 mb-4">
    <button
      @click="$store.vitalite.showAddForm = !$store.vitalite.showAddForm"
      aria-label="Ajouter une tâche personnalisée"
      class="flex-1 flex items-center justify-center gap-1.5 h-11 rounded-xl bg-kinetic-neon/15 text-base font-semibold text-kinetic-neon active:bg-kinetic-neon/25 transition-colors"
    >
      <span class="text-lg font-normal leading-none">＋</span>
      <span>Ajouter</span>
    </button>
    <button
      x-show="$store.vitalite.hiddenIds.length > 0"
      @click="$store.vitalite.showHidden = !$store.vitalite.showHidden"
      :aria-label="'Voir les ' + $store.vitalite.hiddenIds.length + ' tâches masquées'"
      class="flex items-center gap-1.5 h-11 px-4 rounded-xl bg-kinetic-surface text-base text-white active:bg-kinetic-elevated transition-colors"
    >
      <span x-text="$store.vitalite.hiddenIds.length"></span>
    </button>
    <button
      @click="$store.vitalite.toggleHistory()"
      aria-label="Voir l'historique des 7 derniers jours"
      class="flex items-center gap-2 h-11 px-4 rounded-xl bg-kinetic-surface text-base text-white active:bg-kinetic-elevated transition-colors"
    >
      <span>Historique</span>
    </button>
  </div>

  <!-- ── Tâches masquées (collapse) ─────────────────────────────────────────── -->
  <div
    x-show="$store.vitalite.showHidden && $store.vitalite.hiddenIds.length > 0"
    x-transition
    class="bg-kinetic-surface ring-1 ring-white/10 rounded-2xl p-4 mb-4"
  >
    <div class="flex items-center justify-between mb-3">
      <h2 class="font-semibold text-white">Tâches masquées</h2>
      <button
        @click="$store.vitalite.showHidden = false"
        class="text-xs text-gray-400 hover:text-white"
        aria-label="Fermer le panel des tâches masquées"
      >
        Fermer
      </button>
    </div>
    <p class="text-xs text-gray-500 mb-3">
      Tape "Restaurer" pour les remettre dans ta liste du jour.
    </p>
    <div class="space-y-2">
      <template x-for="spec in $store.vitalite.hiddenSpecsList" :key="spec.id">
        <div
          class="flex items-center gap-3 p-3 rounded-xl bg-kinetic-elevated/60 ring-1 ring-white/5"
        >
          <span class="text-xl flex-shrink-0" x-text="spec.icon"></span>
          <div class="flex-1 min-w-0">
            <p class="text-sm text-gray-300 truncate" x-text="spec.title"></p>
            <p class="text-xs text-gray-500">+<span x-text="spec.xp"></span> XP</p>
          </div>
          <button
            @click="$store.vitalite.unhideTask(spec.id)"
            class="text-xs px-3 py-1.5 rounded-lg bg-kinetic-neon/15 ring-1 ring-kinetic-neon/40 text-kinetic-neon font-semibold hover:bg-kinetic-neon/25 transition-colors flex-shrink-0"
          >
            ↺ Restaurer
          </button>
        </div>
      </template>
    </div>
  </div>

  <!-- ── Formulaire tâche personnalisée ────────────────────────────────────── -->
  <div
    x-show="$store.vitalite.showAddForm"
    x-transition
    class="bg-kinetic-surface ring-1 ring-white/10 rounded-2xl p-4 mb-4"
  >
    <h2 class="font-semibold text-white mb-3">Nouvelle tâche</h2>

    <!-- Emoji picker -->
    <div class="mb-3">
      <p class="text-xs text-gray-500 mb-1.5">Icône</p>
      <div class="flex flex-wrap gap-1.5 mb-2">
        <template x-for="e in $store.vitalite.emojiSuggestions" :key="e">
          <button
            @click="$store.vitalite.newTaskIcon = e"
            class="w-9 h-9 rounded-xl text-xl flex items-center justify-center transition-all"
            :class="$store.vitalite.newTaskIcon === e
                    ? 'bg-kinetic-neon/20 ring-2 ring-kinetic-neon scale-110'
                    : 'bg-kinetic-elevated hover:bg-white/10'"
            x-text="e"
          ></button>
        </template>
      </div>
      <div class="flex gap-2 items-center">
        <span class="text-xs text-gray-500">Ou tape un emoji :</span>
        <input
          type="text"
          x-model="$store.vitalite.newTaskIcon"
          maxlength="4"
          class="w-16 bg-kinetic-ink border border-white/10 rounded-xl px-3 py-1.5 text-white text-center text-lg"
        />
      </div>
    </div>

    <!-- Titre -->
    <div class="mb-3">
      <label for="vit-new-title" class="text-xs text-gray-500 mb-1 block"
        >Titre <span class="text-kinetic-electric">*</span></label
      >
      <input
        id="vit-new-title"
        type="text"
        x-model="$store.vitalite.newTaskTitle"
        placeholder="Ex: Faire 10 pompes"
        maxlength="60"
        autocomplete="off"
        class="w-full bg-kinetic-ink border border-white/10 rounded-xl px-3 py-2 text-white text-sm focus:border-kinetic-neon/60 focus:outline-none transition-colors"
      />
      <p
        x-show="$store.vitalite.addFormError"
        class="text-xs text-kinetic-electric mt-1"
        role="alert"
        x-text="$store.vitalite.addFormError"
      ></p>
    </div>

    <!-- XP + Priorité -->
    <div class="grid grid-cols-2 gap-3 mb-4">
      <div>
        <label for="f-vitalite-1" class="text-xs text-gray-500 mb-1 block">XP (10–200)</label>
        <input
          id="f-vitalite-1"
          type="number"
          min="10"
          max="200"
          step="10"
          x-model.number="$store.vitalite.newTaskXp"
          class="w-full bg-kinetic-ink border border-white/10 rounded-xl px-3 py-2 text-white text-sm"
        />
      </div>
      <div>
        <label for="f-vitalite-2" class="text-xs text-gray-500 mb-1 block">Priorité</label>
        <select
          id="f-vitalite-2"
          x-model="$store.vitalite.newTaskPriority"
          class="w-full bg-kinetic-ink border border-white/10 rounded-xl px-3 py-2 text-white text-sm"
        >
          <option value="high">Haute</option>
          <option value="med">Moyenne</option>
          <option value="low">Faible</option>
        </select>
      </div>
    </div>

    <!-- Preview -->
    <div
      class="flex items-center gap-3 p-3 bg-kinetic-elevated/60 rounded-xl mb-3 ring-1 ring-white/5"
    >
      <span class="text-2xl" x-text="$store.vitalite.newTaskIcon || ''"></span>
      <div>
        <p
          class="text-white text-sm font-medium"
          x-text="$store.vitalite.newTaskTitle || 'Titre de la tâche'"
        ></p>
        <p class="text-xs text-kinetic-electric/90">
          +<span x-text="$store.vitalite.newTaskXp"></span> XP
        </p>
      </div>
    </div>

    <div class="flex gap-2">
      <button
        @click="$store.vitalite.addCustomTask()"
        class="flex-1 px-4 py-2.5 rounded-xl bg-kinetic-neon text-gray-950 text-sm font-black hover:brightness-110 active:scale-95"
      >
        Ajouter
      </button>
      <button
        @click="$store.vitalite.showAddForm = false; $store.vitalite.addFormError = ''"
        class="px-4 py-2.5 rounded-xl bg-kinetic-elevated text-gray-400 text-sm hover:text-white"
      >
        Annuler
      </button>
    </div>
  </div>

  <!-- ── Historique ─────────────────────────────────────────────────────────── -->
  <div
    x-show="$store.vitalite.showHistory"
    x-transition
    class="bg-kinetic-surface ring-1 ring-white/10 rounded-2xl p-4 mb-4"
  >
    <div class="flex items-center justify-between mb-3">
      <h2 class="font-semibold text-white">7 derniers jours</h2>
      <button
        @click="$store.vitalite.showHistory = false"
        class="text-xs text-gray-400 hover:text-white"
      >
        Fermer
      </button>
    </div>

    <div x-show="$store.vitalite.historyLoading" class="text-sm text-gray-500 py-2">
      Chargement…
    </div>

    <div x-show="!$store.vitalite.historyLoading" class="space-y-2">
      <template x-for="day in $store.vitalite.historyDays" :key="day.date">
        <div>
          <!-- Ligne résumé (cliquable pour détail) -->
          <button
            @click="$store.vitalite.detailDay = ($store.vitalite.detailDay && $store.vitalite.detailDay.date === day.date ? null : day)"
            class="w-full flex items-center gap-3 p-3 rounded-xl bg-kinetic-elevated/60 ring-1 ring-white/5 hover:bg-white/5 transition-colors text-left"
          >
            <div class="flex-1 min-w-0">
              <p class="text-sm text-white font-medium capitalize" x-text="day.label"></p>
              <p class="text-xs text-gray-500">
                <span
                  x-text="$plural(day.doneIds.length, 'tâche complétée', 'tâches complétées')"
                ></span>
              </p>
            </div>
            <!-- Mini barre de progression -->
            <div class="w-16 h-1.5 bg-kinetic-ink rounded-full overflow-hidden">
              <div
                class="h-full bg-kinetic-neon rounded-full transition-all"
                :style="'width: ' + $num.min(100, $num.round(day.doneIds.length / $num.max(1, $store.vitalite.totalCount) * 100)) + '%'"
              ></div>
            </div>
            <span
              class="text-xs font-bold text-kinetic-neon"
              x-text="$num.min(100, $num.round(day.doneIds.length / $num.max(1,$store.vitalite.totalCount) * 100)) + '%'"
            ></span>
            <svg
              class="w-4 h-4 text-gray-500 flex-shrink-0 transition-transform"
              :class="$store.vitalite.detailDay && $store.vitalite.detailDay.date === day.date ? 'rotate-90' : ''"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M9 5l7 7-7 7"
              />
            </svg>
          </button>

          <!-- Détail du jour -->
          <div
            x-show="$store.vitalite.detailDay && $store.vitalite.detailDay.date === day.date"
            x-transition:enter="transition ease-out duration-200"
            x-transition:enter-start="opacity-0 -translate-y-1"
            x-transition:enter-end="opacity-100 translate-y-0"
            class="mt-1 pl-3 space-y-1"
          >
            <template x-if="day.tasks.length === 0">
              <p class="text-xs text-gray-500 italic py-1">Aucune tâche ce jour-là.</p>
            </template>
            <template x-for="t in day.tasks" :key="t.id">
              <div class="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-kinetic-elevated/40">
                <span x-text="t.icon"></span>
                <span class="text-xs text-gray-300" x-text="t.title"></span>
                <span class="ml-auto text-kinetic-neon text-xs">✓</span>
              </div>
            </template>
          </div>
        </div>
      </template>
    </div>
  </div>

  <!-- ── Liste des tâches ───────────────────────────────────────────────────── -->
  <div class="k-list" x-data>
    <template x-for="task in $store.vitalite.tasks" :key="task.id">
      <div class="k-item flex items-stretch">
        <!-- Carte principale -->
        <button
          @click="!task.done && $store.vitalite.complete(task.id)"
          :disabled="task.done || $store.vitalite.isLocked(task.id)"
          class="flex-1 min-w-0 flex items-center gap-3 pl-4 pr-1 py-3 text-left transition-colors active:bg-kinetic-elevated disabled:cursor-not-allowed"
        >
          <!-- Icône / Checkmark -->
          <div
            class="w-6 h-6 rounded-full flex items-center justify-center flex-shrink-0 transition-colors duration-300"
            :class="task.done ? 'bg-kinetic-neon' : 'ring-2 ring-inset ring-gray-700'"
          >
            <span
              x-show="task.done"
              x-transition:enter="transition duration-300"
              x-transition:enter-start="scale-0 opacity-0"
              x-transition:enter-end="scale-100 opacity-100"
              class="text-gray-950 font-bold text-xs leading-none"
              >✓</span
            >
          </div>

          <!-- Contenu -->
          <div class="flex-1 min-w-0">
            <p
              class="text-base transition-colors"
              :class="task.done ? 'text-gray-500' : 'text-white'"
              x-text="task.title"
            ></p>
            <p
              class="text-xs mt-0.5 text-gray-500"
              x-text="task.done ? 'Terminé' : '+' + task.xp + ' XP'"
            ></p>
          </div>

          <!-- Badge priorité -->
          <span
            class="text-xs flex-shrink-0 font-medium"
            :class="task.priority === 'high' ? 'text-kinetic-electric' : 'text-gray-500'"
            x-text="{ high: 'Haute', med: 'Moy.', low: 'Faible' }[task.priority]"
          >
          </span>

          <!-- Spinner -->
          <div
            x-show="$store.vitalite.completingId === task.id"
            class="w-5 h-5 border-2 border-kinetic-electric border-t-transparent rounded-full animate-spin flex-shrink-0"
          ></div>
        </button>

        <!-- Actions secondaires : colonne d'icônes (cibles tactiles de 40 px) -->
        <div class="flex flex-col justify-center gap-1 flex-shrink-0">
          <button
            x-show="task.done && !$store.vitalite.isLocked(task.id)"
            @click.stop="$store.vitalite.undo(task.id)"
            title="Annuler"
            aria-label="Annuler la complétion de cette tâche"
            class="w-10 h-10 rounded-xl flex items-center justify-center text-gray-500 hover:text-white hover:bg-white/5"
          >
            <svg
              class="w-4 h-4"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M9 14 4 9l5-5M4 9h10.5a5.5 5.5 0 0 1 0 11H11"
              />
            </svg>
          </button>
          <button
            x-show="$store.vitalite.isCustom(task.id)"
            @click.stop="$store.vitalite.deleteCustomTask(task.id)"
            title="Supprimer"
            aria-label="Supprimer cette tâche personnalisée"
            class="w-10 h-10 rounded-xl flex items-center justify-center text-gray-500 hover:text-kinetic-coral hover:bg-white/5"
          >
            <svg
              class="w-4 h-4"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M3 6h18M8 6V4h8v2m-9 0 1 14h8l1-14"
              />
            </svg>
          </button>
          <button
            x-show="!$store.vitalite.isCustom(task.id) && !$store.vitalite.isLocked(task.id) && !task.done"
            @click.stop="$store.vitalite.hideTask(task.id)"
            title="Masquer"
            aria-label="Masquer cette tâche (réversible)"
            class="w-10 h-10 rounded-xl flex items-center justify-center text-gray-500 hover:text-white hover:bg-white/5"
          >
            <svg
              class="w-4 h-4"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8M9.9 5.1A9.8 9.8 0 0 1 12 5c5 0 9 4.5 10 7a13 13 0 0 1-3.2 4.3M6.6 6.6C4.3 8 2.7 10 2 12c1 2.5 5 7 10 7 1.6 0 3.1-.4 4.4-1.1"
              />
            </svg>
          </button>
        </div>
      </div>
    </template>
  </div>

  <!-- Message victoire -->
  <div
    x-show="$store.vitalite.allDone"
    x-transition:enter="transition ease-out duration-500"
    x-transition:enter-start="opacity-0 translate-y-4"
    x-transition:enter-end="opacity-100 translate-y-0"
    class="mt-6 p-6 bg-kinetic-neon rounded-2xl text-gray-950 text-center shadow-2xl shadow-kinetic-neon/30"
  >
    <p class="font-display font-black text-2xl tracking-tight">Routine complète !</p>
    <p class="text-gray-900/80 text-sm mt-2 font-medium">Incroyable. Continue comme ça demain.</p>
    <a
      href="/"
      class="mt-4 inline-block px-6 py-2.5 bg-kinetic-ink/15 hover:bg-kinetic-ink/25 transition-colors rounded-xl text-sm font-semibold"
    >
      Retour au dashboard →
    </a>
  </div>
</div>
