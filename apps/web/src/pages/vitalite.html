<div class="max-w-md mx-auto px-4 pt-8 pb-8">

  <!-- Header -->
  <div class="flex items-center gap-3 mb-6">
    <a href="/" class="text-gray-500 hover:text-gray-300 transition-colors p-1 -ml-1">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
      </svg>
    </a>
    <h1 class="text-2xl font-display font-black tracking-tight text-white">Routine vitalité</h1>
    <span class="ml-auto text-xs text-gray-500"
          x-text="new Date().toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' })">
    </span>
  </div>

  <!-- Progression globale -->
  <div class="relative overflow-hidden rounded-2xl p-5 mb-4 bg-kinetic-surface ring-1 ring-kinetic-neon/20">
    <div class="absolute -top-10 -right-10 w-32 h-32 bg-kinetic-neon/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="relative flex items-center justify-between mb-2">
      <span class="text-[10px] uppercase tracking-widest text-kinetic-neon font-semibold">Progression du jour</span>
      <div class="flex items-center gap-2">
        <!-- Indicateur bonus XP (niveau 5+) -->
        <template x-if="$store.rewards.hasXpBonus">
          <span class="text-[10px] font-bold text-yellow-400 bg-yellow-400/10 ring-1 ring-yellow-400/30 px-2 py-0.5 rounded-full">
            ⚡ +20% XP
          </span>
        </template>
        <span class="font-display font-black text-kinetic-neon text-2xl leading-none"
              x-text="$store.vitalite.progress + '%'"></span>
      </div>
    </div>
    <div class="relative h-2.5 bg-black/40 rounded-full overflow-hidden ring-1 ring-white/5">
      <div class="h-full bg-gradient-to-r from-kinetic-neon to-lime-300 rounded-full transition-all duration-500 ease-out shadow-[0_0_14px_rgba(168,255,0,0.65)]"
           :style="`width: ${$store.vitalite.progress}%`"></div>
    </div>
    <p class="relative text-xs text-gray-500 mt-2"
       x-text="`${$store.vitalite.doneCount} sur ${$store.vitalite.totalCount} tâches complétées`">
    </p>
  </div>

  <!-- Actions rapides -->
  <div class="flex gap-2 mb-4">
    <button @click="$store.vitalite.showAddForm = !$store.vitalite.showAddForm"
            class="flex-1 flex items-center justify-center gap-2 px-3 py-2.5 rounded-xl bg-kinetic-surface ring-1 ring-white/10 text-sm text-gray-300 hover:text-white hover:bg-kinetic-elevated transition-colors">
      <span class="text-base">＋</span>
      <span>Ajouter une tâche</span>
    </button>
    <button @click="$store.vitalite.toggleHistory()"
            class="flex items-center gap-2 px-3 py-2.5 rounded-xl bg-kinetic-surface ring-1 ring-white/10 text-sm text-gray-300 hover:text-white hover:bg-kinetic-elevated transition-colors">
      <span>📅</span>
      <span>Historique</span>
    </button>
  </div>

  <!-- ── Formulaire tâche personnalisée ────────────────────────────────────── -->
  <div x-show="$store.vitalite.showAddForm" x-transition
       class="bg-kinetic-surface ring-1 ring-white/10 rounded-2xl p-4 mb-4">
    <h2 class="font-semibold text-white mb-3">Nouvelle tâche</h2>

    <!-- Emoji picker -->
    <div class="mb-3">
      <p class="text-xs text-gray-500 mb-1.5">Icône</p>
      <div class="flex flex-wrap gap-1.5 mb-2">
        <template x-for="e in $store.vitalite.emojiSuggestions" :key="e">
          <button @click="$store.vitalite.newTaskIcon = e"
                  class="w-9 h-9 rounded-xl text-xl flex items-center justify-center transition-all"
                  :class="$store.vitalite.newTaskIcon === e
                    ? 'bg-kinetic-neon/20 ring-2 ring-kinetic-neon scale-110'
                    : 'bg-kinetic-elevated hover:bg-white/10'"
                  x-text="e"></button>
        </template>
      </div>
      <div class="flex gap-2 items-center">
        <span class="text-xs text-gray-500">Ou tape un emoji :</span>
        <input type="text" x-model="$store.vitalite.newTaskIcon" maxlength="4"
               class="w-16 bg-kinetic-ink border border-white/10 rounded-xl px-3 py-1.5 text-white text-center text-lg"/>
      </div>
    </div>

    <!-- Titre -->
    <div class="mb-3">
      <label class="text-xs text-gray-500 mb-1 block">Titre <span class="text-kinetic-electric">*</span></label>
      <input type="text" x-model="$store.vitalite.newTaskTitle" placeholder="Ex: Faire 10 pompes"
             maxlength="60"
             class="w-full bg-kinetic-ink border border-white/10 rounded-xl px-3 py-2 text-white text-sm"/>
      <p x-show="$store.vitalite.addFormError" class="text-xs text-kinetic-electric mt-1"
         x-text="$store.vitalite.addFormError"></p>
    </div>

    <!-- XP + Priorité -->
    <div class="grid grid-cols-2 gap-3 mb-4">
      <div>
        <label class="text-xs text-gray-500 mb-1 block">XP (10–200)</label>
        <input type="number" min="10" max="200" step="10"
               x-model.number="$store.vitalite.newTaskXp"
               class="w-full bg-kinetic-ink border border-white/10 rounded-xl px-3 py-2 text-white text-sm"/>
      </div>
      <div>
        <label class="text-xs text-gray-500 mb-1 block">Priorité</label>
        <select x-model="$store.vitalite.newTaskPriority"
                class="w-full bg-kinetic-ink border border-white/10 rounded-xl px-3 py-2 text-white text-sm">
          <option value="high">Haute</option>
          <option value="med">Moyenne</option>
          <option value="low">Faible</option>
        </select>
      </div>
    </div>

    <!-- Preview -->
    <div class="flex items-center gap-3 p-3 bg-kinetic-elevated/60 rounded-xl mb-3 ring-1 ring-white/5">
      <span class="text-2xl" x-text="$store.vitalite.newTaskIcon || '⭐'"></span>
      <div>
        <p class="text-white text-sm font-medium" x-text="$store.vitalite.newTaskTitle || 'Titre de la tâche'"></p>
        <p class="text-xs text-kinetic-electric/90">+<span x-text="$store.vitalite.newTaskXp"></span> XP</p>
      </div>
    </div>

    <div class="flex gap-2">
      <button @click="$store.vitalite.addCustomTask()"
              class="flex-1 px-4 py-2.5 rounded-xl bg-kinetic-neon text-gray-950 text-sm font-black hover:brightness-110 active:scale-95">
        Ajouter
      </button>
      <button @click="$store.vitalite.showAddForm = false; $store.vitalite.addFormError = ''"
              class="px-4 py-2.5 rounded-xl bg-kinetic-elevated text-gray-400 text-sm hover:text-white">
        Annuler
      </button>
    </div>
  </div>

  <!-- ── Historique ─────────────────────────────────────────────────────────── -->
  <div x-show="$store.vitalite.showHistory" x-transition class="bg-kinetic-surface ring-1 ring-white/10 rounded-2xl p-4 mb-4">
    <div class="flex items-center justify-between mb-3">
      <h2 class="font-semibold text-white">7 derniers jours</h2>
      <button @click="$store.vitalite.showHistory = false" class="text-xs text-gray-400 hover:text-white">Fermer</button>
    </div>

    <div x-show="$store.vitalite.historyLoading" class="text-sm text-gray-500 py-2">Chargement…</div>

    <div x-show="!$store.vitalite.historyLoading" class="space-y-2">
      <template x-for="day in $store.vitalite.historyDays" :key="day.date">
        <div>
          <!-- Ligne résumé (cliquable pour détail) -->
          <button @click="$store.vitalite.detailDay = ($store.vitalite.detailDay?.date === day.date ? null : day)"
                  class="w-full flex items-center gap-3 p-3 rounded-xl bg-kinetic-elevated/60 ring-1 ring-white/5 hover:bg-white/5 transition-colors text-left">
            <div class="flex-1 min-w-0">
              <p class="text-sm text-white font-medium capitalize" x-text="day.label"></p>
              <p class="text-xs text-gray-500">
                <span x-text="day.doneIds.length"></span> tâche(s) complétée(s)
              </p>
            </div>
            <!-- Mini barre de progression -->
            <div class="w-16 h-1.5 bg-black/40 rounded-full overflow-hidden">
              <div class="h-full bg-kinetic-neon rounded-full transition-all"
                   :style="`width: ${Math.min(100, Math.round(day.doneIds.length / Math.max(1,$store.vitalite.totalCount) * 100))}%`"></div>
            </div>
            <span class="text-xs font-bold text-kinetic-neon"
                  x-text="Math.min(100, Math.round(day.doneIds.length / Math.max(1,$store.vitalite.totalCount) * 100)) + '%'"></span>
            <svg class="w-4 h-4 text-gray-500 flex-shrink-0 transition-transform"
                 :class="$store.vitalite.detailDay?.date === day.date ? 'rotate-90' : ''"
                 fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
            </svg>
          </button>

          <!-- Détail du jour -->
          <div x-show="$store.vitalite.detailDay?.date === day.date"
               x-transition:enter="transition ease-out duration-200"
               x-transition:enter-start="opacity-0 -translate-y-1"
               x-transition:enter-end="opacity-100 translate-y-0"
               class="mt-1 pl-3 space-y-1">
            <template x-if="day.tasks.length === 0">
              <p class="text-xs text-gray-500 italic py-1">Aucune tâche ce jour-là.</p>
            </template>
            <template x-for="t in day.tasks" :key="t.id">
              <div class="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-kinetic-elevated/40">
                <span x-text="t.icon"></span>
                <span class="text-xs text-gray-300" x-text="t.title"></span>
                <span class="ml-auto text-kinetic-neon text-xs">✓</span>
              </div>
            </template>
          </div>
        </div>
      </template>
    </div>
  </div>

  <!-- ── Liste des tâches ───────────────────────────────────────────────────── -->
  <div class="space-y-2.5" x-data>

    <template x-for="task in $store.vitalite.tasks" :key="task.id">
      <div class="relative">
        <!-- Carte principale -->
        <button
          @click="!task.done && $store.vitalite.complete(task.id)"
          :disabled="task.done || $store.vitalite.isLocked(task.id)"
          class="w-full flex items-center gap-4 p-4 bg-kinetic-surface rounded-2xl transition-all duration-300 text-left active:scale-[0.98] disabled:cursor-not-allowed"
          :class="task.done
            ? 'ring-1 ring-kinetic-neon/30 opacity-75'
            : 'ring-1 ring-white/5 hover:ring-kinetic-electric/30 hover:shadow-[0_0_18px_rgba(255,106,0,0.15)]'">

          <!-- Icône / Checkmark -->
          <div class="w-12 h-12 rounded-xl flex items-center justify-center text-2xl flex-shrink-0 transition-all duration-300"
               :class="task.done
                 ? 'bg-kinetic-neon/15 ring-1 ring-kinetic-neon/30 shadow-[0_0_14px_rgba(168,255,0,0.4)]'
                 : 'bg-kinetic-elevated ring-1 ring-white/5'">
            <span x-show="!task.done" x-text="task.icon"></span>
            <span x-show="task.done"
                  x-transition:enter="transition duration-300"
                  x-transition:enter-start="scale-0 opacity-0"
                  x-transition:enter-end="scale-100 opacity-100"
                  class="text-kinetic-neon font-bold text-lg">✓</span>
          </div>

          <!-- Contenu -->
          <div class="flex-1 min-w-0">
            <p class="font-medium text-sm transition-colors"
               :class="task.done ? 'line-through text-gray-500' : 'text-white'"
               x-text="task.title"></p>
            <p class="text-xs mt-0.5 font-semibold"
               :class="task.done ? 'text-kinetic-neon' : 'text-kinetic-electric/90'"
               x-text="task.done ? 'Complété ✓' : '+' + task.xp + ' XP'"></p>
          </div>

          <!-- Badge priorité -->
          <span class="text-[10px] px-2 py-0.5 rounded-full flex-shrink-0 font-bold uppercase tracking-wider"
                :class="{
                  'bg-kinetic-electric/15 text-kinetic-electric ring-1 ring-kinetic-electric/30': task.priority === 'high',
                  'bg-kinetic-electric/10 text-kinetic-electric ring-1 ring-kinetic-electric/20': task.priority === 'med',
                  'bg-white/5 text-gray-500 ring-1 ring-white/5':                                 task.priority === 'low'
                }"
                x-text="{ high: 'Haute', med: 'Moy.', low: 'Faible' }[task.priority]">
          </span>

          <!-- Spinner -->
          <div x-show="$store.vitalite.completingId === task.id"
               class="w-5 h-5 border-2 border-kinetic-electric border-t-transparent rounded-full animate-spin flex-shrink-0">
          </div>
        </button>

        <!-- Boutons secondaires : Annuler (si cochée) + Supprimer (si custom) -->
        <div class="absolute right-2 -bottom-2.5 flex gap-1" x-show="task.done || $store.vitalite.isCustom(task.id)">
          <!-- Annuler (undo) -->
          <button x-show="task.done && !$store.vitalite.isLocked(task.id)"
                  @click.stop="$store.vitalite.undo(task.id)"
                  title="Annuler cette tâche"
                  class="text-[10px] px-2 py-0.5 rounded-full bg-kinetic-ink ring-1 ring-white/10 text-gray-400 hover:text-kinetic-electric hover:ring-kinetic-electric/40 transition-colors">
            ↩ Annuler
          </button>
          <!-- Supprimer (custom seulement) -->
          <button x-show="$store.vitalite.isCustom(task.id)"
                  @click.stop="$store.vitalite.deleteCustomTask(task.id)"
                  title="Supprimer cette tâche"
                  class="text-[10px] px-2 py-0.5 rounded-full bg-kinetic-ink ring-1 ring-white/10 text-gray-400 hover:text-kinetic-electric hover:ring-kinetic-electric/40 transition-colors">
            ✕ Suppr.
          </button>
        </div>
      </div>
    </template>
  </div>

  <!-- Message victoire -->
  <div x-show="$store.vitalite.allDone"
       x-transition:enter="transition ease-out duration-500"
       x-transition:enter-start="opacity-0 translate-y-4"
       x-transition:enter-end="opacity-100 translate-y-0"
       class="mt-6 p-6 bg-gradient-to-br from-kinetic-neon to-lime-400 rounded-2xl text-gray-950 text-center shadow-2xl shadow-kinetic-neon/30">
    <p class="text-5xl mb-3">🏆</p>
    <p class="font-display font-black text-2xl tracking-tight">Routine complète !</p>
    <p class="text-gray-900/80 text-sm mt-2 font-medium">Incroyable. Continue comme ça demain. 🔥</p>
    <a href="/"
       class="mt-4 inline-block px-6 py-2.5 bg-kinetic-ink/15 hover:bg-kinetic-ink/25 transition-colors rounded-xl text-sm font-semibold">
      Retour au dashboard →
    </a>
  </div>

</div>
