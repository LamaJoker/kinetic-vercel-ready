<div class="max-w-md mx-auto px-4 pt-8 pb-8">

  <!-- Header -->
  <div class="flex items-center gap-3 mb-6">
    <a href="/"
       class="flex items-center justify-center w-9 h-9 rounded-xl transition-colors"
       style="background: var(--k-surface); color: var(--k-tx3);"
       onmouseover="this.style.color='var(--k-tx)'"
       onmouseout="this.style.color='var(--k-tx3)'">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/>
      </svg>
    </a>
    <div class="flex-1">
      <h1 class="font-display-v2 font-bold text-k-tx" style="font-size: 20px; letter-spacing: -0.02em;">Routine vitalité</h1>
      <p class="font-display-v2" style="font-size: 11px; color: var(--k-tx3);"
         x-text="new Date().toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' })"></p>
    </div>
    <!-- Actions rapides header -->
    <div class="flex gap-2">
      <button @click="$store.vitalite.toggleHistory()"
              class="btn-ghost flex items-center gap-1.5"
              style="padding: 7px 11px; font-size: 12px; border-radius: 11px;">
        📅
        <span>Historique</span>
      </button>
      <button @click="$store.vitalite.showAddForm = !$store.vitalite.showAddForm"
              class="btn-p flex items-center gap-1.5"
              style="padding: 7px 11px; font-size: 12px; border-radius: 11px;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round">
          <path d="M12 5v14M5 12h14"/>
        </svg>
        Tâche
      </button>
    </div>
  </div>

  <!-- Carte progression : ring SVG + résumé -->
  <div class="k-card mb-4" style="padding: 18px 20px; display: flex; align-items: center; gap: 20px;">

    <!-- Ring SVG progress -->
    <div class="relative flex-shrink-0">
      <svg width="80" height="80" style="transform: rotate(-90deg);">
        <circle cx="40" cy="40" r="32" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="7"/>
        <circle cx="40" cy="40" r="32" fill="none" stroke="var(--k-p)" stroke-width="7" stroke-linecap="round"
                :stroke-dasharray="2 * Math.PI * 32"
                :stroke-dashoffset="2 * Math.PI * 32 * (1 - $store.vitalite.progress / 100)"
                style="transition: stroke-dashoffset .8s cubic-bezier(.34,1.2,.64,1); filter: drop-shadow(0 0 6px var(--k-p-glow));"/>
      </svg>
      <div class="absolute inset-0 flex flex-col items-center justify-center">
        <span class="font-display-v2 font-bold" style="font-size: 18px; color: var(--k-p); line-height: 1;"
              x-text="$store.vitalite.progress + '%'"></span>
      </div>
    </div>

    <!-- Résumé texte -->
    <div class="flex-1">
      <p class="font-display-v2 font-bold mb-1"
         style="font-size: 16px; color: var(--k-tx);"
         x-text="$store.vitalite.allDone ? 'Routine complète ⚡' : 'En cours…'"></p>
      <p style="font-size: 12px; color: var(--k-tx2); margin-bottom: 6px;"
         x-text="$store.vitalite.allDone
           ? 'Excellent travail !'
           : ($store.vitalite.totalCount - $store.vitalite.doneCount) + ' tâche' + ($store.vitalite.totalCount - $store.vitalite.doneCount > 1 ? 's' : '') + ' restante' + ($store.vitalite.totalCount - $store.vitalite.doneCount > 1 ? 's' : '')">
      </p>
      <div class="flex items-center gap-2">
        <span class="font-display-v2 font-bold" style="font-size: 11px; color: var(--k-p);"
              x-text="$store.vitalite.doneCount + ' / ' + $store.vitalite.totalCount + ' tâches'"></span>
        <!-- Badge XP bonus -->
        <template x-if="$store.rewards.hasXpBonus">
          <span class="font-display-v2 font-bold" style="font-size: 10px; color: #FFD166; background: rgba(255,209,102,.12); border: 1px solid rgba(255,209,102,.3); padding: 2px 7px; border-radius: 99px;">
            ⚡ +20% XP
          </span>
        </template>
      </div>
    </div>
  </div>

  <!-- ── Historique 7 jours ──────────────────────────────────────────────────── -->
  <div x-show="$store.vitalite.showHistory" x-transition
       class="k-card mb-4"
       style="padding: 16px 18px; border: 1px solid oklch(82% 0.28 145 / 0.2);">
    <div class="flex items-center justify-between mb-4">
      <p class="font-display-v2 font-bold" style="font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--k-p);">
        7 derniers jours
      </p>
      <button @click="$store.vitalite.showHistory = false"
              style="font-size: 12px; color: var(--k-tx3); background: none; border: none; cursor: pointer;">
        Fermer
      </button>
    </div>

    <div x-show="$store.vitalite.historyLoading" style="font-size: 13px; color: var(--k-tx3); padding: 8px 0;">Chargement…</div>

    <div x-show="!$store.vitalite.historyLoading" class="space-y-2">
      <template x-for="day in $store.vitalite.historyDays" :key="day.date">
        <div>
          <button @click="$store.vitalite.detailDay = ($store.vitalite.detailDay?.date === day.date ? null : day)"
                  class="w-full flex items-center gap-3 text-left transition-all"
                  style="padding: 10px 12px; border-radius: 12px; background: var(--k-elevated);">
            <div class="flex-1 min-w-0">
              <p class="font-display-v2 font-semibold capitalize" style="font-size: 13px; color: var(--k-tx);" x-text="day.label"></p>
              <p style="font-size: 11px; color: var(--k-tx3);">
                <span x-text="day.doneIds.length"></span> tâche(s)
              </p>
            </div>
            <div class="bar-track" style="width: 64px; flex-shrink: 0;">
              <div class="bar-fill" :style="`width: ${Math.min(100, Math.round(day.doneIds.length / Math.max(1, $store.vitalite.totalCount) * 100))}%`"></div>
            </div>
            <span class="font-display-v2 font-bold flex-shrink-0" style="font-size: 11px; color: var(--k-p); width: 32px; text-align: right;"
                  x-text="Math.min(100, Math.round(day.doneIds.length / Math.max(1, $store.vitalite.totalCount) * 100)) + '%'"></span>
            <svg class="flex-shrink-0 transition-transform" style="width: 14px; height: 14px; color: var(--k-tx3);"
                 :style="$store.vitalite.detailDay?.date === day.date ? 'transform: rotate(90deg)' : ''"
                 fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
            </svg>
          </button>

          <!-- Détail du jour -->
          <div x-show="$store.vitalite.detailDay?.date === day.date"
               x-transition:enter="transition ease-out duration-200"
               x-transition:enter-start="opacity-0 -translate-y-1"
               x-transition:enter-end="opacity-100 translate-y-0"
               class="mt-1 pl-3 space-y-1">
            <template x-if="day.tasks.length === 0">
              <p style="font-size: 12px; color: var(--k-tx3); font-style: italic; padding: 4px 0;">Aucune tâche ce jour-là.</p>
            </template>
            <template x-for="t in day.tasks" :key="t.id">
              <div class="flex items-center gap-2" style="padding: 6px 10px; border-radius: 9px; background: rgba(255,255,255,.04);">
                <span x-text="t.icon" style="font-size: 14px;"></span>
                <span style="font-size: 12px; color: var(--k-tx2);" x-text="t.title"></span>
                <span class="ml-auto font-display-v2 font-bold" style="font-size: 11px; color: var(--k-p);">✓</span>
              </div>
            </template>
          </div>
        </div>
      </template>
    </div>
  </div>

  <!-- ── Formulaire tâche personnalisée ────────────────────────────────────── -->
  <div x-show="$store.vitalite.showAddForm" x-transition
       class="k-card mb-4"
       style="padding: 16px 18px; border: 1px solid oklch(82% 0.28 145 / 0.25);">
    <p class="font-display-v2 font-bold mb-4" style="font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--k-p);">
      Nouvelle tâche
    </p>

    <!-- Emoji picker -->
    <div class="mb-3">
      <p style="font-size: 11px; color: var(--k-tx3); margin-bottom: 8px;">Icône</p>
      <div class="flex flex-wrap gap-1.5 mb-2">
        <template x-for="e in $store.vitalite.emojiSuggestions" :key="e">
          <button @click="$store.vitalite.newTaskIcon = e"
                  class="flex items-center justify-center transition-all"
                  style="width: 36px; height: 36px; border-radius: 10px; font-size: 18px; border: none; cursor: pointer;"
                  :style="$store.vitalite.newTaskIcon === e
                    ? 'background: oklch(82% 0.28 145 / 0.2); outline: 2px solid var(--k-p); transform: scale(1.15);'
                    : 'background: var(--k-elevated); outline: none; transform: scale(1);'"
                  x-text="e"></button>
        </template>
      </div>
      <div class="flex gap-2 items-center">
        <span style="font-size: 11px; color: var(--k-tx3);">Ou tape un emoji :</span>
        <input type="text" x-model="$store.vitalite.newTaskIcon" maxlength="4"
               class="k-input"
               style="width: 56px; padding: 7px 10px; text-align: center; font-size: 18px;"/>
      </div>
    </div>

    <!-- Titre -->
    <div class="mb-3">
      <label class="font-display-v2 font-semibold block mb-1.5"
             style="font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--k-tx3);">
        Titre <span style="color: var(--k-e);">*</span>
      </label>
      <input type="text" x-model="$store.vitalite.newTaskTitle"
             placeholder="Ex: Faire 10 pompes" maxlength="60"
             class="k-input w-full" style="padding: 11px 13px; font-size: 14px;"/>
      <p x-show="$store.vitalite.addFormError"
         style="font-size: 11px; color: var(--k-e); margin-top: 4px;"
         x-text="$store.vitalite.addFormError"></p>
    </div>

    <!-- XP + Priorité -->
    <div class="grid grid-cols-2 gap-3 mb-4">
      <div>
        <label class="font-display-v2 font-semibold block mb-1.5"
               style="font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--k-tx3);">
          XP (10–200)
        </label>
        <input type="number" min="10" max="200" step="10"
               x-model.number="$store.vitalite.newTaskXp"
               class="k-input w-full" style="padding: 11px 13px; font-size: 14px; text-align: center;"/>
      </div>
      <div>
        <label class="font-display-v2 font-semibold block mb-1.5"
               style="font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--k-tx3);">
          Priorité
        </label>
        <select x-model="$store.vitalite.newTaskPriority"
                class="k-input w-full" style="padding: 11px 13px; font-size: 14px;">
          <option value="high">Haute</option>
          <option value="med">Moyenne</option>
          <option value="low">Faible</option>
        </select>
      </div>
    </div>

    <!-- Preview -->
    <div class="flex items-center gap-3 mb-4"
         style="padding: 10px 14px; background: var(--k-elevated); border-radius: 12px; border: 1px solid var(--k-line);">
      <span style="font-size: 22px;" x-text="$store.vitalite.newTaskIcon || '⭐'"></span>
      <div>
        <p class="font-display-v2 font-semibold"
           style="font-size: 13px;"
           :style="$store.vitalite.newTaskTitle ? 'color: var(--k-tx)' : 'color: var(--k-tx3)'"
           x-text="$store.vitalite.newTaskTitle || 'Titre de la tâche'"></p>
        <p style="font-size: 11px; color: var(--k-p); margin-top: 2px;">
          +<span x-text="$store.vitalite.newTaskXp"></span> XP
        </p>
      </div>
    </div>

    <div class="flex gap-2">
      <button @click="$store.vitalite.addCustomTask()"
              class="btn-p flex-1" style="padding: 12px; font-size: 14px;">
        Ajouter
      </button>
      <button @click="$store.vitalite.showAddForm = false; $store.vitalite.addFormError = ''"
              class="btn-ghost" style="padding: 12px 16px; font-size: 14px;">
        Annuler
      </button>
    </div>
  </div>

  <!-- ── Liste des tâches ───────────────────────────────────────────────────── -->
  <div class="space-y-2.5" x-data>
    <template x-for="(task, i) in $store.vitalite.tasks" :key="task.id">
      <div class="relative" :style="`animation: slide-up .35s ${i * 0.04}s both`">

        <!-- Carte principale -->
        <button
          @click="!task.done && $store.vitalite.complete(task.id)"
          :disabled="task.done || $store.vitalite.isLocked(task.id)"
          class="w-full flex items-center gap-4 text-left transition-all duration-300 active:scale-[0.98] disabled:cursor-not-allowed"
          :style="task.done
            ? 'padding: 14px 16px; border-radius: 19px; background: oklch(82% 0.28 145 / 0.1); border: 1.5px solid oklch(82% 0.28 145 / 0.3); box-shadow: 0 0 18px oklch(82% 0.28 145 / 0.1);'
            : 'padding: 14px 16px; border-radius: 19px; background: var(--k-surface); border: 1.5px solid var(--k-line);'">

          <!-- Icône / Checkmark -->
          <div class="flex-shrink-0 flex items-center justify-center transition-all duration-300"
               style="width: 48px; height: 48px; border-radius: 15px;"
               :style="task.done
                 ? 'background: oklch(82% 0.28 145 / 0.15); border: 1px solid oklch(82% 0.28 145 / 0.25);'
                 : 'background: var(--k-elevated); border: 1px solid var(--k-line);'">
            <span x-show="!task.done" x-text="task.icon" style="font-size: 22px;"></span>
            <span x-show="task.done"
                  x-transition:enter="transition duration-300"
                  x-transition:enter-start="scale-0 opacity-0"
                  x-transition:enter-end="scale-100 opacity-100"
                  class="font-display-v2 font-bold"
                  style="font-size: 18px; color: var(--k-p);">✓</span>
          </div>

          <!-- Contenu -->
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2 mb-1">
              <p class="font-display-v2 font-bold transition-all"
                 style="font-size: 14px;"
                 :style="task.done ? 'color: var(--k-p); text-decoration: line-through;' : 'color: var(--k-tx);'"
                 x-text="task.title"></p>
              <!-- Badge priorité -->
              <span class="font-display-v2 font-bold flex-shrink-0"
                    style="font-size: 9px; padding: 2px 7px; border-radius: 99px; letter-spacing: .06em;"
                    :style="{
                      'high': 'color: var(--k-e); background: rgba(255,122,51,.12); border: 1px solid rgba(255,122,51,.25);',
                      'med':  'color: var(--k-p); background: oklch(82% 0.28 145 / 0.12); border: 1px solid oklch(82% 0.28 145 / 0.25);',
                      'low':  'color: var(--k-tx3); background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.08);',
                    }[task.priority]"
                    x-text="{ high: 'Haute', med: 'Moy.', low: 'Faible' }[task.priority]">
              </span>
            </div>
            <p class="font-display-v2 font-semibold"
               style="font-size: 11px;"
               :style="task.done ? 'color: var(--k-p);' : 'color: var(--k-e);'"
               x-text="task.done ? 'Complété ✓' : '+' + task.xp + ' XP'"></p>
          </div>

          <!-- Spinner -->
          <div x-show="$store.vitalite.completingId === task.id"
               class="w-5 h-5 border-2 rounded-full animate-spin flex-shrink-0"
               style="border-color: var(--k-e); border-top-color: transparent;">
          </div>
        </button>

        <!-- Boutons secondaires -->
        <div class="absolute right-2 -bottom-2.5 flex gap-1"
             x-show="task.done || $store.vitalite.isCustom(task.id)">
          <button x-show="task.done && !$store.vitalite.isLocked(task.id)"
                  @click.stop="$store.vitalite.undo(task.id)"
                  title="Annuler cette tâche"
                  style="font-size: 10px; padding: 2px 8px; border-radius: 99px; background: var(--k-void); border: 1px solid var(--k-line); color: var(--k-tx3); cursor: pointer; transition: color .2s;">
            ↩ Annuler
          </button>
          <button x-show="$store.vitalite.isCustom(task.id)"
                  @click.stop="$store.vitalite.deleteCustomTask(task.id)"
                  title="Supprimer cette tâche"
                  style="font-size: 10px; padding: 2px 8px; border-radius: 99px; background: var(--k-void); border: 1px solid var(--k-line); color: var(--k-tx3); cursor: pointer; transition: color .2s;">
            ✕ Suppr.
          </button>
        </div>
      </div>
    </template>
  </div>

  <!-- Message victoire -->
  <div x-show="$store.vitalite.allDone"
       x-transition:enter="transition ease-out duration-500"
       x-transition:enter-start="opacity-0 translate-y-4"
       x-transition:enter-end="opacity-100 translate-y-0"
       class="mt-6 rounded-[20px] text-center"
       style="padding: 28px 24px; background: linear-gradient(135deg, oklch(82% 0.28 145) 0%, oklch(88% 0.24 145) 100%); color: #07070B; box-shadow: 0 0 40px oklch(82% 0.28 145 / 0.35);">
    <p style="font-size: 52px; margin-bottom: 12px; animation: pr-bounce .5s both;">🏆</p>
    <p class="font-display-v2 font-bold" style="font-size: 22px; letter-spacing: -0.02em; margin-bottom: 8px;">Routine complète !</p>
    <p style="font-size: 13px; color: rgba(7,7,11,.75); font-weight: 500; margin-bottom: 18px;">Incroyable. Continue comme ça demain. 🔥</p>
    <a href="/"
       style="display: inline-block; padding: 10px 22px; background: rgba(7,7,11,.12); border-radius: 12px; font-size: 13px; font-weight: 700; color: #07070B; text-decoration: none; transition: background .2s;"
       onmouseover="this.style.background='rgba(7,7,11,.22)'"
       onmouseout="this.style.background='rgba(7,7,11,.12)'">
      Retour au dashboard →
    </a>
  </div>

</div>
