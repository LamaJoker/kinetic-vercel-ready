<div x-data="photosPage" x-init="init()" class="max-w-md mx-auto px-4 pt-8 pb-8">
  <div class="k-nav">
    <a href="/profile" class="k-back" aria-label="Retour">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2.4"
          d="M15 19l-7-7 7-7"
        />
      </svg>
    </a>
    <div class="flex-1 min-w-0">
      <h1 data-large-title class="font-display font-bold text-white">Photos de progrès</h1>
      <p class="text-gray-500 text-pretty">Même lumière, même pose : l'évolution saute aux yeux</p>
    </div>
  </div>

  <!-- Ajout -->
  <section class="mb-8">
    <div class="k-list">
      <label for="f-photos-1" class="k-row cursor-text">
        <span class="text-base text-white flex-shrink-0">Poids</span>
        <input
          id="f-photos-1"
          type="number"
          step="0.1"
          inputmode="decimal"
          placeholder="Facultatif"
          x-model.number="newBodyweight"
          class="flex-1 min-w-0 bg-transparent text-right text-base text-white tabular-nums placeholder:text-gray-500 focus:outline-none"
        />
        <span class="text-base text-gray-500 flex-shrink-0" aria-hidden="true">kg</span>
      </label>
      <label for="f-photos-2" class="k-row cursor-pointer">
        <span class="text-base text-white flex-1 min-w-0">Pose</span>
        <span class="relative flex items-center">
          <select
            id="f-photos-2"
            x-model="newLabel"
            class="appearance-none bg-transparent text-right text-base text-gray-500 pr-6 py-1 focus:outline-none cursor-pointer"
          >
            <option value="front">Face</option>
            <option value="side">Profil</option>
            <option value="back">Dos</option>
          </select>
          <svg
            class="pointer-events-none absolute right-0 w-3.5 h-3.5 text-gray-500"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2.4"
              d="M8 9l4-4 4 4M8 15l4 4 4-4"
            />
          </svg>
        </span>
      </label>
    </div>

    <p class="k-caption mt-2 mb-4 flex items-start gap-1.5">
      <svg
        class="w-3.5 h-3.5 mt-0.5 flex-shrink-0"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <rect x="5" y="11" width="14" height="10" rx="2" stroke-width="2.2" />
        <path stroke-linecap="round" stroke-width="2.2" d="M8 11V8a4 4 0 118 0v3" />
      </svg>
      <span>Tes photos restent sur ton appareil : aucune n'est envoyée à un serveur.</span>
    </p>

    <label
      class="k-btn cursor-pointer focus-within:ring-2 focus-within:ring-kinetic-neon focus-within:ring-offset-2 focus-within:ring-offset-kinetic-ink"
      :class="adding ? 'opacity-40 pointer-events-none' : ''"
    >
      <svg
        x-show="!adding"
        class="w-5 h-5"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2.2"
          d="M4 8.5A1.5 1.5 0 015.5 7h2l1.5-2h6l1.5 2h2A1.5 1.5 0 0120 8.5v9a1.5 1.5 0 01-1.5 1.5h-13A1.5 1.5 0 014 17.5v-9z"
        />
        <circle cx="12" cy="13" r="3.25" stroke-width="2.2" />
      </svg>
      <span x-show="!adding">Ajouter une photo</span>
      <span x-show="adding">Compression…</span>
      <input
        type="file"
        accept="image/*"
        capture="user"
        class="sr-only"
        :disabled="adding"
        @change="addPhoto($event)"
      />
    </label>
  </section>

  <!-- Comparaison avant / après : superposé (curseur) ou côte à côte -->
  <template x-if="photos.length >= 2">
    <section class="mb-8">
      <div class="flex items-center justify-between mb-2.5">
        <h2 class="k-section">Comparaison</h2>
        <button
          type="button"
          @click="showCompare = !showCompare"
          class="k-link min-h-11"
          :aria-expanded="showCompare ? 'true' : 'false'"
        >
          <span x-text="showCompare ? 'Masquer' : 'Afficher'"></span>
        </button>
      </div>
      <template x-if="showCompare">
        <div>
          <div class="k-seg mb-3" role="group" aria-label="Mode de comparaison">
            <button
              type="button"
              class="k-seg-item"
              @click="setOverlay()"
              :aria-pressed="isOverlay ? 'true' : 'false'"
            >
              Superposé
            </button>
            <button
              type="button"
              class="k-seg-item"
              @click="setSide()"
              :aria-pressed="isOverlay ? 'false' : 'true'"
            >
              Côte à côte
            </button>
          </div>

          <!-- Visionneuse (devient plein écran) -->
          <div
            :class="fullscreen ? 'fixed inset-0 z-[80] flex flex-col gap-3 bg-black px-4 pt-[max(1rem,env(safe-area-inset-top))] pb-[max(1rem,env(safe-area-inset-bottom))]' : ''"
            :role="fullscreen ? 'dialog' : null"
            :aria-modal="fullscreen ? 'true' : null"
            aria-label="Comparaison avant / après"
            @keydown.escape.window="closeFullscreen()"
          >
            <div x-show="fullscreen" class="flex items-center justify-between gap-3">
              <p class="text-base font-semibold text-gray-50 tabular-nums" x-text="gapLabel"></p>
              <button
                type="button"
                @click="closeFullscreen()"
                class="h-11 px-4 rounded-full bg-white/15 text-base font-semibold text-gray-50 active:opacity-60"
              >
                Fermer
              </button>
            </div>

            <div :class="fullscreen ? 'flex-1 min-h-0 flex items-center justify-center' : ''">
              <!-- Superposé : la photo « avant » est coupée au curseur -->
              <div
                x-show="isOverlay"
                data-k-noswipe
                class="relative mx-auto aspect-[3/4] overflow-hidden rounded-2xl bg-kinetic-elevated ring-1 ring-white/10 select-none [-webkit-touch-callout:none]"
                :class="fullscreen ? 'h-full max-w-full touch-none' : 'w-full touch-pan-y'"
                @pointerdown="splitDown($event)"
                @pointermove="splitMove($event)"
                @pointerup="splitUp()"
                @pointercancel="splitUp()"
              >
                <img
                  :src="afterUrl"
                  alt="Photo après"
                  draggable="false"
                  class="absolute inset-0 w-full h-full object-cover pointer-events-none"
                />
                <img
                  :src="beforeUrl"
                  alt="Photo avant"
                  draggable="false"
                  class="absolute inset-0 w-full h-full object-cover pointer-events-none"
                  :style="beforeClipStyle"
                />
                <span
                  class="absolute top-2 left-2 rounded-full bg-black/55 backdrop-blur px-2.5 py-1 text-xs font-semibold text-gray-50 tabular-nums pointer-events-none"
                  x-text="'Avant · ' + beforeDate"
                ></span>
                <span
                  class="absolute top-2 right-2 rounded-full bg-black/55 backdrop-blur px-2.5 py-1 text-xs font-semibold text-gray-50 tabular-nums pointer-events-none"
                  x-text="'Après · ' + afterDate"
                ></span>
                <!-- Curseur vertical -->
                <div
                  class="absolute inset-y-0 -ml-px w-0.5 bg-white shadow-[0_0_8px_rgba(0,0,0,0.5)]"
                  :style="handleStyle"
                >
                  <span
                    role="slider"
                    tabindex="0"
                    aria-label="Curseur avant / après"
                    aria-valuemin="0"
                    aria-valuemax="100"
                    :aria-valuenow="split"
                    :aria-valuetext="splitText"
                    @keydown="splitKey($event)"
                    class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-11 h-11 rounded-full bg-white text-gray-900 shadow-lg flex items-center justify-center transition-transform focus:outline-none focus-visible:ring-2 focus-visible:ring-kinetic-neon"
                    :class="dragging ? 'scale-110' : ''"
                  >
                    <svg
                      class="w-5 h-5"
                      fill="none"
                      stroke="currentColor"
                      viewBox="0 0 24 24"
                      aria-hidden="true"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2.4"
                        d="M9 7l-5 5 5 5M15 7l5 5-5 5"
                      />
                    </svg>
                  </span>
                </div>
              </div>

              <!-- Côte à côte -->
              <div x-show="!isOverlay" class="grid grid-cols-2 gap-2 w-full">
                <figure
                  class="relative overflow-hidden rounded-2xl bg-kinetic-elevated ring-1 ring-white/10"
                >
                  <img
                    :src="beforeUrl"
                    alt="Photo avant"
                    class="w-full aspect-[3/4] object-cover"
                  />
                  <figcaption
                    class="absolute top-2 left-2 max-w-[calc(100%-1rem)] truncate rounded-full bg-black/55 backdrop-blur px-2.5 py-1 text-xs font-semibold text-gray-50 tabular-nums"
                    x-text="'Avant · ' + beforeDate"
                  ></figcaption>
                </figure>
                <figure
                  class="relative overflow-hidden rounded-2xl bg-kinetic-elevated ring-1 ring-white/10"
                >
                  <img :src="afterUrl" alt="Photo après" class="w-full aspect-[3/4] object-cover" />
                  <figcaption
                    class="absolute top-2 left-2 max-w-[calc(100%-1rem)] truncate rounded-full bg-black/55 backdrop-blur px-2.5 py-1 text-xs font-semibold text-gray-50 tabular-nums"
                    x-text="'Après · ' + afterDate"
                  ></figcaption>
                </figure>
              </div>
            </div>
            <p x-show="fullscreen && isOverlay" class="text-center text-sm text-gray-400">
              Fais glisser le curseur pour comparer
            </p>
          </div>

          <p
            class="mt-3 flex items-center justify-between gap-3 rounded-2xl bg-kinetic-elevated/70 px-4 min-h-[3.25rem]"
          >
            <span class="text-sm font-medium text-gray-400">Écart</span>
            <span class="k-stat text-lg" x-text="gapLabel"></span>
          </p>

          <div class="k-list mt-3">
            <label for="f-photos-before" class="k-row cursor-pointer">
              <span class="text-base text-white flex-1 min-w-0">Avant</span>
              <select
                id="f-photos-before"
                x-model="compareBeforeId"
                aria-label="Date de la photo avant"
                class="appearance-none bg-transparent text-right text-base text-gray-500 py-1 tabular-nums focus:outline-none cursor-pointer"
              >
                <template x-for="p in photos.slice().reverse()" :key="p.id">
                  <option
                    :value="p.id"
                    :selected="p.id === compareBeforeId"
                    x-text="photoOptionLabel(p)"
                  ></option>
                </template>
              </select>
            </label>
            <label for="f-photos-after" class="k-row cursor-pointer">
              <span class="text-base text-white flex-1 min-w-0">Après</span>
              <select
                id="f-photos-after"
                x-model="compareAfterId"
                aria-label="Date de la photo après"
                class="appearance-none bg-transparent text-right text-base text-gray-500 py-1 tabular-nums focus:outline-none cursor-pointer"
              >
                <template x-for="p in photos.slice().reverse()" :key="p.id">
                  <option
                    :value="p.id"
                    :selected="p.id === compareAfterId"
                    x-text="photoOptionLabel(p)"
                  ></option>
                </template>
              </select>
            </label>
          </div>

          <div class="grid grid-cols-3 gap-2 mt-3">
            <button type="button" @click="openFullscreen()" class="k-btn-2 px-2 text-sm">
              Plein écran
            </button>
            <button type="button" @click="swapPair()" class="k-btn-2 px-2 text-sm">Inverser</button>
            <button
              type="button"
              @click="shareCompare()"
              :disabled="sharing"
              class="k-btn-2 px-2 text-sm"
            >
              Partager
            </button>
          </div>
        </div>
      </template>
    </section>
  </template>

  <!-- Galerie -->
  <section>
    <div class="flex items-baseline justify-between mb-2.5">
      <h2 class="k-section">Mes photos</h2>
      <span
        class="text-sm text-gray-500 tabular-nums"
        x-show="photos.length > 0"
        x-text="$plural(photos.length, 'photo')"
      ></span>
    </div>
    <template x-if="photos.length === 0">
      <div class="k-empty k-enter">
        <p>Aucune photo pour l'instant</p>
        <p class="text-sm text-gray-500 mt-1.5 leading-relaxed">
          Choisis une pose puis « Ajouter une photo ». Prends-la toujours avec la même lumière et la
          même pose pour bien comparer.
        </p>
        <div class="mt-6 flex justify-center gap-2.5" aria-hidden="true">
          <span
            class="w-14 aspect-[3/4] rounded-xl bg-gradient-to-b from-kinetic-neon/25 to-kinetic-neon/5 ring-1 ring-kinetic-neon/30"
          ></span>
          <span
            class="w-14 aspect-[3/4] rounded-xl bg-gradient-to-b from-kinetic-elevated to-transparent ring-1 ring-white/10 -rotate-3"
          ></span>
          <span
            class="w-14 aspect-[3/4] rounded-xl bg-gradient-to-b from-kinetic-elevated to-transparent ring-1 ring-white/10 rotate-3"
          ></span>
        </div>
      </div>
    </template>
    <div class="grid grid-cols-2 gap-2.5 k-stagger">
      <template x-for="p in photos.slice().reverse()" :key="p.id">
        <figure
          class="relative overflow-hidden rounded-[1.125rem] bg-kinetic-surface ring-1 ring-white/10 shadow-lg shadow-black/40"
        >
          <img
            x-bind:src="photoUrl(p)"
            class="w-full aspect-[3/4] object-cover"
            x-bind:alt="photoDateLabel(p)"
          />
          <figcaption
            class="absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/80 via-black/35 to-transparent px-3 pt-8 pb-2.5"
          >
            <p class="text-sm font-semibold text-gray-50" x-text="photoDateLabel(p)"></p>
            <p
              class="text-[11px] text-gray-50/80 tabular-nums"
              x-show="p.bodyweightKg"
              x-text="p.bodyweightKg + ' kg' + (p.label ? ' · ' + (p.label === 'front' ? 'Face' : (p.label === 'side' ? 'Profil' : (p.label === 'back' ? 'Dos' : p.label))) : '')"
            ></p>
          </figcaption>
          <button
            type="button"
            @click="removePhoto(p.id)"
            class="absolute top-1.5 right-1.5 w-8 h-8 rounded-full bg-black/50 backdrop-blur text-gray-50 flex items-center justify-center transition active:scale-90 active:bg-kinetic-electric after:absolute after:-inset-1.5 after:content-['']"
            aria-label="Supprimer la photo"
          >
            <svg
              class="w-3.5 h-3.5"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path stroke-linecap="round" stroke-width="2.6" d="M6 6l12 12M18 6L6 18" />
            </svg>
          </button>
        </figure>
      </template>
    </div>
  </section>
</div>
