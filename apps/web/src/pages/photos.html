<div x-data="photosPage" x-init="init()" class="max-w-md mx-auto px-4 pt-8 pb-8">
  <div class="flex items-center gap-3 mb-6">
    <a
      href="/profile"
      class="p-1.5 -ml-1.5 text-gray-500 hover:text-white transition-colors rounded-lg hover:bg-kinetic-surface"
      aria-label="Retour"
    >
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
      </svg>
    </a>
    <h1 class="text-2xl font-display font-black tracking-tight text-white">Photos de progrès</h1>
  </div>

  <!-- Ajout -->
  <div class="bg-kinetic-surface rounded-2xl p-4 mb-4 ring-1 ring-white/5">
    <p class="text-xs text-gray-500 mb-3">
      Les photos sont stockées <strong>localement</strong> sur ton appareil. Aucune n'est envoyée à
      un serveur.
    </p>
    <div class="grid grid-cols-2 gap-2 mb-3">
      <div>
        <label class="text-[10px] uppercase tracking-widest text-gray-500 font-semibold"
          >Poids (kg)</label
        >
        <input
          type="number"
          step="0.1"
          x-model.number="newBodyweight"
          class="w-full bg-kinetic-ink border border-white/10 rounded-xl px-3 py-2 text-sm text-white mt-1"
        />
      </div>
      <div>
        <label class="text-[10px] uppercase tracking-widest text-gray-500 font-semibold"
          >Étiquette</label
        >
        <select
          x-model="newLabel"
          class="w-full bg-kinetic-ink border border-white/10 rounded-xl px-3 py-2 text-sm text-white mt-1"
        >
          <option value="front">Face</option>
          <option value="side">Profil</option>
          <option value="back">Dos</option>
        </select>
      </div>
    </div>
    <label
      class="block w-full bg-kinetic-neon text-gray-950 rounded-xl px-4 py-2.5 text-sm font-bold text-center hover:brightness-110 active:scale-95 transition-all cursor-pointer"
      :class="adding ? 'opacity-40 pointer-events-none' : ''"
    >
      <span x-show="!adding">📷 Ajouter une photo</span>
      <span x-show="adding">Compression…</span>
      <input
        type="file"
        accept="image/*"
        capture="user"
        class="hidden"
        @change="addPhoto($event)"
      />
    </label>
  </div>

  <!-- Comparaison -->
  <template x-if="photos.length >= 2">
    <div class="bg-kinetic-surface rounded-2xl p-4 mb-4 ring-1 ring-white/5">
      <div class="flex items-center justify-between mb-3">
        <h2 class="font-bold text-white">Comparaison</h2>
        <button @click="showCompare = !showCompare" class="text-xs text-gray-400 hover:text-white">
          <span x-text="showCompare ? 'Masquer' : 'Afficher'"></span>
        </button>
      </div>
      <template x-if="showCompare">
        <div>
          <div
            class="grid grid-cols-2 gap-2 mb-2 text-[10px] text-gray-500 uppercase tracking-widest"
          >
            <p>Avant</p>
            <p>Après</p>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <select
                x-model="compareBeforeId"
                class="w-full bg-kinetic-ink border border-white/10 rounded-lg px-2 py-1.5 text-xs text-white mb-2"
              >
                <template x-for="p in photos.slice().reverse()" :key="p.id">
                  <option :value="p.id" x-text="photoDateLabel(p)"></option>
                </template>
              </select>
              <img
                x-bind:src="comparePhoto(compareBeforeId) ? photoUrl(comparePhoto(compareBeforeId)) : ''"
                class="w-full aspect-[3/4] object-cover rounded-xl bg-black"
              />
            </div>
            <div>
              <select
                x-model="compareAfterId"
                class="w-full bg-kinetic-ink border border-white/10 rounded-lg px-2 py-1.5 text-xs text-white mb-2"
              >
                <template x-for="p in photos.slice().reverse()" :key="p.id">
                  <option :value="p.id" x-text="photoDateLabel(p)"></option>
                </template>
              </select>
              <img
                x-bind:src="comparePhoto(compareAfterId) ? photoUrl(comparePhoto(compareAfterId)) : ''"
                class="w-full aspect-[3/4] object-cover rounded-xl bg-black"
              />
            </div>
          </div>
          <p class="text-xs text-center text-gray-500 mt-3" x-show="weightDelta() !== null">
            Δ poids : <span class="font-bold" x-text="weightDelta() + ' kg'"></span>
          </p>
        </div>
      </template>
    </div>
  </template>

  <!-- Timeline -->
  <div class="bg-kinetic-surface rounded-2xl p-4 ring-1 ring-white/5">
    <div class="flex items-center justify-between mb-3">
      <h2 class="font-bold text-white">Mes photos</h2>
      <span class="text-xs text-gray-500" x-text="photos.length + ' photo(s)'"></span>
    </div>
    <template x-if="photos.length === 0">
      <p class="text-sm text-gray-500 text-center py-8">
        Aucune photo. Commence par en ajouter une à droite ↗
      </p>
    </template>
    <div class="grid grid-cols-2 gap-2">
      <template x-for="p in photos.slice().reverse()" :key="p.id">
        <div class="relative group">
          <img
            x-bind:src="photoUrl(p)"
            class="w-full aspect-[3/4] object-cover rounded-xl bg-black"
            x-bind:alt="photoDateLabel(p)"
          />
          <div
            class="absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/80 via-black/40 to-transparent rounded-b-xl px-2 py-1.5"
          >
            <p class="text-[10px] text-white font-bold" x-text="photoDateLabel(p)"></p>
            <p
              class="text-[10px] text-gray-300"
              x-show="p.bodyweightKg"
              x-text="p.bodyweightKg + ' kg · ' + (p.label || '')"
            ></p>
          </div>
          <button
            @click="removePhoto(p.id)"
            class="absolute top-1.5 right-1.5 w-6 h-6 rounded-full bg-black/60 text-white text-xs flex items-center justify-center hover:bg-kinetic-electric transition-colors"
            aria-label="Supprimer"
          >
            ✕
          </button>
        </div>
      </template>
    </div>
  </div>
</div>
