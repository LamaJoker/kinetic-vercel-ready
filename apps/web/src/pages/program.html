<div x-data="program" x-init="init()" class="max-w-md mx-auto px-4 pt-8 pb-8">
  <div class="flex items-center gap-3 mb-6">
    <a
      href="/"
      class="p-1.5 -ml-1.5 text-gray-500 hover:text-white transition-colors rounded-lg hover:bg-kinetic-surface"
      aria-label="Retour"
    >
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
      </svg>
    </a>
    <h1 class="text-2xl font-display font-black tracking-tight text-white">Programme</h1>
  </div>

  <!-- Programme actif — semaine -->
  <div x-show="activeProgram" class="bg-kinetic-surface rounded-2xl p-4 mb-4">
    <div class="flex items-center justify-between mb-3">
      <h2 class="font-semibold text-white" x-text="activeProgram ? activeProgram.name : ''"></h2>
      <span
        class="text-xs bg-kinetic-neon/20 text-kinetic-neon px-2 py-1 rounded-full"
        x-text="activeProgram ? (activeProgram.splitType ? activeProgram.splitType.toUpperCase().replace('_', ' ') : '') : ''"
      ></span>
    </div>

    <!-- Semaine visuelle -->
    <div class="grid grid-cols-7 gap-1 mb-3">
      <template x-for="day in weekDays">
        <div class="flex flex-col items-center">
          <span class="text-xs text-gray-500 mb-1" x-text="day.short"></span>
          <div
            class="w-full aspect-square rounded-lg flex items-center justify-center text-xs font-semibold"
            :class="{
                 'bg-kinetic-neon text-gray-950': day.isToday && !day.rest,
                 'bg-kinetic-elevated text-gray-400': !day.isToday && !day.rest && !day.done,
                 'bg-kinetic-neon/20 text-kinetic-neon': day.done,
                 'bg-kinetic-surface text-gray-700': day.rest,
               }"
            x-text="day.rest ? '—' : day.focus.charAt(0)"
          ></div>
        </div>
      </template>
    </div>

    <!-- Focus du jour -->
    <div x-show="todayFocus" class="bg-kinetic-elevated/60 rounded-xl p-3">
      <p class="text-xs text-gray-500 mb-0.5">Aujourd'hui</p>
      <p class="text-white font-semibold" x-text="todayFocus ? todayFocus.focus : ''"></p>
      <div class="flex flex-wrap gap-1 mt-1.5">
        <template x-for="muscle in (todayFocus ? todayFocus.muscleGroups : [])">
          <span
            class="text-xs bg-kinetic-surface text-gray-400 px-2 py-0.5 rounded-full"
            x-text="muscle"
          ></span>
        </template>
      </div>
    </div>
  </div>

  <!-- Choisir un split -->
  <div class="bg-kinetic-surface rounded-2xl p-4 mb-4">
    <h2 class="font-semibold text-white mb-3">
      <span x-show="!activeProgram">Choisir un programme</span>
      <span x-show="activeProgram">Changer de programme</span>
    </h2>

    <div class="space-y-2">
      <template x-for="split in availableSplits">
        <button
          @click="selectSplit(split.type)"
          class="w-full bg-kinetic-elevated/60 border rounded-xl p-3 text-left transition-colors"
          :class="(activeProgram ? activeProgram.splitType : null) === split.type
                  ? 'border-kinetic-neon bg-kinetic-neon/10'
                  : 'border-white/10 hover:border-white/10'"
        >
          <div class="flex items-center justify-between gap-3">
            <div class="min-w-0">
              <p class="text-white font-medium text-sm" x-text="split.name"></p>
              <p class="text-gray-400 text-xs mt-0.5 truncate" x-text="split.description"></p>
            </div>
            <div class="text-right flex-shrink-0">
              <p
                class="text-xs text-gray-400 font-semibold"
                x-text="split.daysPerWeek + 'j/sem'"
              ></p>
              <p class="text-[10px] text-kinetic-neon font-semibold" x-text="split.goal"></p>
            </div>
          </div>
        </button>
      </template>
    </div>
  </div>

  <!-- Todo list muscu — exercices du jour -->
  <div x-show="todayExercises.length > 0" class="bg-kinetic-surface rounded-2xl p-4 mb-4">
    <h2 class="font-semibold text-white mb-3">Todo du jour</h2>
    <div class="space-y-2">
      <template x-for="ex in todayExercises" :key="ex.id">
        <div
          class="flex items-center gap-3 p-3 bg-kinetic-elevated/60 rounded-xl"
          :class="ex.done ? 'opacity-60' : ''"
        >
          <button
            @click="toggleExercise(ex.id)"
            class="w-6 h-6 rounded-full border-2 flex-shrink-0 transition-colors flex items-center justify-center"
            :class="ex.done
                    ? 'border-kinetic-neon bg-kinetic-neon text-gray-950'
                    : 'border-white/10'"
          >
            <span x-show="ex.done" class="text-xs font-black">✓</span>
          </button>
          <div class="flex-1">
            <p
              class="text-white text-sm font-medium"
              :class="ex.done ? 'line-through' : ''"
              x-text="ex.name"
            ></p>
            <p
              class="text-xs text-gray-500"
              x-text="ex.sets + '×' + ex.targetReps + ' reps · RPE ' + ex.targetRpe"
            ></p>
          </div>
          <button @click="startExercise(ex)" class="text-xs text-kinetic-neon hover:text-lime-400">
            Démarrer →
          </button>
        </div>
      </template>
    </div>

    <!-- Bouton séance rapide -->
    <button
      @click="startTodaySession()"
      class="w-full mt-3 py-2.5 bg-kinetic-neon text-gray-950 font-semibold rounded-xl text-sm"
    >
      Démarrer la séance du jour →
    </button>
  </div>

  <!-- Génération auto de templates -->
  <div x-show="activeProgram" class="bg-kinetic-surface rounded-2xl p-4 mb-4 ring-1 ring-white/5">
    <div class="flex items-start justify-between gap-3 mb-3">
      <div>
        <h2 class="font-semibold text-white text-sm">Templates auto</h2>
        <p class="text-[11px] text-gray-500 mt-0.5">
          Génère un template Séances pour chaque jour d'entraînement.
        </p>
      </div>
      <span
        x-show="generatedCount > 0"
        class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-kinetic-neon/15 text-kinetic-neon ring-1 ring-kinetic-neon/30 flex-shrink-0"
        x-text="generatedCount + ' générés'"
      ></span>
    </div>
    <button
      type="button"
      @click="generateTemplates()"
      :disabled="generating"
      class="w-full py-2.5 bg-kinetic-electric/20 hover:bg-kinetic-electric/30 text-kinetic-electric font-semibold rounded-xl text-sm ring-1 ring-kinetic-electric/30 transition-all disabled:opacity-50 disabled:cursor-not-allowed"
    >
      <span x-show="!generating">⚡ Générer les templates de séance</span>
      <span x-show="generating">Génération en cours…</span>
    </button>
  </div>

  <!-- Progression hebdomadaire -->
  <div x-show="activeProgram" class="bg-kinetic-surface rounded-2xl p-4 ring-1 ring-white/5">
    <div class="flex items-center justify-between mb-2">
      <h2 class="font-semibold text-white">Semaine en cours</h2>
      <span class="text-sm font-bold text-kinetic-neon" x-text="weekProgressPct + '%'"></span>
    </div>
    <div class="h-2.5 bg-kinetic-elevated rounded-full overflow-hidden">
      <div
        class="h-full bg-kinetic-neon rounded-full transition-all duration-500"
        :style="'width: ' + weekProgressPct + '%'"
      ></div>
    </div>
    <p
      class="text-xs text-gray-500 mt-1.5"
      x-text="completedTrainingDays + ' / ' + totalTrainingDays + ' séances cette semaine'"
    ></p>
  </div>
</div>
