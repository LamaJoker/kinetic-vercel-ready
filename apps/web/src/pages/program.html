<div x-data="program" x-init="init()" class="max-w-md mx-auto px-4 pt-8 pb-8">
  <div class="k-nav">
    <a href="/" class="k-back" aria-label="Retour">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2.4"
          d="M15 19l-7-7 7-7"
        />
      </svg>
    </a>
    <h1 class="font-display font-bold text-white">Programme</h1>
  </div>

  <!-- Programme actif — semaine -->
  <div x-show="activeProgram" class="bg-kinetic-surface rounded-2xl p-4 mb-8">
    <div class="flex items-center justify-between gap-3">
      <h2
        class="font-display text-lg font-semibold text-white truncate"
        x-text="activeProgram ? activeProgram.name : ''"
      ></h2>
      <span
        class="k-badge flex-shrink-0"
        x-text="activeProgram ? (activeProgram.splitType ? activeProgram.splitType.toUpperCase().replace('_', ' ') : '') : ''"
      ></span>
    </div>

    <!-- Semaine visuelle -->
    <div class="grid grid-cols-7 gap-1.5 mt-4">
      <template x-for="day in weekDays">
        <div class="flex flex-col items-center gap-1.5">
          <span class="text-xs font-medium text-gray-500" x-text="day.short"></span>
          <div
            class="w-full max-w-[2.5rem] aspect-square rounded-full flex items-center justify-center text-sm font-semibold transition-colors"
            :class="{
                 'k-on': day.isToday && !day.rest && !day.done,
                 'bg-kinetic-elevated text-white': !day.isToday && !day.rest && !day.done,
                 'bg-kinetic-teal text-gray-950': day.done,
                 'text-gray-500': day.rest && !day.done,
               }"
            x-text="day.rest ? '—' : day.focus.charAt(0)"
          ></div>
        </div>
      </template>
    </div>

    <!-- Progression hebdomadaire -->
    <div class="mt-5 pt-4 border-t border-white/10">
      <div class="flex items-baseline justify-between mb-2.5">
        <h2 class="k-card-title">Semaine en cours</h2>
        <span
          class="font-display text-lg font-bold text-kinetic-neon tabular-nums"
          x-text="weekProgressPct + '%'"
        ></span>
      </div>
      <div
        class="h-1.5 bg-kinetic-ink rounded-full overflow-hidden"
        role="progressbar"
        aria-label="Séances réalisées cette semaine"
        aria-valuemin="0"
        aria-valuemax="100"
        :aria-valuenow="weekProgressPct"
      >
        <div
          class="h-full bg-kinetic-neon rounded-full transition-all duration-500"
          :style="'width: ' + weekProgressPct + '%'"
        ></div>
      </div>
      <p
        class="text-xs text-gray-500 mt-2 tabular-nums"
        x-text="completedTrainingDays + ' / ' + totalTrainingDays + ' séances cette semaine'"
      ></p>
    </div>
  </div>

  <!-- Focus du jour -->
  <div x-show="todayFocus" :class="todayExercises.length > 0 ? 'mb-2.5' : 'mb-8'">
    <h2 class="k-section">Aujourd'hui</h2>
    <p class="text-base text-gray-400 mt-0.5" x-text="todayFocus ? todayFocus.focus : ''"></p>
    <div class="flex flex-wrap gap-1.5 mt-2">
      <template x-for="muscle in (todayFocus ? todayFocus.muscleGroups : [])">
        <span class="k-badge" x-text="muscle"></span>
      </template>
    </div>
  </div>

  <!-- Todo list muscu — exercices du jour -->
  <div x-show="todayExercises.length > 0" class="mb-8">
    <div class="k-list">
      <template x-for="ex in todayExercises" :key="ex.id">
        <div class="k-row !pl-2 !pr-3">
          <button
            type="button"
            @click="toggleExercise(ex.id)"
            class="w-11 h-11 -my-2 flex-shrink-0 flex items-center justify-center rounded-full active:scale-90 transition-transform"
            :aria-pressed="ex.done ? 'true' : 'false'"
            :aria-label="ex.done ? 'Marquer ' + ex.name + ' comme à faire' : 'Marquer ' + ex.name + ' comme fait'"
          >
            <span
              class="w-6 h-6 rounded-full flex items-center justify-center transition-colors duration-300"
              :class="ex.done ? 'bg-kinetic-neon text-gray-950' : 'ring-2 ring-inset ring-gray-500'"
            >
              <svg
                x-show="ex.done"
                class="w-3.5 h-3.5 k-pop"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="3"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M5 12.5l4.5 4.5L19 7.5" />
              </svg>
            </span>
          </button>
          <div class="flex-1 min-w-0">
            <p
              class="text-base truncate transition-colors"
              :class="ex.done ? 'line-through text-gray-500' : 'text-white'"
              x-text="ex.name"
            ></p>
            <p
              class="text-xs text-gray-500 tabular-nums mt-0.5"
              x-text="ex.sets + '×' + ex.targetReps + ' reps · RPE ' + ex.targetRpe"
            ></p>
          </div>
          <button
            type="button"
            @click="startExercise(ex)"
            class="k-pill relative after:absolute after:-inset-1"
            :aria-label="'Démarrer ' + ex.name"
          >
            Démarrer
          </button>
        </div>
      </template>
    </div>

    <!-- Bouton séance rapide -->
    <button type="button" @click="startTodaySession()" class="k-btn mt-4">
      Démarrer la séance du jour
      <svg
        class="w-4 h-4"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.4"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M5 12h14M13 6l6 6-6 6" />
      </svg>
    </button>
  </div>

  <!-- Génération auto de templates -->
  <div x-show="activeProgram" class="bg-kinetic-surface rounded-2xl p-4 mb-8">
    <div class="flex items-start justify-between gap-3">
      <div class="min-w-0">
        <h2 class="k-card-title">Templates auto</h2>
        <p class="text-xs text-gray-500 mt-1">
          Crée un template de séance pour chaque jour d'entraînement.
        </p>
      </div>
      <span
        x-show="generatedCount > 0"
        class="k-badge text-kinetic-teal flex-shrink-0"
        x-text="generatedCount + ' générés'"
      ></span>
    </div>
    <button type="button" @click="generateTemplates()" :disabled="generating" class="k-btn-2 mt-4">
      <svg
        x-show="generating"
        class="w-4 h-4 animate-spin"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.4"
        stroke-linecap="round"
        aria-hidden="true"
      >
        <path d="M12 3a9 9 0 1 0 9 9" />
      </svg>
      <span x-show="!generating">Générer les templates</span>
      <span x-show="generating">Génération en cours…</span>
    </button>
  </div>

  <!-- Choisir un split -->
  <div>
    <h2 class="k-section mb-2.5">
      <span x-show="!activeProgram">Choisir un programme</span>
      <span x-show="activeProgram">Changer de programme</span>
    </h2>
    <p x-show="!activeProgram" class="k-caption !px-0 -mt-1 mb-2.5">
      Choisis un découpage : ta semaine et tes séances du jour s'organisent autour.
    </p>

    <div class="k-list">
      <template x-for="split in availableSplits">
        <button
          type="button"
          @click="selectSplit(split.type)"
          class="k-row !py-3"
          :aria-pressed="(activeProgram ? activeProgram.splitType : null) === split.type ? 'true' : 'false'"
        >
          <span class="flex-1 min-w-0">
            <span
              class="block text-base text-white font-medium truncate"
              x-text="split.name"
            ></span>
            <span
              class="block text-xs text-gray-500 mt-0.5 truncate"
              x-text="split.description"
            ></span>
          </span>
          <span class="flex-shrink-0 text-right">
            <span
              class="block text-sm text-gray-400 tabular-nums"
              x-text="split.daysPerWeek + 'j/sem'"
            ></span>
            <span
              class="block text-xs text-gray-500 first-letter:uppercase"
              x-text="split.goal"
            ></span>
          </span>
          <span class="w-5 flex-shrink-0 flex justify-center">
            <svg
              x-show="(activeProgram ? activeProgram.splitType : null) === split.type"
              class="w-5 h-5 text-white k-pop"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.6"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M5 12.5l4.5 4.5L19 7.5" />
            </svg>
          </span>
        </button>
      </template>
    </div>
  </div>
</div>
