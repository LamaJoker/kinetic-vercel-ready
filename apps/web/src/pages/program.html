<div x-data="program" x-init="init()" class="max-w-md mx-auto px-4 pt-8 pb-8">
  <div class="k-nav">
    <a href="/" class="k-back" aria-label="Retour">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2.4"
          d="M15 19l-7-7 7-7"
        />
      </svg>
    </a>
    <h1 data-large-title class="font-display font-bold text-white">Programme</h1>
  </div>

  <!-- Programme actif — semaine -->
  <div x-show="activeProgram" class="k-hero k-enter mb-8">
    <div class="flex items-center justify-between gap-3">
      <h2
        class="font-display text-xl font-bold text-white truncate"
        x-text="activeProgram ? activeProgram.name : ''"
      ></h2>
      <span
        class="k-badge flex-shrink-0"
        x-text="activeProgram ? (activeProgram.splitType ? activeProgram.splitType.toUpperCase().replace('_', ' ') : '') : ''"
      ></span>
    </div>

    <!-- Semaine visuelle (remplacée par le planning qui s'adapte quand il est chargé) -->
    <div x-show="!weekPlanReady" class="grid grid-cols-7 gap-1.5 mt-4">
      <template x-for="day in weekDays">
        <div class="flex flex-col items-center gap-1.5">
          <span class="text-xs font-medium text-gray-500" x-text="day.short"></span>
          <div
            class="w-full max-w-[2.5rem] aspect-square rounded-full flex items-center justify-center text-sm font-bold transition-colors"
            :class="{
                 'k-on': day.isToday && !day.rest && !day.done,
                 'bg-kinetic-elevated text-white': !day.isToday && !day.rest && !day.done,
                 'bg-kinetic-teal text-kinetic-on-accent': day.done,
                 'text-gray-500': day.rest && !day.done,
               }"
            x-text="day.rest ? '—' : day.focus.charAt(0)"
          ></div>
        </div>
      </template>
    </div>

    <!-- Progression hebdomadaire : anneau façon Fitness -->
    <div class="mt-5 flex items-center gap-4 border-t border-white/10 pt-4">
      <div
        class="k-ring-box h-[4.5rem] w-[4.5rem] text-kinetic-neon"
        role="progressbar"
        aria-label="Séances réalisées cette semaine"
        aria-valuemin="0"
        aria-valuemax="100"
        :aria-valuenow="weekProgressPct"
      >
        <svg class="k-ring" viewBox="0 0 36 36" aria-hidden="true" style="--k-ring-w: 4">
          <circle class="k-ring-track" cx="18" cy="18" r="15" pathLength="100" />
          <circle
            class="k-ring-value"
            cx="18"
            cy="18"
            r="15"
            pathLength="100"
            :style="weekRingStyle"
          />
        </svg>
        <span class="k-stat text-lg" aria-hidden="true"
          ><span x-text="weekProgressPct"></span><span class="k-unit">%</span></span
        >
      </div>
      <div class="min-w-0 flex-1">
        <h2 class="k-card-title">Semaine en cours</h2>
        <p
          class="mt-1 text-base font-semibold text-white tabular-nums"
          x-text="$num.loc(completedTrainingDays + ' / ' + totalTrainingDays + ' séances cette semaine')"
        ></p>
      </div>
    </div>
  </div>

  <!-- Planning de la semaine qui s'adapte (components/week-plan.ts, à la demande) -->
  <div @k-plan-today.window="onPlanToday($event)">
    <template x-if="weekPlanReady">
      <section
        x-data="weekPlan"
        x-show="view"
        style="display: none"
        class="k-card mb-8"
        aria-labelledby="week-plan-title"
      >
        <div class="flex items-baseline justify-between gap-3">
          <h2 id="week-plan-title" class="k-card-title">Planning de la semaine</h2>
          <span
            class="flex-shrink-0 text-xs font-semibold text-gray-400 tabular-nums"
            x-text="$num.loc(summary)"
          ></span>
        </div>
        <p class="mt-0.5 text-xs text-gray-500 truncate" x-text="title + ' · ' + subtitle"></p>
        <ol class="mt-3 grid grid-cols-7 gap-1" aria-label="Jours de la semaine">
          <template x-for="c in cells" :key="c.day">
            <li class="min-w-0">
              <button
                type="button"
                class="flex w-full min-w-0 flex-col items-center gap-1 rounded-xl py-1 active:bg-white/5"
                :aria-label="c.aria + '. Modifier'"
                @click="openDay(c.day)"
              >
                <span class="text-[0.6875rem]" :class="c.dayCls" x-text="c.short"></span>
                <span
                  class="flex aspect-square w-full max-w-[2.25rem] items-center justify-center rounded-full text-sm font-bold"
                  :class="c.cls"
                  x-text="c.mark"
                ></span>
                <span
                  class="w-full truncate text-center text-[0.625rem] leading-tight text-gray-500"
                  x-text="c.name"
                ></span>
              </button>
            </li>
          </template>
        </ol>
        <p class="mt-2 text-xs text-gray-500">
          ✓ faite · ↷ déplacée · touche un jour pour déplacer une séance ou le marquer indisponible.
        </p>
        <template x-for="m in messages" :key="m.text">
          <p class="mt-2.5 flex gap-1.5 text-sm leading-snug text-kinetic-neon">
            <span
              class="w-3 flex-shrink-0 text-center font-bold"
              aria-hidden="true"
              x-text="m.icon"
            ></span
            ><span x-text="m.text"></span>
          </p>
        </template>
        <div x-show="unplaced.length > 0" class="mt-3 flex flex-wrap gap-2">
          <button type="button" class="k-pill" @click="skipUnplaced()">Sauter cette semaine</button>
          <template x-for="it in unplaced" :key="it.key">
            <button
              type="button"
              class="k-pill"
              @click="openItem(it.key)"
              x-text="'Placer ' + it.name"
            ></button>
          </template>
        </div>
        <div x-show="skipped.length > 0" class="mt-3 flex flex-wrap items-center gap-2">
          <span class="text-xs text-gray-500">Sautées :</span>
          <template x-for="it in skipped" :key="it.key">
            <button
              type="button"
              class="k-pill"
              @click="openItem(it.key)"
              x-text="it.name"
            ></button>
          </template>
        </div>

        <!-- Feuille : déplacer / sauter une séance, jour indisponible -->
        <div
          x-show="sheetOpen"
          class="k-backdrop fixed"
          style="display: none"
          @click.self="close()"
          @keydown.escape.window="close()"
        >
          <div class="k-sheet" role="dialog" aria-modal="true" aria-labelledby="plan-sheet-title">
            <h3
              id="plan-sheet-title"
              class="font-display text-xl font-bold text-white text-center"
              x-text="sheetTitle"
            ></h3>
            <p class="mt-1 text-center text-sm text-gray-400" x-text="sheetStatus"></p>
            <div x-show="canEditItem && targets.length > 0" class="mt-4">
              <p class="k-label">Déplacer à</p>
              <div class="mt-1.5 grid grid-cols-4 gap-2" role="group" aria-label="Choisir le jour">
                <template x-for="t in targets" :key="t.day">
                  <button
                    type="button"
                    class="justify-center"
                    :class="targetClass(t)"
                    :aria-pressed="targetPressed(t)"
                    @click="moveTo(t.day)"
                    x-text="t.label"
                  ></button>
                </template>
              </div>
            </div>
            <div class="mt-5 space-y-2">
              <button type="button" x-show="canReset" class="k-btn-2" @click="resetItem()">
                Remettre comme prévu
              </button>
              <button type="button" x-show="canSkip" class="k-btn-2" @click="skipItem()">
                Sauter cette séance cette semaine
              </button>
              <button
                type="button"
                x-show="canToggleDay"
                class="k-btn-2"
                @click="toggleDay()"
                x-text="toggleDayLabel"
              ></button>
              <button type="button" class="k-link mx-auto flex" @click="close()">Fermer</button>
            </div>
          </div>
        </div>
      </section>
    </template>
  </div>

  <!-- Focus du jour -->
  <div x-show="todayFocus" :class="todayExercises.length > 0 ? 'mb-2.5' : 'mb-8'">
    <h2 class="k-section">Aujourd'hui</h2>
    <p
      class="font-display text-2xl font-bold text-white mt-0.5"
      x-text="todayFocus ? todayFocus.focus : ''"
    ></p>
    <div class="flex flex-wrap gap-1.5 mt-2">
      <template x-for="muscle in (todayFocus ? todayFocus.muscleGroups : [])">
        <span class="k-badge" x-text="muscle"></span>
      </template>
    </div>
  </div>

  <!-- Todo list muscu — exercices du jour -->
  <div x-show="todayExercises.length > 0" class="mb-8">
    <div class="k-list k-stagger">
      <template x-for="ex in todayExercises" :key="ex.id">
        <div class="k-row !pl-2 !pr-3">
          <button
            type="button"
            @click="toggleExercise(ex.id)"
            class="w-11 h-11 -my-2 flex-shrink-0 flex items-center justify-center rounded-full active:scale-90 transition-transform"
            :aria-pressed="ex.done ? 'true' : 'false'"
            :aria-label="ex.done ? 'Marquer ' + ex.name + ' comme à faire' : 'Marquer ' + ex.name + ' comme fait'"
          >
            <span
              class="w-7 h-7 rounded-full flex items-center justify-center transition-colors duration-300"
              :class="ex.done ? 'bg-kinetic-neon text-kinetic-on-accent' : 'ring-2 ring-inset ring-gray-500'"
            >
              <svg
                x-show="ex.done"
                class="w-3.5 h-3.5 k-pop"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="3"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M5 12.5l4.5 4.5L19 7.5" />
              </svg>
            </span>
          </button>
          <div class="flex-1 min-w-0">
            <p
              class="text-base font-semibold truncate transition-colors"
              :class="ex.done ? 'line-through text-gray-500' : 'text-white'"
              x-text="ex.name"
            ></p>
            <p
              class="text-xs text-gray-500 tabular-nums mt-0.5"
              x-text="$num.loc(ex.sets + '×' + ex.targetReps + ' reps · RPE ' + ex.targetRpe)"
            ></p>
          </div>
          <button
            type="button"
            @click="startExercise(ex)"
            class="k-pill relative after:absolute after:-inset-1"
            :aria-label="'Démarrer ' + ex.name"
          >
            Démarrer
          </button>
        </div>
      </template>
    </div>

    <!-- Bouton séance rapide -->
    <button type="button" @click="startTodaySession()" class="k-btn-primary mt-4 h-14 text-lg">
      Démarrer la séance du jour
      <svg
        class="w-4 h-4"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.4"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M5 12h14M13 6l6 6-6 6" />
      </svg>
    </button>
  </div>

  <!-- Génération auto de templates -->
  <div x-show="activeProgram" class="k-card mb-8">
    <div class="flex items-start justify-between gap-3">
      <div class="min-w-0">
        <h2 class="k-card-title">Templates auto</h2>
        <p class="text-xs text-gray-500 mt-1">
          Crée un template de séance pour chaque jour d'entraînement.
        </p>
      </div>
      <span
        x-show="generatedCount > 0"
        class="k-badge text-kinetic-teal flex-shrink-0"
        x-text="generatedCount + ' générés'"
      ></span>
    </div>
    <button type="button" @click="generateTemplates()" :disabled="generating" class="k-btn-2 mt-4">
      <svg
        x-show="generating"
        class="w-4 h-4 animate-spin"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.4"
        stroke-linecap="round"
        aria-hidden="true"
      >
        <path d="M12 3a9 9 0 1 0 9 9" />
      </svg>
      <span x-show="!generating">Générer les templates</span>
      <span x-show="generating">Génération en cours…</span>
    </button>
  </div>

  <!-- Choisir un split -->
  <div>
    <h2 class="k-section mb-2.5">
      <span x-show="!activeProgram">Choisir un programme</span>
      <span x-show="activeProgram">Changer de programme</span>
    </h2>
    <p x-show="!activeProgram" class="k-caption !px-0 -mt-1 mb-2.5">
      Choisis un découpage : ta semaine et tes séances du jour s'organisent autour.
    </p>

    <div class="k-list k-stagger">
      <template x-for="split in availableSplits">
        <button
          type="button"
          @click="selectSplit(split.type)"
          class="k-row !py-3.5"
          :aria-pressed="(activeProgram ? activeProgram.splitType : null) === split.type ? 'true' : 'false'"
        >
          <span class="flex-1 min-w-0">
            <span
              class="block text-base text-white font-semibold truncate"
              x-text="split.name"
            ></span>
            <span
              class="block text-xs text-gray-500 mt-0.5 truncate"
              x-text="$num.loc(split.description.replace(', ' + split.daysPerWeek + 'j/sem', ''))"
            ></span>
          </span>
          <span class="flex-shrink-0 text-right">
            <span class="k-stat block text-2xl text-kinetic-neon"
              ><span x-text="split.daysPerWeek"></span><span class="k-unit"> j/sem</span></span
            >
          </span>
          <span x-show="activeProgram" class="w-5 flex-shrink-0 flex justify-center">
            <svg
              x-show="(activeProgram ? activeProgram.splitType : null) === split.type"
              class="w-5 h-5 text-white k-pop"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.6"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M5 12.5l4.5 4.5L19 7.5" />
            </svg>
          </span>
        </button>
      </template>
    </div>
  </div>
</div>
