<div x-data="achievements" x-init="init()" class="max-w-md mx-auto px-4 pt-8 pb-8">
  <div class="k-nav">
    <a href="/" class="k-back" aria-label="Retour">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2.4"
          d="M15 19l-7-7 7-7"
        />
      </svg>
    </a>
    <div class="flex-1">
      <h1 class="font-display font-black text-2xl tracking-tight text-white">Succès</h1>
      <p class="text-xs text-gray-500">
        <span x-text="$store.achievements.unlockedCount"></span> /
        <span x-text="$store.achievements.totalCount"></span> débloqués
      </p>
    </div>
  </div>

  <!-- Progress global -->
  <div class="bg-kinetic-surface rounded-2xl p-4 mb-4 ring-1 ring-white/5">
    <div class="flex items-center justify-between mb-2">
      <span class="text-xs text-gray-500 font-semibold"> Progression globale </span>
      <span
        class="text-sm tabular-nums font-bold text-kinetic-neon"
        x-text="$store.achievements.progressPercent + '%'"
      ></span>
    </div>
    <div class="h-2 bg-kinetic-ink rounded-full overflow-hidden">
      <div
        class="h-full bg-kinetic-neon rounded-full transition-all duration-700"
        :style="'width: ' + $store.achievements.progressPercent + '%'"
      ></div>
    </div>
  </div>

  <!-- Filtres catégorie -->
  <div class="flex gap-2 mb-3 text-xs overflow-x-auto">
    <template x-for="cat in categories" :key="cat.key">
      <button
        @click="filter = cat.key"
        :class="filter === cat.key
              ? 'k-on'
              : 'k-off'"
        class="px-3 py-1.5 rounded-lg transition-all whitespace-nowrap"
        x-text="cat.label"
      ></button>
    </template>
  </div>

  <!-- Liste -->
  <div class="space-y-2">
    <template x-for="ach in filteredCatalog" :key="ach.id">
      <div
        class="rounded-2xl p-3 flex items-center gap-3 ring-1 transition-all"
        :class="$store.achievements.isUnlocked(ach.id)
              ? 'bg-kinetic-surface ring-kinetic-neon/30'
              : 'bg-kinetic-surface ring-white/5 opacity-50'"
      >
        <div
          class="w-10 h-10 shrink-0"
          :class="$store.achievements.isUnlocked(ach.id) ? 'text-kinetic-neon' : 'text-white/10'"
        >
          <svg viewBox="0 0 24 24" class="w-full h-full" aria-hidden="true">
            <circle cx="12" cy="12" r="10.5" fill="currentColor" />
            <circle
              cx="12"
              cy="12"
              r="6.5"
              fill="none"
              stroke="rgb(var(--surface))"
              stroke-opacity="0.35"
              stroke-width="1.2"
            />
            <circle cx="12" cy="12" r="2.6" fill="rgb(var(--surface))" />
          </svg>
        </div>
        <div class="flex-1 min-w-0">
          <p
            class="text-sm font-bold leading-tight"
            :class="$store.achievements.isUnlocked(ach.id) ? 'text-white' : 'text-gray-500'"
            x-text="ach.title"
          ></p>
          <p class="text-[11px] text-gray-500 leading-tight mt-0.5" x-text="ach.description"></p>
        </div>
        <span class="text-xs text-gray-600 font-bold shrink-0">
          <template x-for="i in ach.tier" :key="i">
            <span class="text-kinetic-neon" x-show="$store.achievements.isUnlocked(ach.id)"></span>
          </template>
          <template x-for="i in ach.tier" :key="i">
            <span class="text-gray-700" x-show="!$store.achievements.isUnlocked(ach.id)"></span>
          </template>
        </span>
      </div>
    </template>
  </div>
</div>
