<div x-data="achievements" x-init="init()" class="max-w-md mx-auto px-4 pt-8 pb-8">
  <div class="k-nav">
    <a href="/" class="k-back" aria-label="Retour">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2.4"
          d="M15 19l-7-7 7-7"
        />
      </svg>
    </a>
    <div class="flex-1">
      <h1 data-large-title class="font-display font-bold text-white">Succès</h1>
      <p class="text-gray-500 tabular-nums">
        <span x-text="$store.achievements.unlockedCount"></span> sur
        <span x-text="$num.loc($store.achievements.totalCount)"></span> débloqués
      </p>
    </div>
  </div>

  <!-- Progression globale : anneau héros -->
  <section class="k-hero k-enter mb-6" aria-label="Progression">
    <div class="flex items-center gap-5">
      <div
        class="k-ring-box w-28 h-28 text-kinetic-neon"
        role="progressbar"
        aria-label="Succès débloqués"
        aria-valuemin="0"
        aria-valuemax="100"
        :aria-valuenow="$store.achievements.progressPercent"
      >
        <svg class="k-ring" viewBox="0 0 36 36" aria-hidden="true" style="--k-ring-w: 3.6">
          <circle class="k-ring-track" cx="18" cy="18" r="15.5" pathLength="100" />
          <circle
            class="k-ring-value"
            cx="18"
            cy="18"
            r="15.5"
            pathLength="100"
            :style="ringStyle"
          />
        </svg>
        <span class="k-stat text-[1.75rem]"
          ><span x-text="$store.achievements.progressPercent"></span
          ><span class="k-unit">%</span></span
        >
      </div>
      <div class="flex-1 min-w-0">
        <p class="font-display text-2xl font-bold text-white leading-tight">Progression</p>
        <p class="text-sm text-gray-400 mt-1 leading-snug">Badges gagnés à l'entraînement</p>
      </div>
    </div>
  </section>

  <!-- Défis de la semaine et du mois (components/challenges.ts, chargé à la demande) -->
  <template x-if="challengesReady">
    <section
      x-data="challengesPanel"
      id="defis"
      class="mb-6"
      aria-labelledby="ach-challenges-title"
    >
      <div class="flex items-center justify-between gap-3 mb-2.5">
        <h2 id="ach-challenges-title" class="k-section">Défis</h2>
        <button type="button" class="k-link" @click="openCustom()">Créer un défi</button>
      </div>
      <div x-show="!ready" class="k-skeleton h-24 rounded-2xl" aria-hidden="true"></div>
      <div x-show="ready && progress.length > 0" class="k-list">
        <template x-for="p in progress" :key="p.def.id">
          <div class="k-row" data-k-menu @k-menu="challengeMenu($event.detail, p)">
            <span class="k-ring-box w-12 h-12 flex-shrink-0" :class="tone(p)">
              <svg class="k-ring" viewBox="0 0 36 36" aria-hidden="true" style="--k-ring-w: 4">
                <circle class="k-ring-track" cx="18" cy="18" r="15.5" pathLength="100" />
                <circle
                  class="k-ring-value"
                  cx="18"
                  cy="18"
                  r="15.5"
                  pathLength="100"
                  :style="ringStyle(p)"
                />
              </svg>
              <span class="text-lg leading-none" aria-hidden="true" x-text="p.emoji"></span>
            </span>
            <span class="min-w-0 flex-1">
              <span
                class="block text-base leading-snug font-semibold text-white"
                x-text="p.title"
              ></span>
              <span
                class="mt-0.5 block text-xs leading-snug text-gray-500 tabular-nums"
                x-text="p.progressLabel"
              ></span>
              <span
                class="mt-0.5 block text-xs font-semibold leading-snug"
                :class="statusClass(p)"
                x-text="p.statusLabel"
              ></span>
            </span>
            <span
              class="text-[0.7rem] font-semibold text-gray-500 text-right"
              x-text="originLabel(p)"
            ></span>
            <span class="sr-only" x-text="pct(p)"></span>
          </div>
        </template>
      </div>

      <!-- Défis proposés, adaptés au niveau -->
      <template x-if="ready && suggestions.length > 0">
        <div class="mt-4">
          <h3 class="text-sm font-semibold text-gray-400 mb-2 px-1">À relever</h3>
          <div class="k-list">
            <template x-for="d in suggestions" :key="d.id">
              <div class="k-row">
                <span
                  class="text-2xl w-12 text-center flex-shrink-0"
                  aria-hidden="true"
                  x-text="suggestionEmoji(d)"
                ></span>
                <span
                  class="min-w-0 flex-1 text-[0.9375rem] leading-snug font-medium text-white"
                  x-text="suggestionTitle(d)"
                ></span>
                <button type="button" class="k-pill-accent" @click="accept(d)">Relever</button>
              </div>
            </template>
          </div>
        </div>
      </template>

      <!-- Médailles des défis réussis -->
      <template x-if="ready && completed.length > 0">
        <div class="mt-4">
          <h3 class="text-sm font-semibold text-gray-400 mb-2 px-1">Défis réussis</h3>
          <div class="flex gap-3 overflow-x-auto pb-1 -mx-4 px-4">
            <template x-for="c in completed" :key="c.id">
              <div
                class="k-card flex-shrink-0 w-36 flex flex-col items-center text-center px-3 pt-4 pb-3"
              >
                <span
                  class="k-medal is-unlocked"
                  :data-cat="medalCat(c)"
                  :data-tier="medalTier(c)"
                  aria-hidden="true"
                >
                  <span class="k-medal-face"
                    ><span class="k-medal-emoji" x-text="c.emoji"></span
                  ></span>
                </span>
                <span
                  class="mt-2 block w-full text-sm font-semibold text-white leading-snug line-clamp-3"
                  x-text="c.title"
                ></span>
                <span class="mt-1 block text-xs text-gray-500" x-text="medalDate(c)"></span>
              </div>
            </template>
          </div>
        </div>
      </template>

      <!-- Feuille : défi personnel -->
      <div
        x-show="sheet"
        class="k-backdrop fixed"
        style="display: none"
        @click.self="close()"
        @keydown.escape.window="close()"
      >
        <div
          class="k-sheet"
          role="dialog"
          aria-modal="true"
          aria-labelledby="challenge-sheet-title"
        >
          <h3
            id="challenge-sheet-title"
            class="font-display text-xl font-bold text-white text-center"
          >
            Nouveau défi
          </h3>
          <div class="k-seg mt-4" role="group" aria-label="Période du défi">
            <button
              type="button"
              class="k-seg-item"
              :aria-pressed="periodPressed('week')"
              @click="setPeriod('week')"
            >
              Cette semaine
            </button>
            <button
              type="button"
              class="k-seg-item"
              :aria-pressed="periodPressed('month')"
              @click="setPeriod('month')"
            >
              Ce mois-ci
            </button>
          </div>
          <label for="challenge-metric" class="k-label mt-4">Mesure</label>
          <select id="challenge-metric" x-model="form.metric" class="k-field">
            <template x-for="m in metrics" :key="m.key">
              <option :value="m.key" x-text="m.label" :selected="m.key === form.metric"></option>
            </template>
          </select>
          <div x-show="needsExercise">
            <label for="challenge-exercise" class="k-label mt-4">Exercice</label>
            <select id="challenge-exercise" x-model="form.exerciseId" class="k-field">
              <option value="">Choisir un exercice…</option>
              <template x-for="o in exerciseOptions" :key="o.id">
                <option :value="o.id" x-text="o.name" :selected="o.id === form.exerciseId"></option>
              </template>
            </select>
          </div>
          <label for="challenge-target" class="k-label mt-4">Cible</label>
          <input
            id="challenge-target"
            type="text"
            inputmode="numeric"
            x-model="form.target"
            placeholder="12"
            class="k-field tabular-nums"
          />
          <p class="mt-1.5 text-xs text-gray-500 tabular-nums" x-text="targetHint"></p>
          <p
            x-show="formError"
            x-text="formError"
            class="mt-2 text-sm text-kinetic-electric"
            role="alert"
          ></p>
          <div class="mt-5 space-y-2">
            <button type="button" class="k-btn-primary" @click="saveCustom()">Créer le défi</button>
            <button type="button" class="k-link mx-auto flex" @click="close()">Annuler</button>
          </div>
        </div>
      </div>
    </section>
  </template>

  <!-- Filtres catégorie : contrôle segmenté -->
  <div
    class="k-seg k-seg-scroll mb-3"
    x-chip-scroll
    role="group"
    aria-label="Filtrer par catégorie"
  >
    <template x-for="cat in categories" :key="cat.key">
      <button
        type="button"
        @click="filter = cat.key"
        :aria-pressed="filter === cat.key ? 'true' : 'false'"
        class="k-seg-item"
        x-text="$num.loc(cat.label)"
      ></button>
    </template>
  </div>

  <!-- Grille de médailles -->
  <div class="grid grid-cols-2 gap-3 k-stagger" x-show="filteredCatalog.length > 0">
    <template x-for="ach in filteredCatalog" :key="ach.id">
      <div class="k-card relative flex flex-col items-center text-center px-3 pt-5 pb-4">
        <!-- Médaillon : dégradé de catégorie, anneau de métal selon le rang, reflet ;
             verrouillé = silhouette grisée + cadenas (finitions.css § 6) -->
        <span
          :class="medalClass(ach.id)"
          :data-cat="ach.category"
          :data-tier="ach.tier"
          aria-hidden="true"
        >
          <span class="k-medal-face">
            <span class="k-medal-emoji" x-text="ach.emoji"></span>
          </span>
          <span class="k-medal-lock" x-show="!$store.achievements.isUnlocked(ach.id)">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.6"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M5.5 11h13v9.5h-13zM8 11V7.5a4 4 0 0 1 8 0V11" />
            </svg>
          </span>
        </span>
        <span
          class="mt-3 block w-full text-[0.9375rem] leading-snug line-clamp-2 [text-wrap:balance]"
          :class="$store.achievements.isUnlocked(ach.id) ? 'text-white font-semibold' : 'text-gray-400 font-medium'"
          x-text="ach.title"
        ></span>
        <span
          class="mt-1 block w-full text-xs text-gray-500 leading-snug line-clamp-2"
          x-text="$num.loc(ach.description)"
        ></span>
        <span
          class="sr-only"
          x-text="$store.achievements.isUnlocked(ach.id) ? 'Débloqué' : 'Verrouillé'"
        ></span>
        <!-- Prochain palier de la série : barre + « 32 / 50 séances » -->
        <span class="k-medal-progress" x-show="showProgress(ach.id)">
          <span class="k-medal-bar"><i :style="progressStyle(ach.id)"></i></span>
          <span class="k-medal-progress-label" x-text="progressLabel(ach.id)"></span>
        </span>
        <!-- Difficulté : piste fixe de 5 points (pleins = niveau) -->
        <span
          class="mt-auto pt-3 flex items-center gap-1"
          role="img"
          :aria-label="'Difficulté ' + ach.tier + ' sur 5'"
        >
          <template x-for="i in 5" :key="i">
            <span
              class="w-1.5 h-1.5 rounded-full"
              :class="tierDotClass(ach.id, i, ach.tier)"
            ></span>
          </template>
        </span>
      </div>
    </template>
  </div>

  <div class="k-empty" x-show="filteredCatalog.length === 0">
    <p>Aucun succès ici</p>
    <p class="text-sm text-gray-500 mt-1">Choisis une autre catégorie.</p>
  </div>
</div>
