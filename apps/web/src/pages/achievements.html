<div x-data="achievements" x-init="init()" class="max-w-md mx-auto px-4 pt-8 pb-8">
  <div class="flex items-center gap-3 mb-6">
    <a
      href="/"
      class="p-1.5 -ml-1.5 text-gray-500 hover:text-white transition-colors rounded-lg hover:bg-kinetic-surface"
      aria-label="Retour"
    >
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
      </svg>
    </a>
    <div class="flex-1">
      <h1 class="font-display font-black text-2xl tracking-tight text-white">Achievements</h1>
      <p class="text-xs text-gray-500">
        <span x-text="$store.achievements.unlockedCount"></span> /
        <span x-text="$store.achievements.totalCount"></span> débloqués
      </p>
    </div>
  </div>

  <!-- Progress global -->
  <div class="bg-kinetic-surface rounded-2xl p-4 mb-4 ring-1 ring-white/5">
    <div class="flex items-center justify-between mb-2">
      <span class="text-[10px] uppercase tracking-widest text-gray-500 font-semibold">
        Progression globale
      </span>
      <span
        class="text-sm font-mono font-bold text-kinetic-neon"
        x-text="$store.achievements.progressPercent + '%'"
      ></span>
    </div>
    <div class="h-2 bg-black/40 rounded-full overflow-hidden ring-1 ring-white/5">
      <div
        class="h-full bg-gradient-to-r from-kinetic-neon to-lime-300 rounded-full transition-all duration-700"
        :style="'width: ' + $store.achievements.progressPercent + '%'"
      ></div>
    </div>
  </div>

  <!-- Filtres catégorie -->
  <div class="flex gap-2 mb-3 text-xs overflow-x-auto">
    <template x-for="cat in categories" :key="cat.key">
      <button
        @click="filter = cat.key"
        :class="filter === cat.key
              ? 'bg-kinetic-neon text-gray-950 font-bold'
              : 'bg-kinetic-surface ring-1 ring-white/10 text-gray-400'"
        class="px-3 py-1.5 rounded-lg transition-all whitespace-nowrap"
        x-text="cat.label"
      ></button>
    </template>
  </div>

  <!-- Liste -->
  <div class="space-y-2">
    <template x-for="ach in filteredCatalog" :key="ach.id">
      <div
        class="rounded-2xl p-3 flex items-center gap-3 ring-1 transition-all"
        :class="$store.achievements.isUnlocked(ach.id)
              ? 'bg-kinetic-surface ring-kinetic-neon/30'
              : 'bg-kinetic-surface ring-white/5 opacity-50'"
      >
        <div
          class="w-12 h-12 rounded-xl flex items-center justify-center text-2xl shrink-0"
          :class="$store.achievements.isUnlocked(ach.id)
                ? 'bg-kinetic-neon/15 ring-1 ring-kinetic-neon/30'
                : 'bg-white/5 ring-1 ring-white/10'"
          x-text="ach.emoji"
        ></div>
        <div class="flex-1 min-w-0">
          <p
            class="text-sm font-bold leading-tight"
            :class="$store.achievements.isUnlocked(ach.id) ? 'text-white' : 'text-gray-500'"
            x-text="ach.title"
          ></p>
          <p class="text-[11px] text-gray-500 leading-tight mt-0.5" x-text="ach.description"></p>
        </div>
        <span class="text-[10px] uppercase tracking-widest text-gray-600 font-bold shrink-0">
          <template x-for="i in ach.tier" :key="i">
            <span class="text-kinetic-neon" x-show="$store.achievements.isUnlocked(ach.id)">★</span>
          </template>
          <template x-for="i in ach.tier" :key="i">
            <span class="text-gray-700" x-show="!$store.achievements.isUnlocked(ach.id)">★</span>
          </template>
        </span>
      </div>
    </template>
  </div>
</div>
