<div x-data="programsPage" x-init="init()" class="max-w-md mx-auto px-4 pt-8 pb-8">
  <div class="k-nav">
    <a href="/" class="k-back" aria-label="Retour">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2.4"
          d="M15 19l-7-7 7-7"
        />
      </svg>
    </a>
    <h1 class="font-display font-bold text-white">Programmes</h1>
  </div>

  <!-- Liste catalogue -->
  <template x-if="!selectedProgram">
    <div>
      <p class="k-caption mb-2">
        Des programmes éprouvés et publiés. Tes charges sont calculées à partir de tes 1RM.
      </p>
      <div class="k-list">
        <template x-for="p in catalog" :key="p.id">
          <button type="button" @click="select(p.id)" class="k-row !py-3.5">
            <span class="flex-1 min-w-0">
              <span class="flex items-baseline justify-between gap-3">
                <span class="text-base font-semibold text-white truncate" x-text="p.name"></span>
                <span
                  class="text-[13px] text-gray-500 flex-shrink-0"
                  x-text="$num.loc(levelLabel(p.level))"
                ></span>
              </span>
              <span
                class="text-sm text-gray-400 leading-snug mt-1 line-clamp-2"
                x-text="$num.loc(p.description)"
              ></span>
              <span
                class="block text-xs text-gray-500 mt-1.5 truncate tabular-nums"
                x-text="$num.loc(goalLabel(p.goal) + ' · ' + p.daysPerWeek + ' j/sem · ' + p.durationWeeks + ' sem')"
              ></span>
            </span>
            <svg class="k-chevron" viewBox="0 0 8 14" fill="none" aria-hidden="true">
              <path
                d="m1 1 6 6-6 6"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </template>
      </div>
    </div>
  </template>

  <!-- Détail programme + saisie 1RM -->
  <template x-if="selectedProgram">
    <div>
      <button type="button" @click="back()" class="k-link -ml-1 mb-3 min-h-[2.75rem]">
        <svg
          class="w-4 h-4"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.4"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M15 19l-7-7 7-7" />
        </svg>
        Catalogue
      </button>

      <!-- En-tête du programme -->
      <div class="bg-kinetic-surface rounded-2xl p-4 mb-8">
        <h2 class="font-display text-xl font-bold text-white" x-text="selectedProgram.name"></h2>
        <p
          class="text-sm text-gray-400 leading-snug mt-1.5"
          x-text="$num.loc(selectedProgram.description)"
        ></p>
        <p
          class="text-xs text-gray-500 italic mt-3"
          x-text="'Source : ' + selectedProgram.citation"
        ></p>
      </div>

      <!-- 1RMs -->
      <h3 class="k-section mb-1">Tes 1RM</h3>
      <p class="k-caption !px-0 mb-2.5">
        Remplis seulement les mouvements utilisés par le programme, en kilos.
      </p>
      <div class="k-list mb-8">
        <template x-for="lift in requiredLifts" :key="lift">
          <div class="k-row">
            <label
              :for="'f-programs-' + lift"
              class="text-base text-white flex-shrink-0"
              x-text="$num.loc(liftLabel(lift))"
            ></label>
            <input
              :id="'f-programs-' + lift"
              type="number"
              inputmode="decimal"
              step="2.5"
              min="0"
              :value="oneRms[lift] || ''"
              @input="setOneRm(lift, $event.target.value)"
              class="flex-1 min-w-0 h-11 -my-2.5 bg-transparent text-right text-base text-white tabular-nums placeholder:text-gray-500 focus:outline-none"
              :placeholder="liftLabel(lift) + ' kg'"
            />
          </div>
        </template>
      </div>

      <!-- Semaine courante -->
      <div class="flex items-center justify-between gap-3 mb-1">
        <h3 class="k-section">Semaine</h3>
        <div class="flex items-center gap-2">
          <button
            type="button"
            @click="prevWeek()"
            :disabled="currentWeekIndex === 0"
            class="k-icon-btn text-white disabled:opacity-30 disabled:cursor-not-allowed"
            aria-label="Semaine précédente"
          >
            <svg
              class="w-4 h-4"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.4"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M15 19l-7-7 7-7" />
            </svg>
          </button>
          <span class="min-w-[3.5rem] text-center text-base font-semibold text-white tabular-nums">
            <span x-text="currentWeekIndex + 1"></span>
            <span class="text-gray-500">/</span>
            <span class="text-gray-500" x-text="selectedProgram.weeks.length"></span>
          </span>
          <button
            type="button"
            @click="nextWeek()"
            :disabled="currentWeekIndex === selectedProgram.weeks.length - 1"
            class="k-icon-btn text-white disabled:opacity-30 disabled:cursor-not-allowed"
            aria-label="Semaine suivante"
          >
            <svg
              class="w-4 h-4"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.4"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M9 5l7 7-7 7" />
            </svg>
          </button>
        </div>
      </div>
      <p
        class="text-sm text-gray-500 mb-3"
        x-text="$num.loc(selectedProgram.weeks[currentWeekIndex]?.label)"
      ></p>

      <div class="space-y-3">
        <template x-for="(session, sIdx) in resolvedSessions" :key="sIdx">
          <div class="bg-kinetic-surface rounded-2xl p-4">
            <p class="k-card-title mb-1" x-text="session.name"></p>
            <template x-for="(ex, exIdx) in session.exercises" :key="exIdx">
              <div class="pt-3 mt-3 border-t border-white/10">
                <p
                  class="text-sm font-semibold text-white mb-1.5"
                  x-text="$num.loc(liftLabel(ex.liftRef))"
                ></p>
                <div class="grid grid-cols-3 gap-2 text-xs text-gray-500 pb-1">
                  <span>Série</span><span>Charge</span><span class="text-right">Reps</span>
                </div>
                <template x-for="(set, setIdx) in ex.sets" :key="setIdx">
                  <div class="grid grid-cols-3 gap-2 py-1 text-sm text-white">
                    <span class="text-gray-500 tabular-nums" x-text="setIdx + 1"></span>
                    <span
                      class="tabular-nums font-semibold"
                      x-text="$num.loc(set.weightKg + ' kg')"
                    ></span>
                    <span
                      class="tabular-nums text-right"
                      :class="set.amrap ? 'text-kinetic-electric font-semibold' : ''"
                    >
                      <span x-text="set.reps"></span>
                      <span x-show="set.amrap">+</span>
                    </span>
                  </div>
                </template>
              </div>
            </template>
          </div>
        </template>
      </div>
    </div>
  </template>
</div>
