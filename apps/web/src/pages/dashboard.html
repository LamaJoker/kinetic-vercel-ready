<div x-data="dashboard" x-init="init()"
     class="max-w-md mx-auto px-4 pt-5 pb-8 animate-fade-in">

  <!-- En-tête -->
  <div class="flex items-start justify-between mb-5">
    <div>
      <div class="flex items-center gap-1.5 mb-1">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"
             style="color: var(--k-p); filter: drop-shadow(0 0 6px var(--k-p-glow));">
          <path d="M13 2L4 14H10L11 22L20 10H14L13 2Z"/>
        </svg>
        <span class="font-display-v2 font-bold"
              style="font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--k-tx3);">KINETIC</span>
      </div>
      <h1 class="font-display-v2 font-bold" style="font-size: 25px; letter-spacing: -0.025em; line-height: 1.15; color: var(--k-tx);">
        <span x-text="greeting"></span>,<br/>
        <span style="color: var(--k-p); filter: drop-shadow(0 0 14px var(--k-p-glow));"
              x-text="($store.auth.user?.full_name?.split(' ')[0] ?? $store.auth.user?.email?.split('@')[0] ?? '') + ' ⚡'"></span>
      </h1>
      <p style="font-size: 12px; color: var(--k-tx3); margin-top: 4px;" x-text="todayLabel"></p>
    </div>
    <a href="/profile" class="relative select-none mt-1">
      <div class="w-11 h-11 rounded-full flex items-center justify-center font-display-v2 font-bold"
           style="font-size: 16px; color: #07070B; background: linear-gradient(135deg, var(--k-p) 0%, var(--k-p-dim) 100%); box-shadow: 0 0 20px var(--k-p-glow);"
           x-text="$store.auth.initials"></div>
      <div class="absolute -bottom-0.5 -right-0.5 w-[18px] h-[18px] rounded-full flex items-center justify-center"
           style="background: var(--k-e); box-shadow: 0 0 8px var(--k-e-glow); border: 2px solid var(--k-void);">
        <svg width="9" height="9" viewBox="0 0 24 24" fill="#07070B"><path d="M13 2L4 14H10L11 22L20 10H14L13 2Z"/></svg>
      </div>
    </a>
  </div>

  <div class="flex flex-col gap-3">

    <!-- XP Bar -->
    <div class="k-card p-[18px] animate-slide-up" style="animation-delay: .04s;">
      <div class="flex items-center justify-between mb-2.5">
        <div class="flex items-center gap-2">
          <span class="font-display-v2 font-bold" style="font-size: 9px; letter-spacing: .12em; text-transform: uppercase; color: var(--k-tx3);">Niveau</span>
          <span class="font-display-v2 font-bold" style="font-size: 28px; line-height: 1; color: var(--k-p); filter: drop-shadow(0 0 10px var(--k-p-glow));"
                x-text="$store.xp.currentLevel"></span>
          <span style="font-size: 12px; color: var(--k-tx2); font-weight: 500;" x-text="$store.xp.title"></span>
        </div>
        <span class="font-display-v2 font-bold" style="font-size: 13px; color: var(--k-tx);"
              x-text="$store.xp.xp.toLocaleString() + ' XP'"></span>
      </div>
      <div class="bar-track" style="height: 7px;">
        <div class="bar-fill" :style="`width: ${$store.xp.progressPercent}%`"></div>
      </div>
      <div class="flex justify-between mt-1.5">
        <span class="font-display-v2 font-bold" style="font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: var(--k-tx3);"
              x-text="`LV.${$store.xp.currentLevel}`"></span>
        <span style="font-size: 11px; color: var(--k-tx3);"
              x-show="!$store.xp.isMaxLevel"
              x-text="`${$store.xp.remaining} XP → LV.${$store.xp.currentLevel + 1}`"></span>
        <span style="font-size: 11px; color: var(--k-e); font-weight: 600;"
              x-show="$store.xp.isMaxLevel">🏆 MAX</span>
      </div>
    </div>

    <!-- Quick actions -->
    <div class="grid grid-cols-4 gap-2 animate-slide-up" style="animation-delay: .07s;">
      <a href="/seances"
         class="flex flex-col items-center gap-1.5 p-2.5 rounded-[14px] transition-all"
         style="background: var(--k-surface); border: 1px solid var(--k-line);"
         onmouseover="this.style.borderColor='var(--k-line-hi)'"
         onmouseout="this.style.borderColor='var(--k-line)'">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--k-p);">
          <path d="M6 7h2m8 0h2M5 9v6a2 2 0 002 2h1v2h2v-2h4v2h2v-2h1a2 2 0 002-2V9M8 7V5a1 1 0 011-1h6a1 1 0 011 1v2"/>
        </svg>
        <span class="font-display-v2 font-semibold" style="font-size: 10px; color: var(--k-tx3);">Séances</span>
      </a>
      <a href="/progression"
         class="flex flex-col items-center gap-1.5 p-2.5 rounded-[14px] transition-all"
         style="background: var(--k-surface); border: 1px solid var(--k-line);"
         onmouseover="this.style.borderColor='var(--k-line-hi)'"
         onmouseout="this.style.borderColor='var(--k-line)'">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--k-p);">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
        </svg>
        <span class="font-display-v2 font-semibold" style="font-size: 10px; color: var(--k-tx3);">Progrès</span>
      </a>
      <a href="/nutrition"
         class="flex flex-col items-center gap-1.5 p-2.5 rounded-[14px] transition-all"
         style="background: var(--k-surface); border: 1px solid var(--k-line);"
         onmouseover="this.style.borderColor='var(--k-line-hi)'"
         onmouseout="this.style.borderColor='var(--k-line)'">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--k-p);">
          <path d="M12 2a7 7 0 017 7c0 5-7 13-7 13S5 14 5 9a7 7 0 017-7z"/><circle cx="12" cy="9" r="2.5"/>
        </svg>
        <span class="font-display-v2 font-semibold" style="font-size: 10px; color: var(--k-tx3);">Nutrition</span>
      </a>
      <a href="/bodyweight"
         class="flex flex-col items-center gap-1.5 p-2.5 rounded-[14px] transition-all"
         style="background: var(--k-surface); border: 1px solid var(--k-line);"
         onmouseover="this.style.borderColor='var(--k-line-hi)'"
         onmouseout="this.style.borderColor='var(--k-line)'">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--k-tx3);">
          <rect x="2" y="7" width="20" height="14" rx="3"/><path d="M16 7V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v2"/><line x1="12" y1="12" x2="12" y2="16"/><line x1="10" y1="14" x2="14" y2="14"/>
        </svg>
        <span class="font-display-v2 font-semibold" style="font-size: 10px; color: var(--k-tx3);">Corps</span>
      </a>
    </div>

    <!-- Stats Streak / Record -->
    <div class="grid grid-cols-2 gap-3 animate-slide-up" style="animation-delay: .12s;">
      <!-- Streak -->
      <div class="k-card p-4 relative overflow-hidden">
        <div class="absolute -top-5 -right-5 w-16 h-16 rounded-full"
             style="background: var(--k-e); filter: blur(28px); opacity: .25;"></div>
        <p class="font-display-v2 font-semibold mb-1.5"
           style="font-size: 9px; letter-spacing: .12em; text-transform: uppercase; color: var(--k-tx3);">Streak</p>
        <div class="flex items-center gap-1.5">
          <span class="font-display-v2 font-bold" style="font-size: 40px; line-height: 1; color: var(--k-e);"
                x-text="streak"></span>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" style="color: var(--k-e);">
            <path d="M12 2C12 2 8 6 8 10C8 12.5 9.5 14.5 11 15.5C11 13.5 12.5 12 14 11C13 13 13.5 15 13 17C14 16 15 14.5 15 13C15 16 13 19 12 22C16 20.5 18 17 18 14C18 10.5 15 8 15 8C15 9 14.5 10 14 10.5C14 7.5 12 2 12 2Z"/>
          </svg>
        </div>
        <p style="font-size: 10px; color: var(--k-tx3); margin-top: 5px;">record :
          <span x-text="bestStreak"></span> j
        </p>
      </div>
      <!-- Semaine -->
      <div class="k-card p-4">
        <p class="font-display-v2 font-semibold mb-1.5"
           style="font-size: 9px; letter-spacing: .12em; text-transform: uppercase; color: var(--k-tx3);">Cette semaine</p>
        <p class="font-display-v2 font-bold" style="font-size: 32px; line-height: 1; color: var(--k-p);">
          <span x-text="$store.goals.doneSessions"></span>
          <span style="font-size: 14px; font-weight: 600; color: var(--k-tx3);">
            /<span x-text="$store.goals.targetSessions"></span>
          </span>
        </p>
        <p style="font-size: 10px; color: var(--k-tx3); margin-top: 5px;">séances planifiées</p>
      </div>
    </div>

    <!-- Objectifs semaine -->
    <div x-show="!$store.goals.loading"
         x-data="{ editing: false }"
         class="k-card p-[18px] animate-slide-up"
         style="animation-delay: .16s;">
      <div class="flex items-center justify-between mb-3.5">
        <h2 class="font-display-v2 font-bold" style="font-size: 15px; letter-spacing: -0.01em; color: var(--k-tx);">Objectifs semaine</h2>
        <div class="flex items-center gap-2">
          <span x-show="$store.goals.allOk && !editing"
                class="pill pill-p">✓ Atteints</span>
          <button type="button" @click="editing = !editing"
                  class="p-1.5 rounded-lg transition-colors"
                  style="color: var(--k-tx3);"
                  :aria-label="editing ? 'Fermer' : 'Régler les objectifs'">
            <svg x-show="!editing" width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
              <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/>
            </svg>
            <svg x-show="editing" width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Edit form -->
      <div x-show="editing" x-transition class="grid grid-cols-2 gap-2 mb-3">
        <div>
          <label class="font-display-v2 font-semibold block mb-1"
                 style="font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--k-tx3);">Séances</label>
          <input type="number" min="1" max="14" step="1"
                 x-model.number="$store.goals.targetSessions"
                 @change="$store.goals.save(); $store.goals.reload()"
                 class="w-full rounded-lg px-2.5 py-1.5 text-sm outline-none"
                 style="background: var(--k-void); border: 1px solid var(--k-line); color: var(--k-tx);"/>
        </div>
        <div>
          <label class="font-display-v2 font-semibold block mb-1"
                 style="font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--k-tx3);">Tonnage (kg)</label>
          <input type="number" min="0" step="100"
                 x-model.number="$store.goals.targetTonnageKg"
                 @change="$store.goals.save(); $store.goals.reload()"
                 placeholder="0 = aucun"
                 class="w-full rounded-lg px-2.5 py-1.5 text-sm outline-none"
                 style="background: var(--k-void); border: 1px solid var(--k-line); color: var(--k-tx);"/>
        </div>
      </div>

      <!-- Barre séances -->
      <div class="mb-3">
        <div class="flex justify-between mb-1.5">
          <span style="font-size: 12px; color: var(--k-tx3);">Séances</span>
          <span class="font-display-v2 font-bold" style="font-size: 12px;"
                :style="$store.goals.sessionsOk ? 'color: var(--k-p)' : 'color: var(--k-tx2)'"
                x-text="$store.goals.doneSessions + ' / ' + $store.goals.targetSessions"></span>
        </div>
        <div class="bar-track" style="height: 6px;">
          <div class="bar-fill" :class="$store.goals.sessionsOk ? '' : 'bar-fill-e'"
               :style="`width: ${$store.goals.sessionsPercent}%`"></div>
        </div>
      </div>

      <!-- Barre tonnage -->
      <div x-show="$store.goals.targetTonnageKg > 0">
        <div class="flex justify-between mb-1.5">
          <span style="font-size: 12px; color: var(--k-tx3);">Tonnage</span>
          <span class="font-display-v2 font-bold" style="font-size: 12px;"
                :style="$store.goals.tonnageOk ? 'color: var(--k-p)' : 'color: var(--k-tx2)'"
                x-text="$store.goals.doneTonnageKg + ' / ' + $store.goals.targetTonnageKg + ' kg'"></span>
        </div>
        <div class="bar-track" style="height: 6px;">
          <div class="bar-fill" :class="$store.goals.tonnageOk ? '' : 'bar-fill-e'"
               :style="`width: ${$store.goals.tonnagePercent}%`"></div>
        </div>
      </div>

      <!-- Activité 7 jours -->
      <div class="flex gap-1.5 mt-4">
        <template x-for="(day, i) in activityDays" :key="i">
          <div class="flex-1 flex flex-col items-center gap-1.5">
            <div class="w-full h-7 rounded-lg transition-all"
                 :style="day.active
                   ? 'background: linear-gradient(180deg, var(--k-p) 0%, var(--k-p-dim) 100%); box-shadow: 0 0 12px var(--k-p-glow);'
                   : 'background: rgba(255,255,255,0.05); border: 1px solid var(--k-line);'"
                 :title="day.label"></div>
            <span class="font-display-v2 font-semibold"
                  style="font-size: 9px; text-transform: uppercase; letter-spacing: .06em; color: var(--k-tx3);"
                  x-text="day.short"></span>
          </div>
        </template>
      </div>
    </div>

    <!-- Routine vitalité -->
    <div class="k-card p-[18px] animate-slide-up" style="animation-delay: .20s;">
      <div class="flex items-center justify-between mb-3">
        <h2 class="font-display-v2 font-bold" style="font-size: 15px; letter-spacing: -0.01em; color: var(--k-tx);">Routine vitalité</h2>
        <span class="pill pill-p"
              x-text="`${$store.vitalite.doneCount}/${$store.vitalite.totalCount}`"></span>
      </div>

      <!-- Grille vitalité 2×2 -->
      <div class="grid grid-cols-2 gap-2 mb-3">
        <template x-for="task in $store.vitalite.tasks.slice(0,4)" :key="task.id">
          <div class="flex items-center gap-2 px-3 py-2.5 rounded-[13px] transition-all"
               :style="task.done
                 ? 'background: rgba(168,255,26,0.1); border: 1px solid rgba(168,255,26,0.25);'
                 : 'background: var(--k-elevated); border: 1px solid var(--k-line);'">
            <span style="font-size: 18px;" x-text="task.icon"></span>
            <div class="flex-1 min-w-0">
              <p class="font-semibold truncate"
                 :style="task.done ? 'font-size:11px; color: var(--k-p);' : 'font-size:11px; color: var(--k-tx2);'"
                 x-text="task.title"></p>
            </div>
            <svg x-show="task.done" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="color: var(--k-p); flex-shrink: 0;">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
          </div>
        </template>
      </div>

      <div x-show="$store.vitalite.allDone"
           x-transition
           class="text-center py-2 font-semibold text-sm"
           style="color: var(--k-p);">
        ⚡ Routine complète — excellent travail !
      </div>

      <a href="/vitalite"
         x-show="!$store.vitalite.allDone"
         class="block text-center py-2.5 rounded-xl font-display-v2 font-semibold text-sm transition-all"
         style="border: 1px dashed rgba(168,255,26,0.3); color: var(--k-p);"
         onmouseover="this.style.background='rgba(168,255,26,0.05)'"
         onmouseout="this.style.background='transparent'">
        Continuer la routine →
      </a>
    </div>

  </div>

</div>

<!-- Level-up overlay -->
<div x-data="{ show: false, level: 0, title: '' }"
     @kinetic:levelup.window="level = $event.detail.level; title = $event.detail.title; show = true; setTimeout(() => show = false, 4500)"
     x-show="show"
     x-transition:enter="transition ease-out duration-300"
     x-transition:enter-start="opacity-0 scale-90"
     x-transition:enter-end="opacity-100 scale-100"
     x-transition:leave="transition ease-in duration-200"
     x-transition:leave-start="opacity-100 scale-100"
     x-transition:leave-end="opacity-0 scale-90"
     class="fixed inset-0 z-50 flex items-center justify-center pointer-events-none px-6">
  <div class="rounded-[32px] p-9 text-center max-w-xs w-full animate-pr-bounce"
       style="background: linear-gradient(135deg, var(--k-p), oklch(70% 0.2 145)); color: #07070B; box-shadow: 0 0 80px var(--k-p-glow);">
    <div class="text-6xl mb-4 animate-float">🎉</div>
    <p class="font-display-v2 font-bold" style="font-size: 13px; opacity: .7; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 8px;">Level Up !</p>
    <p class="font-display-v2 font-bold" style="font-size: 48px; line-height: 1; margin-bottom: 4px;">LV.<span x-text="level"></span></p>
    <template x-if="title">
      <div class="mt-4 rounded-2xl px-4 py-3" style="background: rgba(0,0,0,.15);">
        <p class="font-display-v2 font-bold" style="font-size: 10px; opacity: .7; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 4px;">Récompense débloquée</p>
        <p class="font-display-v2 font-bold" style="font-size: 17px;" x-text="title"></p>
      </div>
    </template>
  </div>
</div>

<!-- Rewards modal -->
<div x-show="$store.rewards.showRewardModal"
     @click.self="$store.rewards.dismissModal()"
     x-transition:enter="transition ease-out duration-200"
     x-transition:enter-start="opacity-0"
     x-transition:enter-end="opacity-100"
     class="fixed inset-0 z-[60] flex items-end justify-center px-4 pb-4">
  <div class="absolute inset-0" style="background: rgba(7,7,11,.85);"></div>
  <div class="relative k-card p-6 max-w-sm w-full shadow-2xl">
    <div class="absolute top-0 left-0 right-0 h-px"
         style="background: linear-gradient(90deg, transparent, var(--k-p), transparent);"></div>
    <div class="flex items-start gap-4 mb-5">
      <div class="text-5xl leading-none" x-text="$store.rewards.pendingReward?.emoji ?? '🎁'"></div>
      <div>
        <p class="font-display-v2 font-bold mb-0.5"
           style="font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--k-p);">
          Niveau <span x-text="$store.rewards.pendingLevel"></span> débloqué !
        </p>
        <h3 class="font-display-v2 font-bold text-xl" style="color: var(--k-tx);"
            x-text="$store.rewards.pendingReward?.title"></h3>
        <p class="text-sm mt-1" style="color: var(--k-tx3);"
           x-text="$store.rewards.pendingReward?.description"></p>
      </div>
    </div>
    <button @click="$store.rewards.dismissModal()"
            class="btn-p w-full py-3 text-sm">
      Super, merci ! ⚡
    </button>
  </div>
</div>
