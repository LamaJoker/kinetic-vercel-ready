<div x-data="dashboard" x-init="init()" class="max-w-md mx-auto px-4 pt-6 pb-8">
  <!-- En-tête : date en légende, grand titre, avatar -->
  <div class="flex items-end justify-between gap-3 mb-5">
    <div class="min-w-0">
      <p
        class="text-xs font-semibold uppercase tracking-[0.08em] text-gray-500"
        x-text="$num.loc(todayLabel)"
      ></p>
      <h1
        class="font-display font-bold text-[2.125rem] leading-tight tracking-tight text-white truncate"
        x-text="greeting"
      ></h1>
    </div>
    <a
      href="/profile"
      class="k-press flex-shrink-0 mb-1 w-10 h-10 rounded-full bg-gradient-to-br from-kinetic-neon to-kinetic-electric p-[2px] select-none"
    >
      <span
        class="w-full h-full rounded-full bg-kinetic-surface flex items-center justify-center text-white font-semibold text-xs"
        x-text="$store.auth.initials"
      ></span>
    </a>
  </div>

  <!-- Séance du jour : l'action principale de l'app (carte héros) -->
  <!-- Pas d'aria-labelledby : le titre vit dans un <template x-if> et n'existe
       pas pendant le chargement, ce que axe signale (aria-prohibited-attr). -->
  <section class="k-hero mb-3 pt-6" aria-label="Séance du jour">
    <!-- Haltère décoratif en filigrane -->
    <svg
      class="absolute -right-6 -top-5 w-40 h-40 -rotate-12 text-white opacity-[0.06] pointer-events-none"
      fill="none"
      stroke="currentColor"
      viewBox="0 0 24 24"
      stroke-width="1.6"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11" />
    </svg>
    <template x-if="training && training.next">
      <div>
        <p
          class="inline-flex items-center gap-1.5 text-xs font-bold uppercase tracking-[0.08em] text-kinetic-neon"
        >
          <span class="w-1.5 h-1.5 rounded-full bg-kinetic-neon" aria-hidden="true"></span>
          <span x-show="training.totalSessions === 0">Ta première séance</span>
          <span x-show="training.totalSessions > 0 && training.daysSinceLast === 0">
            Déjà entraîné aujourd'hui — prochaine séance
          </span>
          <span x-show="training.totalSessions > 0 && training.daysSinceLast !== 0">
            Séance du jour
          </span>
        </p>
        <h2
          id="today-session-title"
          class="font-display font-bold text-[2.25rem] leading-[1.1] tracking-tight text-white mt-2 break-words"
          x-text="training.next.name"
        ></h2>
        <p class="text-[0.9375rem] text-gray-400 mt-1" x-text="$num.loc(nextDetail)"></p>

        <button
          type="button"
          @click="startNextSession()"
          class="k-btn-primary mt-6 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-kinetic-neon"
        >
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path
              d="M7 4.8v14.4a1 1 0 0 0 1.5.86l12-7.2a1 1 0 0 0 0-1.72l-12-7.2A1 1 0 0 0 7 4.8Z"
            />
          </svg>
          Commencer la séance
        </button>
        <a
          href="/seances"
          class="block text-center text-sm font-semibold text-kinetic-neon mt-1.5 -mb-2 py-2.5 active:opacity-60"
        >
          Choisir une autre séance
        </a>
      </div>
    </template>

    <template x-if="!training">
      <div class="animate-pulse" aria-hidden="true">
        <div class="h-3 w-24 bg-white/10 rounded"></div>
        <div class="h-9 w-44 bg-white/10 rounded mt-3"></div>
        <div class="h-4 w-32 bg-white/10 rounded mt-2"></div>
        <div class="h-[3.125rem] w-full bg-white/10 rounded-[14px] mt-6"></div>
      </div>
    </template>
  </section>

  <!-- Cette semaine : anneaux façon Apple Fitness + jours -->
  <template x-if="training">
    <section class="k-card p-5 mb-3" aria-label="Cette semaine">
      <h2 class="k-card-title mb-4">Cette semaine</h2>
      <div class="flex items-center gap-5">
        <div class="k-ring-box w-[7.75rem] h-[7.75rem]">
          <svg class="k-ring" viewBox="0 0 36 36" aria-hidden="true">
            <g class="text-kinetic-neon">
              <circle class="k-ring-track" cx="18" cy="18" r="15.5" pathLength="100" />
              <circle
                class="k-ring-value"
                cx="18"
                cy="18"
                r="15.5"
                pathLength="100"
                :style="weekRingStyle"
              />
            </g>
            <g class="text-kinetic-teal">
              <circle class="k-ring-track" cx="18" cy="18" r="11.5" pathLength="100" />
              <circle
                class="k-ring-value"
                cx="18"
                cy="18"
                r="11.5"
                pathLength="100"
                :style="recoveryRingStyle"
              />
            </g>
            <g class="text-kinetic-purple">
              <circle class="k-ring-track" cx="18" cy="18" r="7.5" pathLength="100" />
              <circle
                class="k-ring-value"
                cx="18"
                cy="18"
                r="7.5"
                pathLength="100"
                :style="xpRingStyle"
              />
            </g>
          </svg>
        </div>
        <dl class="flex-1 min-w-0 space-y-2.5">
          <div>
            <dt class="text-xs font-semibold text-gray-400">Séances</dt>
            <dd class="k-stat text-[1.625rem] text-kinetic-neon">
              <span x-text="weekCount"></span><span class="k-unit" x-text="weekTargetLabel"></span>
            </dd>
          </div>
          <div>
            <dt class="text-xs font-semibold text-gray-400">Récup du jour</dt>
            <dd class="k-stat text-[1.625rem] text-kinetic-teal">
              <span x-text="$store.vitalite.doneCount"></span
              ><span class="k-unit" x-text="'/' + $store.vitalite.totalCount"></span>
            </dd>
          </div>
          <div>
            <dt class="text-xs font-semibold text-gray-400">XP du niveau</dt>
            <dd class="k-stat text-[1.625rem] text-kinetic-purple">
              <span x-text="$store.xp.progressPercent"></span><span class="k-unit">%</span>
            </dd>
          </div>
        </dl>
      </div>

      <div class="mt-5 pt-4 border-t border-white/10">
        <ol class="grid grid-cols-7 gap-2" aria-label="Jours entraînés cette semaine">
          <template x-for="day in training.week.days" :key="day.iso">
            <li
              class="aspect-square rounded-full flex items-center justify-center text-xs transition-colors"
              :class="weekDayClass(day)"
              :aria-label="day.iso + (day.trained ? ' : entraîné' : '')"
              x-text="$num.loc(day.label)"
            ></li>
          </template>
        </ol>
        <p
          x-show="training.last"
          class="text-xs text-gray-500 mt-3.5"
          x-text="$num.loc('Dernière séance · ' + lastDetail)"
        ></p>
      </div>
    </section>
  </template>

  <!-- Série : deux tuiles -->
  <div class="grid grid-cols-2 gap-3 mb-3">
    <div class="k-card">
      <div class="flex items-center gap-2">
        <span
          class="w-7 h-7 rounded-full bg-kinetic-electric/15 text-kinetic-electric flex items-center justify-center flex-shrink-0"
          aria-hidden="true"
        >
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M12.6 2.2a.75.75 0 0 0-1.2.4c-.5 2.5-1.9 4-3.3 5.5C6.5 9.8 5 11.4 5 14.2A7 7 0 0 0 12 21a7 7 0 0 0 7-6.8c0-2.4-1-4.6-2.6-6.1a.75.75 0 0 0-1.25.45c-.15 1-.6 1.8-1.3 2.3.3-3-.6-6.2-2.25-8.65Z"
            />
          </svg>
        </span>
        <p class="text-xs font-semibold text-gray-400">Série en cours</p>
      </div>
      <p class="k-stat mt-3"><span x-text="streak"></span><span class="k-unit">jours</span></p>
    </div>
    <div class="k-card">
      <div class="flex items-center gap-2">
        <span
          class="w-7 h-7 rounded-full bg-kinetic-gold/15 text-kinetic-gold flex items-center justify-center flex-shrink-0"
          aria-hidden="true"
        >
          <svg
            class="w-4 h-4"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M7 4h10v5a5 5 0 0 1-10 0V4ZM7 6H4.5v1.5A3.5 3.5 0 0 0 8 11M17 6h2.5v1.5A3.5 3.5 0 0 1 16 11M12 14v4M8.5 20h7"
            />
          </svg>
        </span>
        <p class="text-xs font-semibold text-gray-400">Meilleure série</p>
      </div>
      <p class="k-stat mt-3">
        <span x-text="$num.loc(bestStreak + '')"></span><span class="k-unit">jours</span>
      </p>
    </div>
  </div>

  <!-- Raccourcis : tuiles avec icône dans une pastille colorée -->
  <div class="grid grid-cols-3 gap-3 mb-3">
    <a href="/progression" class="k-card k-press flex flex-col gap-3 p-3 min-h-[6.75rem]">
      <span
        class="w-10 h-10 rounded-[12px] bg-kinetic-purple/15 text-kinetic-purple flex items-center justify-center"
        aria-hidden="true"
      >
        <svg
          class="w-[22px] h-[22px]"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
          stroke-width="2.2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M3 17l6-6 4 4 8-8M14 7h7v7" />
        </svg>
      </span>
      <span
        class="mt-auto block text-[0.8125rem] font-semibold text-white leading-tight line-clamp-2 break-words"
        x-text="'Progression'"
      ></span>
    </a>
    <a href="/records" class="k-card k-press flex flex-col gap-3 p-3 min-h-[6.75rem]">
      <span
        class="w-10 h-10 rounded-[12px] bg-kinetic-gold/15 text-kinetic-gold flex items-center justify-center"
        aria-hidden="true"
      >
        <svg
          class="w-[22px] h-[22px]"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
          stroke-width="2.2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M7 4h10v5a5 5 0 0 1-10 0V4ZM7 6H4.5v1.5A3.5 3.5 0 0 0 8 11M17 6h2.5v1.5A3.5 3.5 0 0 1 16 11M12 14v4M8.5 20h7"
          />
        </svg>
      </span>
      <span
        class="mt-auto block text-[0.8125rem] font-semibold text-white leading-tight line-clamp-2 break-words"
        x-text="'Records'"
      ></span>
    </a>
    <a href="/nutrition" class="k-card k-press flex flex-col gap-3 p-3 min-h-[6.75rem]">
      <span
        class="w-10 h-10 rounded-[12px] bg-kinetic-teal/15 text-kinetic-teal flex items-center justify-center"
        aria-hidden="true"
      >
        <svg
          class="w-[22px] h-[22px]"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
          stroke-width="2.2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10ZM2 21c0-3 1.85-5.36 5.08-6"
          />
        </svg>
      </span>
      <span
        class="mt-auto block text-[0.8125rem] font-semibold text-white leading-tight line-clamp-2 break-words"
        >Nutrition</span
      >
    </a>
    <a href="/bodyweight" class="k-card k-press flex flex-col gap-3 p-3 min-h-[6.75rem]">
      <span
        class="w-10 h-10 rounded-[12px] bg-kinetic-coral/15 text-kinetic-coral flex items-center justify-center"
        aria-hidden="true"
      >
        <svg
          class="w-[22px] h-[22px]"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
          stroke-width="2.2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="3.5" y="3.5" width="17" height="17" rx="5" />
          <path d="M8.3 10a5.2 5.2 0 0 1 7.4 0" />
          <path d="m12 8.8 1.4 2.9" />
        </svg>
      </span>
      <span
        class="mt-auto block text-[0.8125rem] font-semibold text-white leading-tight line-clamp-2 break-words"
        x-text="'Poids'"
      ></span>
    </a>
    <a href="/plates" class="k-card k-press flex flex-col gap-3 p-3 min-h-[6.75rem]">
      <span
        class="w-10 h-10 rounded-[12px] bg-white/10 text-white flex items-center justify-center"
        aria-hidden="true"
      >
        <svg
          class="w-[22px] h-[22px]"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
          stroke-width="2.2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="12" r="8.5" />
          <circle cx="12" cy="12" r="2.5" />
          <path d="M12 3.5v2M12 18.5v2" />
        </svg>
      </span>
      <span
        class="mt-auto block text-[0.8125rem] font-semibold text-white leading-tight line-clamp-2 break-words"
        x-text="'Chargement de barre'"
      ></span>
    </a>
    <a href="/achievements" class="k-card k-press flex flex-col gap-3 p-3 min-h-[6.75rem]">
      <span
        class="w-10 h-10 rounded-[12px] bg-kinetic-neon/15 text-kinetic-neon flex items-center justify-center"
        aria-hidden="true"
      >
        <svg
          class="w-[22px] h-[22px]"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
          stroke-width="2.2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="9" r="5.5" />
          <path d="m8.5 13.5-1.5 7 5-2.5 5 2.5-1.5-7" />
        </svg>
      </span>
      <span class="mt-auto min-w-0">
        <span
          class="block text-[0.8125rem] font-semibold text-white leading-tight line-clamp-2 break-words"
          x-text="'Succès'"
        ></span>
        <span class="block text-xs text-gray-500 truncate tabular-nums">
          <span x-text="$store.achievements ? $store.achievements.unlockedCount : 0"></span>/<span
            x-text="$num.loc($store.achievements ? $store.achievements.totalCount : 0)"
          ></span>
        </span>
      </span>
    </a>
  </div>

  <!-- Routine récupération -->
  <a href="/vitalite" class="k-card k-press block mb-3">
    <div class="flex items-center justify-between gap-3 mb-3">
      <div class="flex items-center gap-2.5 min-w-0">
        <span
          class="w-8 h-8 rounded-[10px] bg-kinetic-teal/15 text-kinetic-teal flex items-center justify-center flex-shrink-0"
          aria-hidden="true"
        >
          <svg class="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M12 20.6c-.2 0-.4-.07-.56-.2C6.2 16.1 3 13.3 3 9.4 3 6.9 4.9 5 7.3 5c1.9 0 3.2 1 4.7 2.7C13.5 6 14.8 5 16.7 5 19.1 5 21 6.9 21 9.4c0 3.9-3.2 6.7-8.44 11a.9.9 0 0 1-.56.2Z"
            />
          </svg>
        </span>
        <h2 class="k-card-title">Récupération</h2>
      </div>
      <span class="flex items-center gap-2 text-sm font-semibold text-gray-400 tabular-nums">
        <span
          x-text="$num.loc($store.vitalite.doneCount + '/' + $store.vitalite.totalCount)"
        ></span>
        <svg class="k-chevron" viewBox="0 0 8 14" fill="none" aria-hidden="true">
          <path
            d="m1 1 6 6-6 6"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </span>
    </div>
    <div class="h-2 bg-kinetic-teal/15 rounded-full overflow-hidden">
      <div
        class="h-full bg-kinetic-teal rounded-full transition-all duration-500"
        :style="'width: ' + $store.vitalite.progress + '%'"
      ></div>
    </div>
    <p
      x-show="$store.vitalite.allDone"
      x-transition
      class="mt-3 text-sm font-medium text-kinetic-teal"
    >
      Routine complète — excellent travail !
    </p>
    <p x-show="!$store.vitalite.allDone" class="mt-3 text-sm text-gray-500">Continuer la routine</p>
  </a>

  <!-- Équilibre musculaire (4 semaines) — avancé -->
  <template x-if="balanceWarning">
    <div class="adv-only k-card mb-3">
      <p class="text-xs text-kinetic-electric font-semibold mb-1">Équilibre musculaire</p>
      <p class="text-sm text-gray-300 leading-snug" x-text="balanceWarning"></p>
      <p class="text-xs text-gray-500 mt-1.5 tabular-nums">
        <span x-text="'Push ' + balance.push"></span> ·
        <span x-text="'Pull ' + balance.pull"></span> ·
        <span x-text="'Legs ' + balance.legs"></span> sets sur 4 semaines
      </p>
    </div>
  </template>

  <!-- Objectifs semaine -->
  <div x-show="!$store.goals.loading" x-data="{ editing: false }" class="k-card mb-3">
    <div class="flex items-center justify-between mb-3">
      <h2 class="k-card-title">Objectifs semaine</h2>
      <div class="flex items-center gap-2">
        <span
          x-show="$store.goals.allOk && !editing"
          class="flex items-center gap-1 text-xs font-semibold text-kinetic-teal"
        >
          <svg
            class="w-3.5 h-3.5"
            fill="none"
            stroke="currentColor"
            stroke-width="2.6"
            stroke-linecap="round"
            stroke-linejoin="round"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path d="m5 12.5 4.5 4.5L19 7.5" />
          </svg>
          Atteints
        </span>
        <button
          type="button"
          @click="editing = !editing"
          class="k-icon-btn -my-1"
          :class="editing ? 'text-white' : ''"
          :aria-label="editing ? 'Fermer' : 'Régler les objectifs'"
          :aria-expanded="editing ? 'true' : 'false'"
        >
          <svg
            x-show="!editing"
            class="w-[18px] h-[18px]"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path d="M4 7h10M18 7h2M4 17h4M12 17h8" />
            <circle cx="16" cy="7" r="2" />
            <circle cx="10" cy="17" r="2" />
          </svg>
          <svg
            x-show="editing"
            class="w-4 h-4"
            fill="none"
            stroke="currentColor"
            stroke-width="2.4"
            stroke-linecap="round"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path d="M6 6l12 12M18 6 6 18" />
          </svg>
        </button>
      </div>
    </div>

    <!-- Réglage des objectifs : rangées iOS, valeur saisie à droite -->
    <div x-show="editing" x-transition.opacity class="mb-4">
      <div class="rounded-xl bg-kinetic-ink overflow-hidden">
        <label for="f-dashboard-1" class="k-row cursor-text">
          <span class="flex-1 min-w-0 text-base text-white">Séances</span>
          <input
            id="f-dashboard-1"
            type="number"
            inputmode="numeric"
            min="1"
            max="14"
            step="1"
            x-model.number="$store.goals.targetSessions"
            @change="$store.goals.save(); $store.goals.reload()"
            class="w-20 bg-transparent text-right text-base font-semibold tabular-nums text-white focus:outline-none focus:text-kinetic-neon"
          />
        </label>
        <label for="f-dashboard-2" class="k-row cursor-text">
          <span class="flex-1 min-w-0 text-base text-white">Tonnage (kg)</span>
          <input
            id="f-dashboard-2"
            type="number"
            inputmode="numeric"
            min="0"
            step="100"
            x-model.number="$store.goals.targetTonnageKg"
            @change="$store.goals.save(); $store.goals.reload()"
            placeholder="0 = aucun"
            class="w-28 bg-transparent text-right text-base font-semibold tabular-nums text-white placeholder:font-normal placeholder:text-gray-500 focus:outline-none focus:text-kinetic-neon"
          />
        </label>
      </div>
      <p class="text-xs text-gray-500 mt-2 px-1">
        Par semaine. 0 kg désactive l'objectif de tonnage.
      </p>
    </div>
    <!-- Séances -->
    <div class="mb-3">
      <div class="flex items-baseline justify-between mb-1.5">
        <span class="text-sm text-gray-400">Séances</span>
        <span
          class="text-sm font-semibold tabular-nums"
          :class="$store.goals.sessionsOk ? 'text-kinetic-teal' : 'text-white'"
          x-text="$num.loc($store.goals.doneSessions + ' / ' + $store.goals.targetSessions)"
        ></span>
      </div>
      <div class="h-2 bg-white/10 rounded-full overflow-hidden">
        <div
          class="h-full rounded-full transition-all duration-700"
          :class="$store.goals.sessionsOk
               ? 'bg-kinetic-teal'
               : 'bg-kinetic-neon'"
          :style="'width: ' + $store.goals.sessionsPercent + '%'"
        ></div>
      </div>
    </div>
    <!-- Tonnage si objectif défini -->
    <div x-show="$store.goals.targetTonnageKg > 0">
      <div class="flex items-baseline justify-between mb-1.5">
        <span class="text-sm text-gray-400">Tonnage</span>
        <span
          class="text-sm font-semibold tabular-nums"
          :class="$store.goals.tonnageOk ? 'text-kinetic-teal' : 'text-white'"
          x-text="$num.loc($store.goals.doneTonnageKg + ' / ' + $store.goals.targetTonnageKg + ' kg')"
        ></span>
      </div>
      <div class="h-2 bg-white/10 rounded-full overflow-hidden">
        <div
          class="h-full rounded-full transition-all duration-700"
          :class="$store.goals.tonnageOk
               ? 'bg-kinetic-teal'
               : 'bg-kinetic-neon'"
          :style="'width: ' + $store.goals.tonnagePercent + '%'"
        ></div>
      </div>
    </div>
  </div>

  <!-- Niveau : médaille d'accent + barre d'XP -->
  <div class="k-card p-5">
    <div class="flex items-center gap-4 mb-4">
      <div
        class="w-14 h-14 rounded-full bg-gradient-to-br from-kinetic-neon to-kinetic-electric flex items-center justify-center flex-shrink-0"
        aria-hidden="true"
      >
        <span class="k-stat text-2xl text-gray-950" x-text="$store.xp.currentLevel"></span>
      </div>
      <div class="min-w-0 flex-1">
        <h2 class="k-card-title truncate">
          Niveau <span x-text="$store.xp.currentLevel"></span>
          <span class="font-normal text-gray-500" x-text="'· ' + $store.xp.title"></span>
        </h2>
        <p class="k-stat text-[1.375rem] mt-1">
          <span x-text="$store.xp.xp"></span><span class="k-unit">XP</span>
        </p>
      </div>
    </div>
    <div class="h-2 bg-white/10 rounded-full overflow-hidden">
      <div
        class="h-full bg-kinetic-neon rounded-full transition-all duration-700 ease-out"
        :style="'width: ' + $store.xp.progressPercent + '%'"
      ></div>
    </div>
    <p
      class="text-xs text-gray-500 mt-2.5 tabular-nums"
      x-show="!$store.xp.isMaxLevel"
      x-text="'Encore ' + $store.xp.remaining + ' XP pour le niveau ' + ($store.xp.currentLevel + 1)"
    ></p>
    <p class="text-xs text-kinetic-neon font-medium mt-2.5" x-show="$store.xp.isMaxLevel">
      Niveau maximum atteint
    </p>
  </div>
</div>

<!-- Level-up overlay -->
<div
  x-data="levelUpOverlay"
  x-show="show"
  x-transition:enter="transition ease-out duration-300"
  x-transition:enter-start="opacity-0 scale-90"
  x-transition:enter-end="opacity-100 scale-100"
  x-transition:leave="transition ease-in duration-200"
  x-transition:leave-start="opacity-100 scale-100"
  x-transition:leave-end="opacity-0 scale-90"
  class="fixed inset-0 z-50 flex items-center justify-center pointer-events-none px-4"
  role="status"
  aria-live="polite"
>
  <div class="contents">
    <div
      class="w-full max-w-[17rem] rounded-[28px] bg-kinetic-surface px-6 pt-7 pb-6 text-center shadow-2xl shadow-black/40"
    >
      <div
        class="k-pop mx-auto w-20 h-20 rounded-full bg-kinetic-neon text-gray-950 flex items-center justify-center font-display font-bold text-3xl tabular-nums"
        aria-hidden="true"
        x-text="level"
      ></div>
      <p class="mt-4 text-xl font-display font-bold text-white">
        Niveau <span x-text="level"></span> !
      </p>
      <template x-if="title">
        <div class="mt-4 rounded-xl bg-kinetic-ink px-4 py-3">
          <p class="text-xs text-gray-500">Récompense débloquée</p>
          <p class="mt-0.5 text-base font-semibold text-white" x-text="title"></p>
        </div>
      </template>
    </div>
  </div>
</div>

<!-- Rewards modal (level-up detail) -->
<div
  x-show="$store.rewards.showRewardModal"
  @click.self="$store.rewards.dismissModal()"
  @keydown.escape.window="$store.rewards.showRewardModal && $store.rewards.dismissModal()"
  class="k-backdrop fixed"
  style="display: none"
>
  <!-- `contents` : la feuille garde sa propre animation d'entrée -->
  <div class="contents">
    <div class="k-sheet text-center" role="dialog" aria-modal="true" aria-labelledby="reward-title">
      <div
        class="k-pop mx-auto w-20 h-20 rounded-full bg-kinetic-ink flex items-center justify-center text-5xl leading-none"
        aria-hidden="true"
        x-text="$store.rewards.pendingReward ? $store.rewards.pendingReward.emoji : ''"
      ></div>
      <p class="mt-4 text-sm font-semibold text-kinetic-neon">
        Niveau <span x-text="$store.rewards.pendingLevel"></span> débloqué !
      </p>
      <h3
        id="reward-title"
        class="mt-1 font-display font-bold text-xl text-white"
        x-text="$store.rewards.pendingReward ? $store.rewards.pendingReward.title : ''"
      ></h3>
      <p
        class="mt-1.5 text-sm text-gray-400 leading-snug"
        x-text="$num.loc($store.rewards.pendingReward ? $store.rewards.pendingReward.description : '')"
      ></p>
      <button type="button" @click="$store.rewards.dismissModal()" class="k-btn mt-6">
        Super, merci !
      </button>
    </div>
  </div>
</div>
