version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      capacitor:
        patterns: ["@capacitor/*"]
      supabase:
        patterns: ["@supabase/*"]
      vite-build:
        patterns: ["vite", "vite-*", "vitest", "@vitest/*"]
      typescript:
        patterns: ["typescript", "@typescript-eslint/*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
