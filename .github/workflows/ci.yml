# .github/workflows/ci.yml

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9.15.9'

jobs:
  # ─── 1. Lint ────────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with: { version: '${{ env.PNPM_VERSION }}' }

      - uses: actions/setup-node@v6
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build packages/core
        run: pnpm --filter @kinetic/core build

      - name: Build packages/adapter-web
        run: pnpm --filter @kinetic/adapters-web build

      - name: ESLint
        run: pnpm lint

      - name: Prettier check
        run: pnpm format:check

  # ─── 2. TypeScript ──────────────────────────────────────────
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with: { version: '${{ env.PNPM_VERSION }}' }

      - uses: actions/setup-node@v6
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build packages/core
        run: pnpm --filter @kinetic/core build

      - name: Build packages/adapter-web
        run: pnpm --filter @kinetic/adapters-web build

      - run: pnpm typecheck

  # ─── 4. Tests unitaires ─────────────────────────────────────
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with: { version: '${{ env.PNPM_VERSION }}' }

      - uses: actions/setup-node@v6
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build packages/core
        run: pnpm --filter @kinetic/core build

      - name: Build packages/adapter-web
        run: pnpm --filter @kinetic/adapters-web build

      - name: Run Vitest with coverage
        run: pnpm coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: tests/coverage/
          retention-days: 7

      - name: Coverage summary (PR annotation)
        uses: davelosert/vitest-coverage-report-action@v2
        if: always()
        with:
          json-summary-path: tests/coverage/coverage-summary.json
          json-final-path: tests/coverage/coverage-final.json

  # ─── 5. Tests E2E ───────────────────────────────────────────
  e2e:
    name: E2E Tests
    # Épinglé : ubuntu-latest est passé à 26.04, que Playwright 1.60 ne sait pas
    # équiper (« does not support chromium on ubuntu26.04 »). À relâcher quand
    # Playwright sera mis à jour.
    runs-on: ubuntu-24.04
    needs: [unit]
    strategy:
      fail-fast: false
      matrix:
        project: [mobile-chrome, mobile-safari, desktop-chrome]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with: { version: '${{ env.PNPM_VERSION }}' }

      - uses: actions/setup-node@v6
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build packages/core
        run: pnpm --filter @kinetic/core build

      - name: Build packages/adapter-web
        run: pnpm --filter @kinetic/adapters-web build

      # Jusqu'à 3 tentatives : les miroirs apt du runner tombent parfois en panne
      # DNS (« Temporary failure resolving azure.archive.ubuntu.com »), ce qui
      # faisait échouer le job avant le moindre test.
      - name: Install Playwright browsers
        run: |
          for attempt in 1 2 3; do
            pnpm exec playwright install --with-deps ${{ matrix.project == 'mobile-safari' && 'webkit' || 'chromium' }} && exit 0
            echo "::warning::Installation Playwright échouée (tentative $attempt/3), nouvel essai dans 30 s"
            sleep 30
            sudo apt-get update -q || true
          done
          exit 1

      - name: Build app (needed for E2E)
        run: pnpm build:e2e
        env:
          VITE_SUPABASE_URL: ''
          VITE_SUPABASE_ANON_KEY: ''

      - name: Run E2E tests (${{ matrix.project }})
        run: pnpm e2e --project=${{ matrix.project }}
        env:
          CI: true

      - name: Upload E2E report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-${{ matrix.project }}
          path: tests/e2e/report/
          retention-days: 7

  # ─── 6. Build production ────────────────────────────────────
  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with: { version: '${{ env.PNPM_VERSION }}' }

      - uses: actions/setup-node@v6
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build packages/core
        run: pnpm --filter @kinetic/core build

      - name: Build packages/adapter-web
        run: pnpm --filter @kinetic/adapters-web build

      - name: Build
        run: pnpm build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_VERSION: ${{ github.sha }}

      - name: Check bundle size (gzip metrics + threshold)
        run: node scripts/check-bundle-size.mjs

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: apps/web/dist/
          retention-days: 3

  # ─── 7. Lighthouse (PR + push main) ─────────────────────────
  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with: { version: '${{ env.PNPM_VERSION }}' }

      - uses: actions/setup-node@v6
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: apps/web/dist/

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          uploadArtifacts: true
          temporaryPublicStorage: true
          budgetPath: .github/lighthouse-budget.json
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
