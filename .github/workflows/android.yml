name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9.15.9'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Read app version
        id: version
        run: echo "version=$(node -p "require('./apps/web/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Install Android SDK platform 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "platform-tools"

      - uses: pnpm/action-setup@v6
        with: { version: '${{ env.PNPM_VERSION }}' }

      - uses: actions/setup-node@v6
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build packages/core
        run: pnpm --filter @kinetic/core build

      - name: Build packages/adapter-web
        run: pnpm --filter @kinetic/adapters-web build

      - name: Build web app
        run: pnpm --filter @kinetic/web build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_VERSION: ${{ steps.version.outputs.version }}

      - name: Sync Capacitor
        working-directory: apps/web
        run: pnpm exec cap sync android --inline

      - name: Make gradlew executable
        run: chmod +x apps/web/android/gradlew

      - name: Build debug APK
        working-directory: apps/web/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: mv apps/web/android/app/build/outputs/apk/debug/app-debug.apk kinetic-v${{ steps.version.outputs.version }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: kinetic-v${{ steps.version.outputs.version }}
          path: kinetic-v${{ steps.version.outputs.version }}.apk
          retention-days: 30

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: v${{ steps.version.outputs.version }}
          name: Kinetic ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          overwrite_files: true
          files: kinetic-v${{ steps.version.outputs.version }}.apk
          body: |
            ## Kinetic ${{ steps.version.outputs.version }} — APK Android

            Carnet de musculation hors-ligne : séance du jour, suivi des charges et des records,
            nutrition, poids et mensurations, récupération. Identité « Compétition ».

            **Installer :** télécharge `kinetic-v${{ steps.version.outputs.version }}.apk` sur ton téléphone,
            ouvre-le et autorise l'installation depuis cette source. Version de debug, non signée
            pour le Play Store.

            **Essayer sans compte :** au premier lancement, choisis « Voir la démo ».

            Version web : voir le README.
