name: CodeQL

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '37 4 * * 1' # Lundi 04:37 UTC

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 360
    # CodeQL SARIF upload requires GitHub Advanced Security. When GHAS is not
    # enabled on the repo, the analyze step fails. We keep the job for when
    # GHAS gets enabled, but allow it to soft-fail in the meantime.
    continue-on-error: true
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        continue-on-error: true
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      # SARIF upload requires GitHub Advanced Security. When GHAS is not
      # enabled, the analyze step fails on upload. Mark it continue-on-error
      # so the job still reports as success; remove when GHAS is enabled.
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        continue-on-error: true
        with:
          category: '/language:${{ matrix.language }}'
